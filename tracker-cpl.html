const msalConfig = {

<script>
'use strict';

// ═══════════════════════════════════════════════════════════
// CONFIGURATION
// ═══════════════════════════════════════════════════════════
// CPL_EMAILS et isCPLUser() : voir cpl-config.js

const CPL_TEAM = [
  { name: 'Thomas Oliveira',  email: 'thomas.oliveira@eiffel-ig.com' },
  { name: 'Cassandre Memet',  email: 'cassandre.memet@eiffel-ig.com' },
  { name: 'Manalle Ourrami',  email: 'manalle.ourrami@eiffel-ig.com' },
  { name: 'Jessica Manukyan', email: 'jessica.manukyan@eiffel-ig.com' }
];

const SP = {
  hostname : 'eiffelinvestmentgroup.sharepoint.com',
  sitePath : '/sites/CPLDashboard',
  listName : 'Tracker CPL Demandes',
  libName  : 'CPL-Tracker'
};

// Doc Review (même site CPLDashboard) : analyses soumises au Tracker
const DR = { listName: 'Doc Review Analyses', libName: 'Doc Review' };
const TYPE_VALIDATION_DOC = 'Validation documentation commerciale';
let drListId = null;
let drDriveId = null;
let docReviewContext = null;   // analyse en cours de soumission (paramètre ?docreview=)

const GRAPH_SCOPES_LOGIN = ['User.Read'];
const GRAPH_SCOPES_SP    = ['Sites.ReadWrite.All'];
const GRAPH_SCOPES_MAIL  = ['Mail.Send'];
const CPL_MAIL           = 'cpl@eiffel-ig.com';

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let currentUser  = null;
let isCPL        = false;
let currentView  = 'list';
let selectedReq  = null;
let statusFilter = 'all';
let cplTab       = 'demandes';
let msalInst     = null;
let spSiteId     = null;
let spListId     = null;
let spDriveId    = null;
let spCommListId = null;  // liste Tracker CPL Commentaires
let requests     = [];
let sortCol      = '_ts';
let sortDir      = -1;    // -1 desc, 1 asc
let assignedOnly = false; // filtre "mes demandes assignées" (CPL)
let lastLoadedAt = null;

function sortBy(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = 1; }
  renderList();
}

function workingDays(startTs) {
  if (!startTs) return 0;
  const start = new Date(startTs);
  const end   = new Date();
  start.setHours(0, 0, 0, 0);
  end.setHours(0, 0, 0, 0);
  let count = 0;
  const d = new Date(start);
  while (d < end) {
    const day = d.getDay();
    if (day !== 0 && day !== 6) count++;
    d.setDate(d.getDate() + 1);
  }
  return count;
}



// ═══════════════════════════════════════════════════════════
// AUTH MSAL
// ═══════════════════════════════════════════════════════════
async function initApp() {
  msalInst = new msal.PublicClientApplication(msalConfig);
  await msalInst.initialize();

  const accounts = msalInst.getAllAccounts();
  if (accounts.length > 0) {
    await loginWithAccount(accounts[0]);
  } else {
    showScreen('login');
  }

  document.getElementById('btn-login').onclick = async () => {
    try {
      const result = await msalInst.loginPopup({ scopes: GRAPH_SCOPES_LOGIN });
      await loginWithAccount(result.account);
    } catch(e) {
      console.error('Login failed:', e);
    }
  };

  document.getElementById('btn-logout').onclick = async () => {
    try { await msalInst.logoutPopup(); } catch(e) {}
    showScreen('login');
  };
}

async function loginWithAccount(account) {
  try {
    const token = await getToken(GRAPH_SCOPES_LOGIN, account);
    const p = await graphGet('/me', token);
    setUser({ name: p.displayName, email: p.userPrincipalName, dept: p.department || 'Collaborateur', account });
  } catch(e) {
    console.error('Token error:', e);
    showScreen('login');
  }
}

function setUser(u) {
  currentUser = u;
  isCPL = isCPLUser(u.email);
  const ini = u.name.split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('user-avatar').textContent = ini;
  document.getElementById('user-avatar').style.background = isCPL ? '#D18F41' : '#4B5563';
  document.getElementById('user-name').textContent = u.name;
  document.getElementById('user-role').textContent  = isCPL ? 'Compliance' : 'Collaborateur';
  showScreen('app');
  initSharePointThenLoad();
}

// ═══════════════════════════════════════════════════════════
// GRAPH HELPERS
// ═══════════════════════════════════════════════════════════
async function getToken(scopes, account) {
  const acc = account || currentUser?.account || msalInst.getAllAccounts()[0];
  try {
    const res = await msalInst.acquireTokenSilent({ scopes, account: acc });
    return res.accessToken;
  } catch(e) {
    if (e.name === 'InteractionRequiredAuthError' || e instanceof msal.InteractionRequiredAuthError) {
      const res = await msalInst.acquireTokenPopup({ scopes, account: acc });
      return res.accessToken;
    }
    throw e;
  }
}

async function graphGet(path, token) {
  const t = token || await getToken(GRAPH_SCOPES_SP);
  const res = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    headers: { Authorization: `Bearer ${t}` }
  });
  if (!res.ok) throw new Error(`Graph GET ${path} → ${res.status}`);
  return res.json();
}

async function graphPost(path, body, scopes) {
  const t = await getToken(scopes || GRAPH_SCOPES_SP);
  const res = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    method: 'POST',
    headers: { Authorization: `Bearer ${t}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) { const e = await res.text(); throw new Error(`Graph POST ${path} → ${res.status}: ${e}`); }
  return (res.status === 204 || res.status === 202) ? null : res.json();
}

async function graphPatch(path, body) {
  const t = await getToken(GRAPH_SCOPES_SP);
  const res = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    method: 'PATCH',
    headers: { Authorization: `Bearer ${t}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`Graph PATCH ${path} → ${res.status}`);
  return (res.status === 204 || res.status === 202) ? null : res.json();
}

async function graphPut(path, data, contentType) {
  const t = await getToken(GRAPH_SCOPES_SP);
  const res = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${t}`, 'Content-Type': contentType || 'application/octet-stream' },
    body: data
  });
  if (!res.ok) throw new Error(`Graph PUT ${path} → ${res.status}`);
  return res.json();
}

// ═══════════════════════════════════════════════════════════
// SHAREPOINT — initialisation + chargement
// ═══════════════════════════════════════════════════════════
async function initSharePointThenLoad() {
  setListLoading(true);
  try {
    // 1. Site ID
    const site = await graphGet(`/sites/${SP.hostname}:${SP.sitePath}`);
    spSiteId = site.id;

    // 2. List ID
    const lists = await graphGet(`/sites/${spSiteId}/lists?$filter=displayName eq '${encodeURIComponent(SP.listName)}'`);
    spListId = lists.value[0]?.id;
    if (!spListId) throw new Error(`Liste "${SP.listName}" introuvable sur SharePoint`);

    // 3. Drive ID (bibliothèque CPL-Tracker)
    const drives = await graphGet(`/sites/${spSiteId}/drives`);
    const drive  = drives.value.find(d => d.name === SP.libName);
    spDriveId    = drive?.id || null;

    // 4. Liste commentaires
    const commLists = await graphGet(`/sites/${spSiteId}/lists?$filter=displayName eq 'Tracker CPL commentaires'`);
    spCommListId = commLists.value[0]?.id || null;
    if (!spCommListId) console.warn('Liste "Tracker CPL commentaires" introuvable');

    // 5. Doc Review (facultatif : utile seulement pour les demandes issues d'une analyse)
    try {
      const drLists = await graphGet(`/sites/${spSiteId}/lists?$filter=displayName eq '${encodeURIComponent(DR.listName)}'`);
      drListId = drLists.value.length === 1 ? drLists.value[0].id : null;
      const drDrives = drives.value.filter(d => d.name === DR.libName);
      drDriveId = drDrives.length === 1 ? drDrives[0].id : null;
    } catch (e) { console.warn('Doc Review non disponible :', e.message); }

    await loadRequests();
    await handleDocReviewParam();
  } catch(e) {
    console.error('SharePoint init error:', e);
    setListLoading(false);
    showListError(e.message);
  }
}

async function loadRequests() {
  setListLoading(true);
  try {
    const data = await graphGet(
      `/sites/${spSiteId}/lists/${spListId}/items?expand=fields&$top=9999`
    );
    requests = data.value.map(item => {
      const f = item.fields;
      return {
        spId   : item.id,
        ref    : f.Title        || '',
        objet  : f.Objet        || '',
        type   : f.Sujet        || '',
        prio   : f.Priorit_x00e9_ || f.Priorité || f.Priorite || '',
        statut : f.Statut       || 'Soumis',
        date   : f.DateSoumission ? new Date(f.DateSoumission).toLocaleDateString('fr-FR') : '',
        updated: item.lastModifiedDateTime ? new Date(item.lastModifiedDateTime).toLocaleDateString('fr-FR') : '',
        from   : f.Demandeur    || '',
        email  : f.DemandeurEmail || '',
        dept   : f.DemandeurDept  || '',
        desc   : f.Description  || '',
        deadline: f.Deadline    || '',
        sla           : f.DateSoumission ? workingDays(new Date(f.DateSoumission).getTime()) : 0,
        responsable   : f.ResponsableCPL || '',
        followers     : f.CCEmails || '',
        refDocReview  : f.RefDocReview || '',
        historique    : (() => { try { return f.HistoriqueStatuts ? JSON.parse(f.HistoriqueStatuts) : []; } catch(e) { return []; } })(),
        _ts           : f.DateSoumission ? new Date(f.DateSoumission).getTime() : 0,
        _lastModified : item.lastModifiedDateTime ? new Date(item.lastModifiedDateTime).getTime() : 0,
        lastComment   : f.DernierCommentaire ? new Date(f.DernierCommentaire).getTime() : 0,
        comments: []
      };
    }).sort((a, b) => b._ts - a._ts);
    // Initialiser lastSeen pour les demandes jamais ouvertes
    requests.forEach(r => {
      const key = `lastSeen_${r.ref}`;
      if (!localStorage.getItem(key)) localStorage.setItem(key, Date.now().toString());
    });
    lastLoadedAt = new Date();
    setListLoading(false);
    renderList();
    return true;
  } catch(e) {
    console.error('Erreur chargement demandes:', e);
    setListLoading(false);
    showListError(e.message);
    return false;
  }
}

function setListLoading(on) {
  const el = document.getElementById('list-loading');
  if (el) el.style.display = on ? 'flex' : 'none';
}

function showListError(msg) {
  const el = document.getElementById('list-error');
  if (el) { el.textContent = `Erreur : ${msg}`; el.style.display = 'block'; }
}

function showToast(message, type) {
  type = type || 'info';
  const icons = { success: '✓', error: '✕', info: 'i' };
  const container = document.getElementById('toast-container');
  if (!container) return;
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.innerHTML = `
    <span class="toast-icon">${icons[type] || icons.info}</span>
    <span>${message}</span>
    <button class="toast-close" aria-label="Fermer">&times;</button>`;
  const dismiss = () => {
    toast.classList.add('hide');
    setTimeout(() => toast.remove(), 180);
  };
  toast.querySelector('.toast-close').onclick = dismiss;
  container.appendChild(toast);
  setTimeout(dismiss, 4500);
}

const COLS_DEF = [
  { id: 'ref',         label: 'Référence',      always: true,  cplOnly: false, defaultW: 120 },
  { id: 'objet',       label: 'Objet',           always: false, cplOnly: false, defaultW: 220 },

  { id: 'dept',        label: 'Département',     always: false, cplOnly: true,  defaultW: 110 },
  { id: 'prio',        label: 'Priorité',        always: false, cplOnly: false, defaultW: 85  },
  { id: 'statut',      label: 'Statut',          always: false, cplOnly: false, defaultW: 160 },
  { id: 'date',        label: 'Soumis le',       always: false, cplOnly: false, defaultW: 90  },
  { id: 'deadline',    label: 'Deadline',        always: false, cplOnly: false, defaultW: 90  },
  { id: 'responsable', label: 'Responsable CPL', always: false, cplOnly: true,  defaultW: 145 },
];

function getColConfig()  { try { return JSON.parse(localStorage.getItem('tracker_cpl_columns_v1') || '{}'); } catch(e) { return {}; } }
function getColWidths()  { try { return JSON.parse(localStorage.getItem('tracker_cpl_colwidths_pct_v1') || '{}'); } catch(e) { return {}; } }

function isColVisible(colId, cfg, cplView) {
  const def = COLS_DEF.find(c => c.id === colId);
  if (!def) return false;
  if (def.always) return true;
  if (def.cplOnly && !cplView) return false;
  return cfg[colId] !== false;
}

// Calcule les pourcentages réels des colonnes actives (somme = 100 % exactement).
// Utilise les valeurs stockées si disponibles, sinon les defaultW proportionnels.
function computeActivePcts(activeCols, storedPcts) {
  const totalDefault = activeCols.reduce((s, c) => s + c.defaultW, 0);
  const raw = activeCols.map(c => ({
    id: c.id,
    pct: storedPcts[c.id] != null ? storedPcts[c.id] : (c.defaultW / totalDefault * 100)
  }));
  const sum = raw.reduce((s, p) => s + p.pct, 0);
  return Object.fromEntries(raw.map(p => [p.id, sum > 0 ? p.pct / sum * 100 : 100 / raw.length]));
}

function toggleCol(colId, visible) {

}

// Redimensionnement des colonnes — delta en % de la largeur du tableau
const COL_MIN_PCT = 4; // ~50px sur un écran 1200px
let _resizeCol = null, _resizeNextCol = null;
let _resizeStartX = 0, _resizeStartPct = 0, _resizeNextStartPct = 0, _resizeTableW = 0;

function startColResize(e, colId) {
  const cfg    = getColConfig();
  const active = COLS_DEF.filter(c => isColVisible(c.id, cfg, isCPL));
  const idx    = active.findIndex(c => c.id === colId);
  if (idx < 0 || idx >= active.length - 1) return; // dernière colonne : pas de poignée
  _resizeCol     = colId;
  _resizeNextCol = active[idx + 1].id;
  _resizeStartX  = e.clientX;
  const table    = document.querySelector('.cpl-table');
  _resizeTableW  = table ? table.offsetWidth : 1000;
  const ths      = document.querySelectorAll('.cpl-table thead th');
  _resizeStartPct     = ths[idx]     ? ths[idx].offsetWidth     / _resizeTableW * 100 : 10;
  _resizeNextStartPct = ths[idx + 1] ? ths[idx + 1].offsetWidth / _resizeTableW * 100 : 10;
  document.addEventListener('mousemove', _onColResize);
  document.addEventListener('mouseup',   _stopColResize);
}

function _onColResize(e) {
  if (!_resizeCol || !_resizeTableW) return;
  const delta = (e.clientX - _resizeStartX) / _resizeTableW * 100;
  let pctA = _resizeStartPct + delta;
  let pctB = _resizeNextStartPct - delta;
  // Appliquer le minimum sur les deux colonnes
  if (pctA < COL_MIN_PCT) { pctB += pctA - COL_MIN_PCT; pctA = COL_MIN_PCT; }
  if (pctB < COL_MIN_PCT) { pctA += pctB - COL_MIN_PCT; pctB = COL_MIN_PCT; }
  pctA = Math.max(COL_MIN_PCT, pctA);
  pctB = Math.max(COL_MIN_PCT, pctB);
  const cfg    = getColConfig();
  const active = COLS_DEF.filter(c => isColVisible(c.id, cfg, isCPL));
  const idxA   = active.findIndex(c => c.id === _resizeCol);
  const ths    = document.querySelectorAll('.cpl-table thead th');
  if (ths[idxA])     ths[idxA].style.width     = pctA.toFixed(2) + '%';
  if (ths[idxA + 1]) ths[idxA + 1].style.width = pctB.toFixed(2) + '%';
}

function _stopColResize() {
  if (!_resizeCol) return;
  // Lire les largeurs depuis le DOM et normaliser à 100 %
  const cfg    = getColConfig();
  const active = COLS_DEF.filter(c => isColVisible(c.id, cfg, isCPL));
  const ths    = document.querySelectorAll('.cpl-table thead th');
  const widths = {};
  let sum = 0;
  active.forEach((c, i) => {
    const w = ths[i] ? ths[i].offsetWidth / _resizeTableW * 100 : 0;
    widths[c.id] = w; sum += w;
  });
  if (sum > 0) active.forEach(c => { widths[c.id] = widths[c.id] / sum * 100; });
  localStorage.setItem('tracker_cpl_colwidths_pct_v1', JSON.stringify(widths));
  _resizeCol = null; _resizeNextCol = null;
  document.removeEventListener('mousemove', _onColResize);
  document.removeEventListener('mouseup',   _stopColResize);
}

  const colsCfg    = getColConfig();
  const storedPcts = getColWidths();

  const pctMap     = computeActivePcts(activeCols, storedPcts);

    r.email === currentUser.email ||
    (r.followers || '').toLowerCase()
      .split(',')
      .map(e => e.trim())
      .includes(currentUser.email.toLowerCase())
  );
  if (cplView && assignedOnly) all = all.filter(r => r.responsable === currentUser.name);
  const filtered = statusFilter === 'all' ? all : all.filter(r => r.statut === statusFilter);
  const open     = all.filter(r => ['À traiter',"En cours d'analyse","En attente d'informations"].includes(r.statut)).length;
  const awaiting = all.filter(r => r.statut === "En attente d'informations").length;
  const overSLA  = requests.filter(r => r.sla > 5 && ['À traiter',"En cours d'analyse","En attente d'informations"].includes(r.statut)).length;

  const STATUSES = ['all','À traiter',"En cours d'analyse","En attente d'informations",'Traité','Clôturé','Rejeté'];
  const BG = {'À traiter':'#EFF6FF',"En cours d'analyse":'#FFF7ED',"En attente d'informations":'#FEFCE8','Traité':'#F0FDF4',Clôturé:'#ECFDF5',Rejeté:'#FEF2F2'};
  const CO = {'À traiter':'#2563EB',"En cours d'analyse":'#C2410C',"En attente d'informations":'#B45309','Traité':'#15803D',Clôturé:'#065F46',Rejeté:'#DC2626'};
  const BO = {'À traiter':'#BFDBFE',"En cours d'analyse":'#FED7AA',"En attente d'informations":'#FDE68A','Traité':'#BBF7D0',Clôturé:'#6EE7B7',Rejeté:'#FECACA'};

  const filterBtns = STATUSES.map(s => {
    const active = statusFilter === s;
    const count  = s === 'all' ? all.length : all.filter(r => r.statut === s).length;
    let st = '';
    if (active && s !== 'all') st = `style="background:${BG[s]};color:${CO[s]};border-color:${BO[s]}"`;
    else if (active)            st = `style="background:var(--navy);color:#fff;border-color:var(--navy)"`;
    return `<button class="filter-pill" data-s="${s}" onclick="setFilter(this.dataset.s)" ${st}>${s==='all'?'Tous':s}${count>0?` <span style="opacity:.6">(${count})</span>`:''}</button>`;
  }).join('');

  const sortedFiltered = [...filtered].sort((a, b) => {
    let va = a[sortCol] ?? '';
    let vb = b[sortCol] ?? '';
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    return va < vb ? -sortDir : va > vb ? sortDir : 0;
  });

  const arrow = col => sortCol === col ? (sortDir === 1 ? ' ↑' : ' ↓') : ' ↕';

  const th = (c, isLast) => {
    const pct    = (pctMap[c.id] || (100 / colCount)).toFixed(2);
    const handle = isLast ? '' :
      `<span onmousedown="event.stopPropagation();startColResize(event,'${c.id}')"
        style="position:absolute;right:0;top:0;bottom:0;width:6px;cursor:col-resize;z-index:1"></span>`;
    return `<th onclick="sortBy('${c.id}')" style="cursor:pointer;white-space:nowrap;overflow:hidden;position:relative;width:${pct}%">
      ${c.label}<span style="opacity:.4;font-size:10px">${arrow(c.id)}</span>
      ${handle}
    </th>`;
  };

  const theadCells = activeCols.map((c, i) => th(c, i === activeCols.length - 1)).join('');

  const rows = sortedFiltered.map(req => {
    const over = cplView && req.sla > 5 && ['À traiter',"En cours d'analyse","En attente d'informations"].includes(req.statut);

  const exportBtn = isCPL && cplTab === 'demandes' ? `
    <button class="btn-secondary" onclick="exportCSV()">
      ${svgIcon('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>')}
      Exporter CSV
    </button>` : '';

  const colCheckboxes = COLS_DEF
    .filter(c => !c.always && (!c.cplOnly || cplView))
    .map(c => {
      const vis = isColVisible(c.id, colsCfg, cplView);
      return `<label style="display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer;padding:3px 0">
        <input type="checkbox" ${vis ? 'checked' : ''} onchange="toggleCol('${c.id}',this.checked)" style="cursor:pointer"> ${c.label}
      </label>`;
    }).join('');

  const colBtn = isTableView ? `
    <div style="position:relative;display:inline-block">
      <button class="btn-secondary" id="col-panel-btn" onclick="event.stopPropagation();toggleColPanel()" title="Personnaliser les colonnes">
        ${svgIcon('<line x1="8" y1="6" x2="21" y2="6"/><line x1="8" y1="12" x2="21" y2="12"/><line x1="8" y1="18" x2="21" y2="18"/><line x1="3" y1="6" x2="3.01" y2="6"/><line x1="3" y1="12" x2="3.01" y2="12"/><line x1="3" y1="18" x2="3.01" y2="18"/>')}
        Colonnes
      </button>
      <div id="col-panel" style="display:none;position:absolute;right:0;top:calc(100% + 4px);background:#fff;border:1px solid var(--border);border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,.12);padding:12px 14px;z-index:200;min-width:200px">
        <div style="font-size:12px;font-weight:600;color:var(--navy);margin-bottom:8px">Colonnes visibles</div>
        ${colCheckboxes}
        <div style="border-top:1px solid var(--border);margin-top:8px;padding-top:8px">
          <button onclick="resetCols()" style="font-size:11.5px;color:var(--text-secondary);background:none;border:none;cursor:pointer;padding:0;font-family:inherit">Réinitialiser</button>
        </div>
      </div>
    </div>` : '';

  const assignedToggle = cplView ? `
    <button class="assigned-toggle ${assignedOnly?'on':''}" onclick="toggleAssignedOnly()">
      ${svgIcon('<path d="M20 21v-2a4 4 0 0 0-4-4H8a4 4 0 0 0-4 4v2"/><circle cx="12" cy="7" r="4"/>')}
      Mes demandes assignées
    </button>` : '';

  const searchBox = `
    <input type="text" placeholder="Rechercher..." oninput="searchTable(this.value)"
      style="${isCPL?'':'margin-left:auto;'}padding:4px 10px;border-radius:6px;border:1px solid var(--border);font-size:12px;font-family:inherit;width:150px">`;

  const content = (cplTab === 'dashboard' && isCPL) ? renderDashboard() : `
    <div class="cpl-filters">${filterBtns}${assignedToggle}${searchBox}</div>
    <div class="table-wrapper" style="overflow-x:auto;width:100%">
      <table class="data-table cpl-table">
        <thead><tr>${theadCells}</tr></thead>
        <tbody id="req-tbody">${rows}</tbody>
      </table>
    </div>`;

function exportCSV() {
  const headers = ['Référence','Objet','Type','Priorité','Statut','Demandeur','Département','Soumis le','Activité'];
  const lines = [headers.join(';')].concat(
    requests.map(r => [r.ref,r.objet,r.type,r.prio,r.statut,r.from,r.dept,r.date,r.updated].join(';'))
  );
  const blob = new Blob(['\uFEFF'+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `tracker-cpl-${new Date().toISOString().slice(0,10)}.csv`; a.click();
}

// DASHBOARD KPI (données réelles)
// ═══════════════════════════════════════════════════════════
function renderDashboard() {
  const open    = requests.filter(r => ['À traiter',"En cours d'analyse","En attente d'informations"].includes(r.statut)).length;
  const resolved= requests.filter(r => ['Traité','Clôturé'].includes(r.statut)).length;
  const rejected= requests.filter(r => r.statut === 'Rejeté').length;
  const total   = requests.length;

  // Délai moyen de traitement (demandes traitées)
  const resolvedReqs = requests.filter(r => r.statut === 'Traité' || r.statut === 'Clôturé');

  // Temps cumulé passé en "En attente d'informations" : ce délai dépend du demandeur,
  // pas de la Compliance, donc il est soustrait du délai moyen de traitement.
  const waitingInfoTime = (historique, endTs) => {
    if (!historique || !historique.length) return 0;
    const entries = historique.filter(h => h.date)
      .sort((a,b) => new Date(a.date) - new Date(b.date));
    let waiting = 0;
    entries.forEach((h, i) => {
      if (h.statut !== "En attente d'informations") return;
      const startW = new Date(h.date).getTime();
      const endW = i + 1 < entries.length ? new Date(entries[i+1].date).getTime() : endTs;
      if (endW > startW) waiting += endW - startW;
    });
    return waiting;
  };

  const avgDays = (() => {
    if (!resolvedReqs.length) return '—';
    let total = 0, count = 0;
    resolvedReqs.forEach(r => {
      const start = r._ts || 0;
      if (!start) return;
      let end = 0;
      if (r.historique && r.historique.length) {
        const traitéEntry = [...r.historique].reverse().find(h => h.statut === 'Traité' || h.statut === 'Clôturé');
        if (traitéEntry?.date) end = new Date(traitéEntry.date).getTime();
      }
      if (!end) end = r._lastModified || 0;
      if (!end || end <= start) return;
      total += Math.max(0, (end - start) - waitingInfoTime(r.historique, end));
      count++;
    });
    if (!count) return '—';
    return (total / count / (1000*60*60*24)).toFixed(1);
  })();

  // Volume par mois (6 derniers mois)
  const now = new Date();
  const months = Array.from({length:6}, (_,i) => {
    const d = new Date(now.getFullYear(), now.getMonth() - 5 + i, 1);
    return { label: d.toLocaleDateString('fr-FR',{month:'short'}), year: d.getFullYear(), month: d.getMonth(), count: 0 };
  });
  requests.forEach(r => {
    if (!r._ts) return;
    const d = new Date(r._ts);
    const m = months.find(x => x.year === d.getFullYear() && x.month === d.getMonth());
    if (m) m.count++;
  });
  const maxVol = Math.max(...months.map(m => m.count), 1);

  const bars = months.map(m => `
    <div class="bar-item">
      <div class="bar-fill" style="height:${Math.round((m.count/maxVol)*110)}px" title="${m.count} demandes"></div>
      <span class="bar-lbl">${m.label}</span>
    </div>`).join('');

  // Répartition par type
  const typeCount = {};
  requests.forEach(r => { if(r.type) typeCount[r.type] = (typeCount[r.type]||0) + 1; });
  const typeEntries = Object.entries(typeCount).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const PIE_C = ['#00143B','#D18F41','#006660','#2563EB','#7C3AED','#6B7280'];

  let pie = '<svg viewBox="0 0 100 100" width="110" height="110">';
  if (typeEntries.length === 0) {
    pie += '<circle cx="50" cy="50" r="47" fill="#F3F4F6"/><circle cx="50" cy="50" r="26" fill="#fff"/>';
  } else {
    const totalT = typeEntries.reduce((s,[,v])=>s+v,0);
    let angle = -Math.PI/2;
    typeEntries.forEach(([,count],i) => {
      const r2 = (count/totalT)*2*Math.PI;
      const x1=50+47*Math.cos(angle),y1=50+47*Math.sin(angle); angle+=r2;
      const x2=50+47*Math.cos(angle),y2=50+47*Math.sin(angle);
      pie += `<path d="M50,50 L${x1.toFixed(1)},${y1.toFixed(1)} A47,47 0 ${r2>Math.PI?1:0},1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${PIE_C[i%PIE_C.length]}" stroke="#fff" stroke-width="1.5"/>`;
    });
    pie += '<circle cx="50" cy="50" r="26" fill="#fff"/>';
  }
  pie += '</svg>';

  const legend = typeEntries.length ? typeEntries.map(([name,count],i) => `
    <div class="pie-row">
      <div class="pie-dot" style="background:${PIE_C[i%PIE_C.length]}"></div>
      <span class="pie-name">${name}</span>
      <span class="pie-pct">${count}</span>
    </div>`).join('') : '<p style="font-size:12px;color:var(--text-secondary)">Aucune donnée</p>';

  // Répartition par département
  const deptCount = {};
  requests.forEach(r => { if(r.dept) deptCount[r.dept] = (deptCount[r.dept]||0)+1; });
  const deptRows = Object.entries(deptCount).sort((a,b)=>b[1]-a[1]).map(([dept,count]) => `
    <tr><td style="padding:7px 8px;color:#374151">${dept}</td>
    <td style="padding:7px 8px;text-align:right;font-weight:500;color:var(--navy)">${count}</td>
    <td style="padding:7px 8px;text-align:right;color:var(--text-secondary)">${total?Math.round(count/total*100):0}%</td></tr>`).join('');

  return `
    <div style="display:flex;justify-content:flex-end;margin-bottom:10px">
      <button class="btn-secondary" id="btn-capture-dashboard" onclick="captureDashboard()">
        ${svgIcon('<path d="M23 19a2 2 0 0 1-2 2H3a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h4l2-3h6l2 3h4a2 2 0 0 1 2 2z"/><circle cx="12" cy="13" r="4"/>')}
        Copier en image
      </button>
    </div>
    <div id="dashboard-capture" style="background:var(--panel-bg);padding:4px">
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon" style="background:#EFF6FF">${svgIcon('<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>','stroke="#2563EB"')}</div>
        <div class="kpi-val">${open}</div><div class="kpi-lbl">Demandes ouvertes</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon" style="background:#F0FDF4">${svgIcon('<polyline points="20 6 9 17 4 12"/>','stroke="#15803D"')}</div>
        <div class="kpi-val">${resolved}</div><div class="kpi-lbl">Résolues / Clôturées</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon" style="background:#FEF2F2">${svgIcon('<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>','stroke="#DC2626"')}</div>
        <div class="kpi-val">${rejected}</div><div class="kpi-lbl">Rejetées</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon" style="background:#FFF7ED">${svgIcon('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>','stroke="#D18F41"')}</div>
        <div class="kpi-val">${avgDays}${avgDays !== '—' ? 'j' : ''}</div><div class="kpi-lbl">Délai moyen traitement <span style="opacity:.7">(hors attente d'informations)</span></div>
      </div>
    </div>
    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-title">Volume — 6 derniers mois</div>
        <div class="bar-chart">${bars}</div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Par type de demande</div>
        <div style="display:flex;align-items:center;gap:14px">${pie}<div style="flex:1">${legend}</div></div>
      </div>
    </div>
    <div class="sla-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="chart-title" style="margin:0">Demandes par département</div>
        <span style="font-size:11px;color:var(--text-secondary)">${total} demande${total>1?'s':''} au total</span>
      </div>
      ${deptRows ? `<table class="sla-table">
        <thead><tr><th>Département</th><th style="text-align:right">Demandes</th><th style="text-align:right">Part</th></tr></thead>
        <tbody>${deptRows}</tbody>
      </table>` : '<p style="font-size:13px;color:var(--text-secondary)">Aucune donnée disponible.</p>'}
    </div>
    </div>`;
}

// CAPTURE DU DASHBOARD (image prête à coller dans un reporting)
// ═══════════════════════════════════════════════════════════
async function captureDashboard() {
  const el = document.getElementById('dashboard-capture');
  if (!el || typeof html2canvas === 'undefined') {
    showToast('Capture indisponible sur cette page.', 'error');
    return;
  }
  const btn = document.getElementById('btn-capture-dashboard');
  btn.disabled = true;

  try {
    const canvas = await html2canvas(el, { backgroundColor: '#f4f5f8', scale: 2, logging: false });
    const blob = await new Promise(res => canvas.toBlob(res, 'image/png'));
    if (!blob) throw new Error('Génération de l\'image impossible.');

    try {
      await navigator.clipboard.write([new ClipboardItem({ 'image/png': blob })]);
      showToast('Dashboard copié dans le presse-papier, collez-le dans votre reporting.', 'success');
    } catch(clipErr) {
      // Presse-papier indisponible (permissions, navigateur) : téléchargement en secours
      const a = document.createElement('a');
      a.href = URL.createObjectURL(blob);
      a.download = `tracker-cpl-dashboard-${new Date().toISOString().slice(0,10)}.png`;
      a.click();
      URL.revokeObjectURL(a.href);
      showToast('Presse-papier indisponible : image téléchargée à la place.', 'info');
    }
  } catch(e) {
    console.error('Capture dashboard:', e);
    showToast(`Erreur lors de la capture : ${e.message}`, 'error');
  } finally {
    btn.disabled = false;
  }
}

function addFilesToList(newFiles) {
  for (const f of newFiles) {
    if (!allSelectedFiles.find(x => x.name === f.name && x.size === f.size))
      allSelectedFiles.push(f);
  }
  renderFileList();
}

function removeFile(index) {
  allSelectedFiles.splice(index, 1);
  renderFileList();
}

function renderFileList() {
  const list = document.getElementById('file-list');
  if (!list) return;
  if (!allSelectedFiles.length) { list.innerHTML = ''; return; }
  list.innerHTML = allSelectedFiles.map((f, i) => {
    const ext = f.name.split('.').pop().toLowerCase();
    const color = ext === 'pdf' ? '#DC2626'
      : ['xls','xlsx'].includes(ext) ? '#16A34A'
      : ['doc','docx'].includes(ext) ? '#2563EB'
      : '#6B7280';
    const size = f.size >= 1024*1024
      ? (f.size/(1024*1024)).toFixed(1)+' Mo'
      : (f.size/1024).toFixed(0)+' Ko';
    return `<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#374151;padding:3px 0">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span style="flex:1">${f.name}</span>
      <span style="color:#9CA3AF">${size}</span>
      <button onclick="removeFile(${i})" style="background:none;border:none;cursor:pointer;color:#9CA3AF;font-size:16px;line-height:1;padding:0 2px" title="Retirer">×</button>
    </div>`;
  }).join('');
}

async function uploadFile(ref, file) {
  if (!spDriveId) return null;
  const encoded = encodeURIComponent(file.name);
  const basePath = `/sites/${spSiteId}/drives/${spDriveId}/items/root:/${ref}/${encoded}`;

  if (file.size <= 4 * 1024 * 1024) {
    const buf = await file.arrayBuffer();
    return await graphPut(`${basePath}:/content`, buf, file.type || 'application/octet-stream');
  } else {
    const session = await graphPost(`${basePath}:/createUploadSession`, {
      item: { '@microsoft.graph.conflictBehavior': 'replace' }
    });
    const chunkSize = 3 * 1024 * 1024;
    const buf = await file.arrayBuffer();
    let start = 0; let result = null;
    while (start < file.size) {
      const end = Math.min(start + chunkSize, file.size);
      const chunk = buf.slice(start, end);
      const res = await fetch(session.uploadUrl, {
        method: 'PUT',
        headers: { 'Content-Range': `bytes ${start}-${end-1}/${file.size}`, 'Content-Length': String(end - start) },
        body: chunk
      });
      if (res.ok) result = await res.json().catch(() => null);
      start = end;
    }
    return result;
  }
}

        const uploadDate = f.createdDateTime ? new Date(f.createdDateTime).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
        return `

async function uploadFromDetail() {

async function submitRequest() {
  const dept     = document.getElementById('f-dept').value;
  const type     = document.getElementById('f-type').value;
  const objet    = document.getElementById('f-objet').value.trim();
  const desc     = document.getElementById('f-desc-editor')?.innerHTML || '';
  const descText = desc.replace(/<[^>]*>/g, '').trim();
  const deadline = document.getElementById('f-deadline').value;

  if (!dept || !type || !objet || !descText) {
    showToast('Veuillez remplir tous les champs obligatoires (*)', 'error');
    return;
  }
  if (['Élevé','Critique'].includes(selPrio) && !deadline) {
    showToast('Une deadline est obligatoire pour les priorités Élevé et Critique.', 'error');
    return;
  }

  const btn = document.querySelector('[onclick="submitRequest()"]');
  btn.disabled = true;
  btn.textContent = 'Envoi en cours...';

  // Demande issue de Doc Review : l'analyse est relue juste avant la création (une seule soumission)
  if (docReviewContext) {
    try {
      const fresh = await loadDocReviewAnalysis(docReviewContext.ref);
      const reason = docReviewIneligibility(fresh);
      if (reason) throw new Error(reason);
      docReviewContext = fresh;
    } catch (e) {
      showToast(`Soumission de l'analyse ${escHtml(docReviewContext.ref)} impossible : ${escHtml(e.message)}.`, 'error');
      btn.disabled = false;
      btn.textContent = 'Soumettre la demande';
      return;
    }
  }

  try {
    const now  = new Date();
    const year = now.getFullYear();

    // 1. Créer l'item dans la liste SharePoint
    const itemBody = {
      fields: {
        Title                    : 'CPL-EN-COURS',
        Objet                    : objet,
        Sujet                    : type,
        'Priorit_x00e9_'         : selPrio,
        Statut                   : 'À traiter',
        Description              : desc,
        Demandeur                : currentUser.name,
        DemandeurEmail           : currentUser.email,
        DemandeurDept            : dept,
        DateSoumission           : now.toISOString(),
        HistoriqueStatuts        : JSON.stringify([{ date: now.toISOString(), statut: 'À traiter', par: currentUser.name }]),
        ...(deadline ? { Deadline: deadline } : {})
      }
    };
    const created = await graphPost(`/sites/${spSiteId}/lists/${spListId}/items`, itemBody);
    const spItemId = created.id;

    // 2. Générer la référence CPL et mettre à jour le titre
    const ref = `CPL-${year}-${String(spItemId).padStart(4, '0')}`;
    await graphPatch(`/sites/${spSiteId}/lists/${spListId}/items/${spItemId}/fields`, { Title: ref });

    // 2b. Patch séparé pour CCEmails (colonne parfois rejetée dans le POST initial)
    const followersValue = followersSelected.map(f => f.email).join(',');
    if (followersValue) {
      try {
        await graphPatch(
          `/sites/${spSiteId}/lists/${spListId}/items/${spItemId}/fields`,
          { CCEmails: followersValue }
        );
      } catch(e) {}
    }

    // 3. Créer le dossier dans la bibliothèque CPL-Tracker
    if (spDriveId) {
      try {
        await graphPost(`/sites/${spSiteId}/drives/${spDriveId}/items/root/children`, {
          name: ref,
          folder: {},
          '@microsoft.graph.conflictBehavior': 'replace'
        });
      } catch(e) { console.warn('Dossier SP non créé:', e); }
    }

    // 4. Upload des pièces jointes
    if (allSelectedFiles.length && spDriveId) {
      btn.textContent = `Upload des fichiers (0/${allSelectedFiles.length})...`;
      let i = 0;
      for (const file of allSelectedFiles) {
        try {
          await uploadFile(ref, file);
          i++;
          btn.textContent = `Upload des fichiers (${i}/${allSelectedFiles.length})...`;
        } catch(e) { console.warn(`Erreur upload ${file.name}:`, e); }
      }
    }

    // 4b. Demande issue de Doc Review : liaison, copie du fichier d'origine et du rapport,
    //     puis seulement ensuite marquage de l'analyse comme soumise
    let docReviewError = null;
    const docReviewRef = docReviewContext ? docReviewContext.ref : null;
    if (docReviewContext) {
      btn.textContent = 'Copie des fichiers Doc Review...';
      try {
        await graphPatch(`/sites/${spSiteId}/lists/${spListId}/items/${spItemId}/fields`, { RefDocReview: docReviewContext.ref });
        await finalizeDocReviewLink(docReviewContext, ref);
      } catch (e) {
        console.error('Liaison Doc Review :', e);
        docReviewError = e.message;
      }
    }

    // 5. Envoyer le mail à cpl@eiffel-ig.com (non bloquant)
    try {
      const mailBody = `
        <div style="font-family:Arial,sans-serif;font-size:14px;color:#111">
          <p>Bonjour,</p>
          <p>Une nouvelle demande a été soumise via le <strong>Tracker CPL</strong>.</p>
          <table style="border-collapse:collapse;width:100%;margin:16px 0;border:1px solid #E5E7EB">
            <tr style="background:#F4F5F8"><td style="padding:8px 12px;font-weight:600;width:180px">Référence</td><td style="padding:8px 12px">${ref}</td></tr>
            <tr><td style="padding:8px 12px;font-weight:600">Demandeur</td><td style="padding:8px 12px">${currentUser.name} — ${currentUser.dept}</td></tr>
            <tr style="background:#F4F5F8"><td style="padding:8px 12px;font-weight:600">Type</td><td style="padding:8px 12px">${type}</td></tr>
            <tr><td style="padding:8px 12px;font-weight:600">Priorité</td><td style="padding:8px 12px">${selPrio}</td></tr>
            <tr style="background:#F4F5F8"><td style="padding:8px 12px;font-weight:600">Objet</td><td style="padding:8px 12px">${objet}</td></tr>
            <tr><td style="padding:8px 12px;font-weight:600">Description</td><td style="padding:8px 12px">${desc.replace(/\n/g,'<br>')}</td></tr>
            ${deadline ? `<tr style="background:#F4F5F8"><td style="padding:8px 12px;font-weight:600">Deadline</td><td style="padding:8px 12px">${deadline}</td></tr>` : ''}
            <tr><td style="padding:8px 12px;font-weight:600">Soumis le</td><td style="padding:8px 12px">${now.toLocaleString('fr-FR')}</td></tr>
          </table>
          <p style="color:#6B7280;font-size:12px">— Tracker CPL · Eiffel Investment Group</p>
        </div>`;
      await graphPost('/me/sendMail', {
        message: {
          subject: `[Tracker CPL] Nouvelle demande ${selPrio === 'Critique' ? '🔴' : selPrio === 'Élevé' ? '🟡' : ''} — ${objet} (${ref})`,
          body: { contentType: 'HTML', content: mailBody },
          toRecipients: [{ emailAddress: { address: CPL_MAIL } }],
          ccRecipients: (document.getElementById('f-followers-value')?.value || '')
            .split(',')
            .map(e => e.trim())
            .filter(Boolean)
            .map(e => ({ emailAddress: { address: e } }))
        },
        saveToSentItems: true
      }, GRAPH_SCOPES_MAIL);
    } catch(mailErr) {
      console.warn('Mail non envoyé (permission Mail.Send en attente) :', mailErr.message);
    }

    followersSelected = [];
    allSelectedFiles  = [];
    docReviewContext  = null;
    if (docReviewError) {
      showToast(`Demande ${ref} créée, mais les fichiers de l'analyse ${escHtml(docReviewRef)} n'ont pas été joints : ${escHtml(docReviewError)}. Utilisez « Finaliser la liaison Doc Review » dans la demande.`, 'error');
      await loadRequests();
      openDetail(ref);
      return;
    }
    showToast(`Demande ${ref} soumise avec succès.`, 'success');
    await loadRequests();
    goList();

  } catch(e) {
    console.error('Erreur soumission:', e);
    showToast(`Erreur : ${e.message}`, 'error');
    btn.disabled = false;
    btn.textContent = 'Soumettre la demande';
  }
}

function formatDescription(text) {
  if (!text) return '';
  if (text.includes('<') && text.includes('>')) return text;
  return '<p style="margin:4px 0">' +
    text
      .replace(/\n{3,}/g, '\n\n')
      .replace(/\n\n/g, '</p><p style="margin:4px 0">')
      .replace(/\n/g, '<br>')
      .replace(/^[•\-\*] (.+)$/gm, '<li style="margin:2px 0">$1</li>')
      .replace(/(<li[^>]*>.*<\/li>\n?)+/g, '<ul style="margin:6px 0;padding-left:20px">$&</ul>')
    + '</p>';
}

// DOC REVIEW → TRACKER : soumission d'une analyse Doc Review
// ═══════════════════════════════════════════════════════════
const DR_REF_RE = /^DR-\d{4}-\d{4,}$/;

function escHtml(v) {
  return String(v === null || v === undefined ? '' : v)
    .replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#39;');
}

async function graphFetchRaw(path, opts) {
  const t = await getToken(GRAPH_SCOPES_SP);
  const o = opts || {};
  return fetch(`https://graph.microsoft.com/v1.0${path}`, Object.assign({}, o, { headers: Object.assign({ Authorization: `Bearer ${t}` }, o.headers || {}) }));
}

async function graphGetBytes(path, label) {
  const res = await graphFetchRaw(path);
  if (!res.ok) throw new Error(`${label || 'fichier'} introuvable (HTTP ${res.status})`);
  return new Uint8Array(await res.arrayBuffer());
}

async function sha256HexBytes(bytes) {
  const d = await crypto.subtle.digest('SHA-256', bytes);
  return Array.from(new Uint8Array(d), b => b.toString(16).padStart(2, '0')).join('');
}

// Upload dans le dossier d'une demande sans jamais écraser un fichier existant
// (session d'upload, conflictBehavior "rename" : un suffixe est ajouté en cas de doublon de nom)
async function uploadNoOverwrite(folder, fileName, bytes) {
  if (!spDriveId) throw new Error('bibliothèque CPL-Tracker introuvable');
  if (!bytes.length) throw new Error(`fichier vide : ${fileName}`);
  const path = `/sites/${spSiteId}/drives/${spDriveId}/items/root:/${encodeURIComponent(folder)}/${encodeURIComponent(fileName)}:/createUploadSession`;
  const session = await graphPost(path, { item: { '@microsoft.graph.conflictBehavior': 'rename', name: fileName } });
  const CHUNK = 320 * 1024 * 16;
  let result = null;
  for (let start = 0; start < bytes.length; start += CHUNK) {
    const end = Math.min(start + CHUNK, bytes.length);
    const res = await fetch(session.uploadUrl, { method: 'PUT', headers: { 'Content-Range': `bytes ${start}-${end - 1}/${bytes.length}` }, body: bytes.slice(start, end) });
    if (!res.ok) throw new Error(`enregistrement de ${fileName} impossible (HTTP ${res.status})`);
    if (end === bytes.length) result = await res.json();
  }
  if (!result || !result.id) throw new Error(`enregistrement de ${fileName} non confirmé`);
  if (typeof result.size === 'number' && result.size !== bytes.length) throw new Error(`copie incomplète de ${fileName}`);
  return result;
}

async function loadDocReviewAnalysis(drRef) {
  if (!DR_REF_RE.test(drRef)) throw new Error('référence invalide');
  if (!drListId || !drDriveId) throw new Error('liste ou bibliothèque Doc Review introuvable');
  const filter = encodeURIComponent(`fields/Title eq '${drRef}'`);
  const res = await graphFetchRaw(`/sites/${spSiteId}/lists/${drListId}/items?$expand=fields&$filter=${filter}`,
    { headers: { Prefer: 'HonorNonIndexedQueriesWarningMayFailRandomly' } });
  if (!res.ok) throw new Error(`lecture de l'analyse impossible (HTTP ${res.status})`);
  const items = ((await res.json()).value || []).filter(i => i.fields && i.fields.Title === drRef);
  if (items.length !== 1) throw new Error(items.length ? 'analyse en double' : 'analyse introuvable');
  const bytes = await graphGetBytes(`/drives/${drDriveId}/root:/${encodeURIComponent(drRef)}/${encodeURIComponent('rapport-' + drRef + '.json')}:/content`, 'rapport de l\'analyse');
  const report = JSON.parse(new TextDecoder().decode(bytes));
  if (report.ref !== drRef) throw new Error('rapport incohérent');
  return { ref: drRef, spItemId: items[0].id, fields: items[0].fields, report };
}

// Raison pour laquelle l'analyse ne peut pas être soumise (null si elle peut l'être)
function docReviewIneligibility(a) {
  if (String(a.fields.DemandeurEmail || '').toLowerCase() !== String(currentUser.email || '').toLowerCase()) return 'seul le demandeur de l\'analyse peut la soumettre';
  if (a.fields.RefTracker) return `analyse déjà soumise (demande ${a.fields.RefTracker})`;
  if (a.fields.Statut !== 'Analysé') return `analyse au statut « ${a.fields.Statut || 'inconnu'} »`;
  const f = a.report.fichiers || {};
  if (!f.original || !f.rapportPdf) return 'rapport de l\'analyse incomplet';
  return null;
}

async function handleDocReviewParam() {
  const drRef = new URLSearchParams(location.search).get('docreview');
  if (!drRef) return;
  history.replaceState(null, '', location.pathname);   // le paramètre n'est traité qu'une fois
  try {
    const a = await loadDocReviewAnalysis(drRef);
    const reason = docReviewIneligibility(a);
    if (reason) { showToast(`Soumission de l'analyse ${escHtml(drRef)} impossible : ${escHtml(reason)}.`, 'error'); return; }
    goNew();
    docReviewContext = a;
    prefillFromDocReview(a);
  } catch (e) {
    showToast(`Analyse ${escHtml(drRef)} non chargée : ${escHtml(e.message)}.`, 'error');
  }
}

function docReviewDescriptionHtml(a) {
  const r = a.report;
  const c = r.counts || {};
  if (r.version === 2) {
    const app = r.appreciation || {};
    const nature = r.comprehension && r.comprehension.nature ? `, nature détectée : ${escHtml(r.comprehension.nature)}` : '';
    return `<p><strong>Analyse Doc Review ${escHtml(a.ref)}</strong> (type de fonds : ${escHtml(r.typeFonds)}, public ${escHtml(r.marcheLibelle || r.marche)}${nature}) : `
      + `appréciation globale « ${escHtml(app.valeur || '')} », ${escHtml(c.aTraiter || 0)} point(s) à traiter, ${escHtml(c.recommandes || 0)} recommandation(s).</p>`
      + `<p><strong>Synthèse :</strong> ${escHtml(app.synthese || '')}</p>`
      + `<p>Le fichier d'origine et le rapport de relecture sont joints à la demande.</p>`;
  }
  // analyses enregistrées avec l'ancien format (score sur 100)
  return `<p><strong>Analyse Doc Review ${escHtml(a.ref)}</strong> (${escHtml(r.typeDocument)}, marché ${escHtml(r.marcheLibelle || r.marche)}) : `
    + `score ${escHtml(r.score)}/100, ${escHtml(c.bloquants || 0)} point(s) bloquant(s), ${escHtml(c.attention || 0)} point(s) d'attention.</p>`
    + `<p><strong>Synthèse :</strong> ${escHtml(r.synthese || '')}</p>`
    + `<p>Le fichier d'origine et le rapport de pré-contrôle sont joints à la demande.</p>`;
}

function prefillFromDocReview(a) {
  const type = document.getElementById('f-type');
  type.value = TYPE_VALIDATION_DOC;
  type.disabled = true;
  document.getElementById('f-objet').value = String(a.fields.NomFichier || a.report.nomFichier || '').slice(0, 150);
  document.getElementById('f-desc-editor').innerHTML = docReviewDescriptionHtml(a);
  const card = document.querySelector('#view-new .form-card');
  const banner = document.createElement('div');
  banner.style.cssText = 'margin-bottom:14px;padding:10px 14px;border-radius:8px;background:#EFF6FF;border:1px solid #BFDBFE;color:#1E40AF;font-size:12.5px;line-height:1.5';
  banner.textContent = `Demande issue de l'analyse Doc Review ${a.ref} : le fichier d'origine et le rapport de pré-contrôle seront joints automatiquement. Complétez les autres champs puis soumettez.`;
  card.insertBefore(banner, card.firstChild);
}

// Copie du fichier d'origine et du rapport PDF vers le dossier de la demande, puis marquage de
// l'analyse comme soumise. Un fichier déjà copié (même nom, même taille) n'est pas recopié.
async function finalizeDocReviewLink(a, trackerRef) {
  const names = [a.report.fichiers.original, a.report.fichiers.rapportPdf];
  let existing = [];
  try {
    existing = (await graphGet(`/sites/${spSiteId}/drives/${spDriveId}/items/root:/${encodeURIComponent(trackerRef)}:/children`)).value || [];
  } catch (e) { existing = []; }
  for (const name of names) {
    const bytes = await graphGetBytes(`/drives/${drDriveId}/root:/${encodeURIComponent(a.ref)}/${encodeURIComponent(name)}:/content`, name);
    if (name === a.report.fichiers.original && a.fields.HashFichier) {
      const h = await sha256HexBytes(bytes);
      if (h !== a.fields.HashFichier) throw new Error('l\'empreinte du fichier d\'origine ne correspond pas à celle de l\'analyse');
    }
    if (existing.some(f => f.file && f.name === name && f.size === bytes.length)) continue;
    await uploadNoOverwrite(trackerRef, name, bytes);
  }
  await graphPatch(`/sites/${spSiteId}/lists/${drListId}/items/${a.spItemId}/fields`, { RefTracker: trackerRef, Statut: 'Soumis' });
}

async function renderDocReviewLink(req) {
  const box = document.getElementById('docreview-link');
  if (!box || !req.refDocReview) return;
  box.style.cssText = 'margin-top:10px;padding:8px 12px;border-radius:6px;background:#F4F5F8;font-size:12px;color:#374151';
  box.textContent = `Analyse Doc Review liée : ${req.refDocReview}`;
  if (String(req.email || '').toLowerCase() !== String(currentUser.email || '').toLowerCase()) return;
  try {
    const a = await loadDocReviewAnalysis(req.refDocReview);
    if (a.fields.RefTracker === req.ref || selectedReq !== req) return;
    if (docReviewIneligibility(a)) return;
    const btn = document.createElement('button');
    btn.className = 'btn-secondary';
    btn.style.cssText = 'margin-left:10px;font-size:11.5px;padding:3px 10px';
    btn.textContent = 'Finaliser la liaison Doc Review (joindre les fichiers)';
    btn.onclick = async () => {
      btn.disabled = true;
      try {
        const fresh = await loadDocReviewAnalysis(req.refDocReview);
        const reason = docReviewIneligibility(fresh);
        if (reason) throw new Error(reason);
        await finalizeDocReviewLink(fresh, req.ref);
        showToast(`Fichiers de l'analyse ${escHtml(req.refDocReview)} joints à la demande ${escHtml(req.ref)}.`, 'success');
        btn.remove();
        loadFilesForDetail(req.ref);
      } catch (e) {
        showToast(`Liaison impossible : ${escHtml(e.message)}.`, 'error');
        btn.disabled = false;
      }
    };
    box.appendChild(btn);
  } catch (e) {
    console.warn('Analyse Doc Review non chargée :', e.message);
  }
}

async function loadComments(ref) {
  const container = document.getElementById('comments-container');
  if (!container) return;
  if (!spCommListId) {
    container.innerHTML = '<p style="font-size:12px;color:var(--text-secondary)">Liste commentaires non configurée.</p>';
    return;
  }
  container.innerHTML = '<span style="font-size:12px;color:var(--text-secondary)">Chargement...</span>';
  try {
    const data = await graphGet(
      `/sites/${spSiteId}/lists/${spCommListId}/items?expand=fields,createdBy&$top=500`
    );
    const all = data.value
      .filter(item => item.fields.Title === ref)
      .map(item => {
        const f = item.fields;
        return {
          auteur  : f.NomAuteur || (item.createdBy?.user?.displayName) || '',
          texte   : (f.Texte || '').replace(/^\[INTERNE\]/, ''),
          interne : (f.Texte || '').startsWith('[INTERNE]'),
          date    : item.createdDateTime ? new Date(item.createdDateTime).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '',
          _ts     : item.createdDateTime ? new Date(item.createdDateTime).getTime() : 0
        };
      })
      .filter(c => isCPL || !c.interne)
      .sort((a,b) => a._ts - b._ts);

    if (!all.length) {
      container.innerHTML = '<p style="font-size:12.5px;color:var(--text-secondary)">Aucun commentaire.</p>';
      return;
    }
    container.innerHTML = all.map(c => {
      // Transformer le lien markdown 📎 [nom](url) en bouton Ouvrir/Télécharger
      const texteRendu = formatDescription(c.texte).replace(
        /📎 \[([^\]]+)\]\((https[^"'\s]+)\)/g,
        (_, nom, url) => {
          const isEmailFile = /\.(msg|eml)$/i.test(nom);
          const href = isEmailFile ? url + '?download=1' : url;
          const linkAttrs = isEmailFile
            ? `href="${href}" download style="color:var(--navy);font-weight:600;text-decoration:none;margin-left:4px"`
            : `href="${href}" target="_blank" style="color:var(--navy);font-weight:600;text-decoration:none;margin-left:4px"`;
          const label = isEmailFile ? 'Télécharger →' : 'Ouvrir →';
          return `<span style="display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:4px 10px;background:#F4F5F8;border:1px solid var(--border);border-radius:6px;font-size:11.5px">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span style="color:#374151;font-weight:500">${nom}</span>
          <a ${linkAttrs}>${label}</a>
        </span>`;
        }
      );
      return `
      <div class="comment ${c.interne ? 'comment-internal' : 'comment-normal'}" style="margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap">
          ${c.interne ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>' : ''}
          <span style="font-weight:600;color:${c.interne ? '#713F12' : '#111827'};font-size:12.5px">${c.auteur}</span>
          <span style="color:#9CA3AF;font-size:11px">${c.date}</span>
          ${c.interne ? '<span class="internal-lbl">Note interne</span>' : ''}
        </div>
        <div style="color:${c.interne ? '#713F12' : '#374151'};line-height:1.5;font-size:13px">${texteRendu}</div>
      </div>`;
    }).join('');
  } catch(e) {
    console.error('Erreur chargement commentaires:', e);
    container.innerHTML = '<p style="font-size:12px;color:#DC2626">Erreur de chargement des commentaires.</p>';
  }
}

  await graphPatch(
    `/sites/${spSiteId}/lists/${spListId}/items/${selectedReq.spId}/fields`,
    fields
  );

  // Notification email au demandeur
  const subjects = {
    "En cours d'analyse"        : `[Tracker CPL] Votre demande ${selectedReq.ref} est en cours de traitement`,
    "En attente d'informations" : `[Tracker CPL] Action requise : complément d'information — ${selectedReq.ref}`,

    "Rejeté"                    : `[Tracker CPL] Votre demande ${selectedReq.ref} a été rejetée`,

      "En attente d'informations": `
        <p>Bonjour ${selectedReq.from},</p>
        <p>⚠️ L'équipe Compliance a besoin d'un complément d'information pour traiter votre demande <strong>${selectedReq.ref}</strong> — <em>${selectedReq.objet}</em>.</p>
        <p>Merci de revenir sur le <a href="https://complianceportal.eiffel-ig.com/tracker-cpl.html">Tracker CPL</a> pour apporter les informations complémentaires.</p>`,
      "Traité": `
        <p>Bonjour ${selectedReq.from},</p>
        <p>✅ Votre demande <strong>${selectedReq.ref}</strong> — <em>${selectedReq.objet}</em> — a été résolue par l'équipe Compliance.</p>

    };

    const body = bodyContent[newStatus] || '';

    try {
      const followerEmails = (selectedReq.followers || '').split(',').map(e => e.trim()).filter(Boolean);

            contentType: 'HTML',
            content: `<div style="font-family:Arial,sans-serif;font-size:14px;color:#111;line-height:1.6">
              ${body}
              <br><hr style="border:none;border-top:1px solid #E5E7EB;margin:16px 0">

          },

        },
        saveToSentItems: true
      }, GRAPH_SCOPES_MAIL);
      console.log(`Mail envoyé à ${selectedReq.email}`);

async function changeStatus() {
  const rawVal    = document.getElementById('cpl-status-select')?.value;
  const newStatus = STATUS_MAP[rawVal] || rawVal;
  const motif     = document.getElementById('cpl-motif')?.value.trim();

  if (!newStatus) { showToast('Veuillez sélectionner un statut.', 'error'); return; }
  if (newStatus === 'Rejeté' && !motif) { showToast('Le motif de rejet est obligatoire.', 'error'); return; }

  const btn = document.getElementById('cpl-apply-btn');
  btn.disabled = true;
  btn.textContent = 'Enregistrement...';

  try {
    await applyStatusChange(newStatus, { motif });

    showToast(`Statut mis à jour : ${newStatus}`, 'success');
    await loadRequests();
    openDetail(selectedReq.ref);

  } catch(e) {
    console.error('Erreur changement statut:', e);
    showToast(`Erreur : ${e.message}`, 'error');
    btn.disabled = false;
    btn.textContent = 'Appliquer';
  }
}

// VALIDATION DOCUMENTAIRE (CPL) : PDF marqué de la référence
// ═══════════════════════════════════════════════════════════
const VALIDATION_COLUMNS = ['HashDocumentValide', 'HashPdfMarque', 'DocumentValide', 'DateValidationDoc', 'ValideParDoc'];
let validationBusy = false;
if (window.pdfjsLib) pdfjsLib.GlobalWorkerOptions.workerSrc = 'https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.11.174/pdf.worker.min.js';

function canValidateDocument(req) {
  return !!(isCPL && req && req.type === TYPE_VALIDATION_DOC && ['Traité', 'Clôturé', 'Rejeté'].indexOf(req.statut) === -1);
}

async function checkValidationColumns() {
  const cols = ((await graphGet(`/sites/${spSiteId}/lists/${spListId}/columns?$select=name`)).value || []).map(c => c.name);
  const missing = VALIDATION_COLUMNS.filter(c => cols.indexOf(c) === -1);
  if (missing.length) throw new Error('colonnes absentes dans la liste des demandes : ' + missing.join(', '));
}

async function openValidationModal() {
  if (!canValidateDocument(selectedReq) || validationBusy) return;
  const req = selectedReq;
  let files;
  try {
    if (typeof PDFLib === 'undefined' || typeof pdfjsLib === 'undefined' || typeof CplValidationCore === 'undefined') throw new Error('bibliothèques PDF non chargées, rechargez la page');
    if (!spDriveId) throw new Error('bibliothèque CPL-Tracker introuvable');
    await checkValidationColumns();
    const res = await graphGet(`/sites/${spSiteId}/drives/${spDriveId}/items/root:/${encodeURIComponent(req.ref)}:/children`);
    files = (res.value || [])
      .filter(f => f.file && /\.(pdf|pptx|docx)$/i.test(f.name) && !CplValidationCore.isMarkedFileName(f.name))
      .sort((a, b) => String(b.lastModifiedDateTime || '').localeCompare(String(a.lastModifiedDateTime || '')));
  } catch (e) {
    showToast(`Validation impossible : ${escHtml(e.message)}.`, 'error');
    return;
  }
  if (!files.length) { showToast('Aucun document PPTX, DOCX ou PDF à valider dans le dossier de la demande.', 'error'); return; }
  buildValidationModal(req, files);
}

function buildValidationModal(req, files) {
  const now = new Date();
  const el = (tag, css, text) => { const e = document.createElement(tag); if (css) e.style.cssText = css; if (text !== undefined) e.textContent = text; return e; };
  const overlay = el('div', 'position:fixed;inset:0;background:rgba(15,23,42,0.45);z-index:1000;display:flex;align-items:center;justify-content:center;padding:16px');
  overlay.id = 'validation-modal';
  const modal = el('div', 'background:white;border-radius:12px;max-width:620px;width:100%;max-height:90vh;overflow:auto;padding:22px;box-shadow:0 20px 50px rgba(0,0,0,0.25)');
  modal.appendChild(el('h3', 'font-size:16px;font-weight:700;color:var(--navy);margin-bottom:4px', 'Valider et marquer le document'));
  modal.appendChild(el('p', 'font-size:12.5px;color:var(--text-secondary);margin-bottom:14px', 'Choisissez le document validé. Un PDF portant la mention ci-dessous en haut à droite de chaque page sera enregistré dans le dossier de la demande.'));
  const list = el('div', 'display:flex;flex-direction:column;gap:6px;margin-bottom:14px');
  let selected = files[0];
  const recap = el('div', 'background:#F4F5F8;border-radius:8px;padding:10px 14px;font-size:12.5px;line-height:1.7;margin-bottom:12px');
  const renderRecap = () => {
    recap.textContent = '';
    const rows = [
      ['Fichier', selected.name],
      ['Dernière modification', selected.lastModifiedDateTime ? new Date(selected.lastModifiedDateTime).toLocaleString('fr-FR') : '-'],
      ['Référence', req.ref],
      ['Date de validation', now.toLocaleDateString('fr-FR')],
      ['Mention apposée', CplValidationCore.buildLabel(req.ref, now)],
      ['Fichier créé', CplValidationCore.markedFileName(selected.name, req.ref)]
    ];
    rows.forEach(([k, v]) => { const d = el('div'); d.append(el('strong', '', k + ' : '), document.createTextNode(v)); recap.appendChild(d); });
  };
  files.forEach((f, i) => {
    const lab = el('label', 'display:flex;align-items:center;gap:8px;font-size:12.5px;cursor:pointer;padding:6px 8px;border:1px solid var(--border);border-radius:6px');
    const radio = document.createElement('input');
    radio.type = 'radio'; radio.name = 'validation-file'; radio.checked = i === 0;
    radio.onchange = () => { selected = f; renderRecap(); };
    const when = f.lastModifiedDateTime ? new Date(f.lastModifiedDateTime).toLocaleString('fr-FR') : '';
    lab.append(radio, el('span', 'flex:1', f.name), el('span', 'color:var(--text-secondary);font-size:11px', when));
    list.appendChild(lab);
  });
  renderRecap();
  modal.append(list, recap);
  modal.appendChild(el('div', 'font-size:11.5px;color:#92400E;background:#FFFBEB;border:1px solid #FDE68A;border-radius:6px;padding:8px 12px;margin-bottom:12px;line-height:1.5',
    'Le PDF marqué est la version officielle validée. Le document source n\'est pas modifié. Si le PDF source est signé électroniquement, sa signature ne sera plus valable sur la version marquée.'));
  const extraOptions = el('div');
  modal.appendChild(extraOptions);
  const progress = el('p', 'font-size:12.5px;color:var(--navy);font-weight:600;margin:10px 0;display:none');
  const error = el('div', 'font-size:12.5px;color:#DC2626;background:#FEF2F2;border-radius:6px;padding:8px 12px;margin:10px 0;display:none');
  modal.append(progress, error);
  const actions = el('div', 'display:flex;gap:8px;justify-content:flex-end;margin-top:8px');
  const cancel = el('button', '', 'Annuler'); cancel.className = 'btn-secondary';
  const confirmBtn = el('button', '', 'Valider et marquer'); confirmBtn.className = 'btn-primary';
  actions.append(cancel, confirmBtn);
  modal.appendChild(actions);
  overlay.appendChild(modal);
  document.body.appendChild(overlay);

  const ui = {
    options: extraOptions,
    lock(on) { confirmBtn.disabled = on; cancel.disabled = on; list.querySelectorAll('input').forEach(r => { r.disabled = on; }); extraOptions.querySelectorAll('input').forEach(r => { r.disabled = on; }); },
    step(msg) { error.style.display = 'none'; progress.style.display = 'block'; progress.textContent = msg; },
    error(msg) { progress.style.display = 'none'; error.style.display = 'block'; error.textContent = msg; },
    close() { overlay.remove(); }
  };
  cancel.onclick = () => { if (!validationBusy) ui.close(); };
  confirmBtn.onclick = () => runValidation(req, selected, ui);
  if (typeof onValidationModalBuilt === 'function') onValidationModalBuilt(ui);
}

function validationBeforeUnload(e) { e.preventDefault(); e.returnValue = ''; return ''; }

// Option : marquer aussi le fichier d'origine (PPTX : zone de texte en haut à droite de chaque slide ;
// DOCX : mention alignée à droite dans les en-têtes existants). Case décochée par défaut.
function onValidationModalBuilt(ui) {
  const label = document.createElement('label');
  label.style.cssText = 'display:flex;align-items:flex-start;gap:8px;font-size:12.5px;cursor:pointer;margin-bottom:10px;line-height:1.5';
  const box = document.createElement('input');
  box.type = 'checkbox';
  box.id = 'validation-mark-original';
  box.checked = false;
  box.style.marginTop = '3px';
  const txt = document.createElement('span');
  txt.textContent = 'Marquer aussi le fichier d\'origine (PPTX ou DOCX, enregistré sous un nouveau nom, l\'original n\'est pas modifié). La mention est placée en haut à droite de chaque slide ou, pour un DOCX, dans les en-têtes existants.';
  label.append(box, txt);
  ui.options.appendChild(label);
}

async function graphDeleteItem(itemId) {
  const res = await graphFetchRaw(`/sites/${spSiteId}/drives/${spDriveId}/items/${encodeURIComponent(itemId)}`, { method: 'DELETE' });
  if (!res.ok && res.status !== 404) throw new Error(`suppression impossible (HTTP ${res.status})`);
}

// Non bloquant : renvoie { name } si le fichier d'origine marqué est conforme, { warning } sinon.
// Le fichier marqué est contrôlé par reconversion en PDF (mention sur chaque page) ; s'il n'est
// pas conforme, seul ce nouveau fichier est supprimé.
async function onMarkedPdfSaved(ctx) {
  const box = document.getElementById('validation-mark-original');
  if (!box || !box.checked) return null;
  const ext = CplValidationCore.extensionOf(ctx.file.name);
  if (ext !== 'pptx' && ext !== 'docx') return { warning: 'le document validé est un PDF, il n\'y a pas de fichier d\'origine PPTX ou DOCX à marquer' };
  if (typeof JSZip === 'undefined') return { warning: 'bibliothèque JSZip non chargée, marquage du fichier d\'origine non effectué' };
  let uploaded = null;
  try {
    ctx.ui.step('Marquage du fichier d\'origine…');
    const out = ext === 'pptx'
      ? await CplValidationCore.markPptx(JSZip, ctx.source, ctx.label)
      : await CplValidationCore.markDocx(JSZip, ctx.source, ctx.label);
    uploaded = await uploadNoOverwrite(ctx.req.ref, CplValidationCore.markedOriginalName(ctx.file.name, ctx.req.ref), out);
    ctx.ui.step('Contrôle du fichier d\'origine marqué…');
    const pdf = await graphGetBytes(`/sites/${spSiteId}/drives/${spDriveId}/items/${encodeURIComponent(uploaded.id)}/content?format=pdf`, 'version PDF du fichier d\'origine marqué');
    await CplValidationCore.verifyMarkedPdf(pdfjsLib, pdf, ctx.label, ctx.pageCount);
    return { name: uploaded.name };
  } catch (e) {
    console.warn('Marquage du fichier d\'origine :', e);
    if (uploaded) {
      try { await graphDeleteItem(uploaded.id); }
      catch (e2) { return { warning: `fichier marqué non conforme (${e.message}) et non supprimé : supprimez « ${uploaded.name} » manuellement ; le PDF marqué reste la version officielle` }; }
    }
    return { warning: `marquage non effectué (${e.message}) ; le PDF marqué reste la version officielle` };
  }
}

async function runValidation(req, file, ui) {
  if (validationBusy || !ui || !file || !canValidateDocument(req) || selectedReq !== req) return;
  validationBusy = true;
  const now = new Date();
  let uploaded = null;
  try {
    ui.lock(true);
    window.addEventListener('beforeunload', validationBeforeUnload);
    const label = CplValidationCore.buildLabel(req.ref, now);
    const itemPath = `/sites/${spSiteId}/drives/${spDriveId}/items/${encodeURIComponent(file.id)}/content`;
    // 1. Document source et empreinte
    ui.step('Téléchargement du document…');
    const source = await graphGetBytes(itemPath, file.name);
    const hashSource = await sha256HexBytes(source);
    // 2. Version PDF (conversion SharePoint pour PPTX / DOCX)
    const ext = CplValidationCore.extensionOf(file.name);
    let pdfBytes = source;
    if (ext !== 'pdf') {
      ui.step('Conversion en PDF (SharePoint)…');
      pdfBytes = await graphGetBytes(itemPath + '?format=pdf', 'version PDF du document');
    }
    ui.step('Contrôle du PDF source…');
    const srcTexts = await CplValidationCore.pageTexts(pdfjsLib, pdfBytes);
    if (CplValidationCore.containsLabel(srcTexts, req.ref)) throw new Error('ce document porte déjà la mention de cette demande');
    // 3. Marquage de chaque page
    ui.step(`Marquage des ${srcTexts.length} page(s)…`);
    const marked = await CplValidationCore.markPdf(PDFLib, pdfBytes, label);
    if (marked.pageCount !== srcTexts.length) throw new Error(`nombre de pages différent après marquage (${marked.pageCount} au lieu de ${srcTexts.length})`);
    // 4. Contrôle automatique par relecture
    ui.step('Contrôle du PDF marqué…');
    await CplValidationCore.verifyMarkedPdf(pdfjsLib, marked.bytes, label, srcTexts.length);
    // 5. Enregistrement sans écrasement, empreinte du PDF marqué
    ui.step('Enregistrement du PDF marqué…');
    const hashMarked = await sha256HexBytes(marked.bytes);
    uploaded = await uploadNoOverwrite(req.ref, CplValidationCore.markedFileName(file.name, req.ref), marked.bytes);
    const original = typeof onMarkedPdfSaved === 'function' ? await onMarkedPdfSaved({ req, file, source, label, ui, pageCount: srcTexts.length }) : null;
    // 6. Statut Traité, historique et notification (une seule mise à jour avec les empreintes)
    ui.step('Passage au statut Traité…');
    await applyStatusChange('Traité', {
      note: 'Document validé et marqué',
      extraFields: {
        HashDocumentValide: hashSource, HashPdfMarque: hashMarked, DocumentValide: file.name,
        DateValidationDoc: now.toISOString(), ValideParDoc: currentUser.name
      }
    });
    ui.close();
    showToast(`Document validé et marqué : ${escHtml(uploaded.name)}. Demande passée au statut Traité.`, 'success');
    if (original && original.name) showToast(`Fichier d'origine marqué : ${escHtml(original.name)}.`, 'success');
    if (original && original.warning) showToast(`Fichier d'origine : ${escHtml(original.warning)}.`, 'error');
    await loadRequests();
    openDetail(req.ref);
  } catch (e) {
    console.error('Validation documentaire :', e);
    const detail = uploaded ? `le PDF marqué « ${uploaded.name} » a été enregistré mais le statut n'a pas été modifié (${e.message})` : e.message;
    ui.error('Validation interrompue, statut inchangé : ' + detail + '.');
  } finally {
    validationBusy = false;
    window.removeEventListener('beforeunload', validationBeforeUnload);
    ui.lock(false);
  }
}

document.addEventListener('DOMContentLoaded', initApp);
</script>
