.bdg{display:inline-flex;align-items:center;padding:2px 10px;border-radius:20px;font-size:11px;font-weight:600;white-space:nowrap;border:1px solid}

.sla-card{background:#fff;border-radius:10px;border:1px solid var(--border);padding:14px 16px}

.detail-grid{display:grid;grid-template-columns:1fr 320px;gap:14px}

.timeline{position:relative;padding-left:20px}
.timeline::before{content:'';position:absolute;left:7px;top:10px;bottom:10px;width:1px;background:var(--border)}
.tl-item{position:relative;margin-bottom:16px}
.tl-dot{position:absolute;left:-20px;top:4px;width:10px;height:10px;border-radius:50%;border:2px solid #fff}
.tl-label{font-size:12px;font-weight:600;color:#111827}

.prio-btn{flex:1;padding:7px;font-size:12.5px;font-weight:500;border-radius:8px;cursor:pointer;border:1px solid var(--border);background:#fff;color:var(--navy);font-family:inherit}

}

<script>
const msalConfig = {
  auth: {
    clientId: "56c83db2-7fc6-4826-8073-82077e91ae27",
    authority: "https://login.microsoftonline.com/eb5288b6-5ccb-4f5d-88fb-346db1317a4f",
    redirectUri: window.location.origin
  },
  cache: { cacheLocation: "sessionStorage" }
};
</script>
<script>
'use strict';

// ═══════════════════════════════════════════════════════════
// CONFIGURATION
// ═══════════════════════════════════════════════════════════
const CPL_EMAILS = [
  'thomas.oliveira@eiffel-ig.com',
  'cassandre.memet@eiffel-ig.com',
  'manalle.ourrami@eiffel-ig.com',
  'jessica.manukyan@eiffel-ig.com'
];

const SP = {
  hostname : 'eiffelinvestmentgroup.sharepoint.com',
  sitePath : '/sites/CPLDashboard',
  listName : 'Tracker CPL Demandes',
  libName  : 'CPL-Tracker'
};

const GRAPH_SCOPES  = ['User.Read', 'Sites.ReadWrite.All', 'Mail.Send'];
const CPL_MAIL      = 'cpl@eiffel-ig.com';

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let currentUser  = null;
let isCPL        = false;
let currentView  = 'list';
let selectedReq  = null;
let statusFilter = 'all';
let cplTab       = 'demandes';
let msalInst     = null;
let spSiteId     = null;
let spListId     = null;
let spDriveId    = null;
let requests     = [];   // chargées depuis SharePoint



// ═══════════════════════════════════════════════════════════
// AUTH MSAL
// ═══════════════════════════════════════════════════════════
async function initApp() {
  msalInst = new msal.PublicClientApplication(msalConfig);
  await msalInst.initialize();

  const accounts = msalInst.getAllAccounts();
  if (accounts.length > 0) {
    await loginWithAccount(accounts[0]);
  } else {
    showScreen('login');
  }

  document.getElementById('btn-login').onclick = async () => {
    try {
      const result = await msalInst.loginPopup({ scopes: GRAPH_SCOPES });
      await loginWithAccount(result.account);
    } catch(e) {
      console.error('Login failed:', e);
    }
  };

  document.getElementById('btn-logout').onclick = async () => {
    try { await msalInst.logoutPopup(); } catch(e) {}
    showScreen('login');
  };
}

async function loginWithAccount(account) {
  try {
    const token = await getToken(['User.Read'], account);
    const p = await graphGet('/me', token);
    setUser({ name: p.displayName, email: p.userPrincipalName, dept: p.department || 'Collaborateur', account });
  } catch(e) {
    console.error('Token error:', e);
    showScreen('login');
  }
}

function setUser(u) {
  currentUser = u;
  isCPL = CPL_EMAILS.map(e => e.toLowerCase()).includes(u.email.toLowerCase());
  const ini = u.name.split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('user-avatar').textContent = ini;
  document.getElementById('user-avatar').style.background = isCPL ? '#D18F41' : '#4B5563';
  document.getElementById('user-name').textContent = u.name;
  document.getElementById('user-role').textContent  = isCPL ? 'Compliance' : 'Collaborateur';
  showScreen('app');
  initSharePointThenLoad();
}

// ═══════════════════════════════════════════════════════════
// GRAPH HELPERS
// ═══════════════════════════════════════════════════════════
async function getToken(scopes, account) {
  const acc = account || currentUser.account || msalInst.getAllAccounts()[0];
  const res = await msalInst.acquireTokenSilent({ scopes, account: acc });
  return res.accessToken;
}

async function graphGet(path, token) {
  const t = token || await getToken(GRAPH_SCOPES);
  const res = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    headers: { Authorization: `Bearer ${t}` }
  });
  if (!res.ok) throw new Error(`Graph GET ${path} → ${res.status}`);
  return res.json();
}

async function graphPost(path, body) {
  const t = await getToken(GRAPH_SCOPES);
  const res = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    method: 'POST',
    headers: { Authorization: `Bearer ${t}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) { const e = await res.text(); throw new Error(`Graph POST ${path} → ${res.status}: ${e}`); }
  return res.status === 204 ? null : res.json();
}

async function graphPatch(path, body) {
  const t = await getToken(GRAPH_SCOPES);
  const res = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    method: 'PATCH',
    headers: { Authorization: `Bearer ${t}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`Graph PATCH ${path} → ${res.status}`);
  return res.status === 204 ? null : res.json();
}

async function graphPut(path, data, contentType) {
  const t = await getToken(GRAPH_SCOPES);
  const res = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${t}`, 'Content-Type': contentType || 'application/octet-stream' },
    body: data
  });
  if (!res.ok) throw new Error(`Graph PUT ${path} → ${res.status}`);
  return res.json();
}

// ═══════════════════════════════════════════════════════════
// SHAREPOINT — initialisation + chargement
// ═══════════════════════════════════════════════════════════
async function initSharePointThenLoad() {
  setListLoading(true);
  try {
    // 1. Site ID
    const site = await graphGet(`/sites/${SP.hostname}:${SP.sitePath}`);
    spSiteId = site.id;

    // 2. List ID
    const lists = await graphGet(`/sites/${spSiteId}/lists?$filter=displayName eq '${encodeURIComponent(SP.listName)}'`);
    spListId = lists.value[0]?.id;
    if (!spListId) throw new Error(`Liste "${SP.listName}" introuvable sur SharePoint`);

    // 3. Drive ID (bibliothèque CPL-Tracker)
    const drives = await graphGet(`/sites/${spSiteId}/drives`);
    const drive  = drives.value.find(d => d.name === SP.libName);
    spDriveId    = drive?.id || null;

    await loadRequests();
  } catch(e) {
    console.error('SharePoint init error:', e);
    setListLoading(false);
    showListError(e.message);
  }
}

async function loadRequests() {
  setListLoading(true);
  try {
    const data = await graphGet(
      `/sites/${spSiteId}/lists/${spListId}/items?expand=fields&$orderby=fields/DateSoumission desc&$top=200`
    );
    requests = data.value.map(item => {
      const f = item.fields;
      return {
        spId   : item.id,
        ref    : f.Title        || '',
        objet  : f.Objet        || '',
        type   : f.Sujet        || '',
        prio   : f.Priorit_x00e9_ || f.Priorité || f.Priorite || '',
        statut : f.Statut       || 'Soumis',
        date   : f.DateSoumission ? new Date(f.DateSoumission).toLocaleDateString('fr-FR') : '',
        updated: item.lastModifiedDateTime ? new Date(item.lastModifiedDateTime).toLocaleDateString('fr-FR') : '',
        from   : f.Demandeur    || '',
        email  : f.DemandeurEmail || '',
        dept   : f.DemandeurDept  || '',
        desc   : f.Description  || '',
        deadline: f.Deadline    || '',
        sla    : 0,
        comments: []
      };
    });
    setListLoading(false);
    renderList();
  } catch(e) {
    console.error('Erreur chargement demandes:', e);
    setListLoading(false);
    showListError(e.message);
  }
}

function setListLoading(on) {
  const el = document.getElementById('list-loading');
  if (el) el.style.display = on ? 'flex' : 'none';
}

function showListError(msg) {
  const el = document.getElementById('list-error');
  if (el) { el.textContent = `Erreur : ${msg}`; el.style.display = 'block'; }
}


// ═══════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

function showView(id) {
  ['list','new','detail'].forEach(v => {
    document.getElementById('view-' + v).classList.toggle('hidden', v !== id);
  });
  currentView = id;
}

function goList() { renderList(); showView('list'); window.scrollTo(0,0); }
function setFilter(s) { statusFilter = s; renderList(); }
function setCplTab(t) { cplTab = t; renderList(); }

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
const SC = {
  'Brouillon':'bdg-brouillon','Soumis':'bdg-soumis',
  "En cours d'analyse":'bdg-en-cours',"En attente d'informations":'bdg-en-attente',
  'Résolu':'bdg-resolu','Clôturé':'bdg-cloture','Rejeté':'bdg-rejete'
};
const PC = {'Normale':'bdg-normale','Urgente':'bdg-urgente','Critique':'bdg-critique'};

function bdg(label, cls) {
  return `<span class="bdg ${cls}">${label}</span>`;
}

function svgIcon(path, extras) {
  return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ${extras||''}>${path}</svg>`;
}

// ═══════════════════════════════════════════════════════════
// VUE LISTE
// ═══════════════════════════════════════════════════════════
function renderList() {
  const all      = isCPL ? requests : requests.filter(r => r.email === currentUser.email);
  const filtered = statusFilter === 'all' ? all : all.filter(r => r.statut === statusFilter);
  const open     = all.filter(r => ['Soumis',"En cours d'analyse","En attente d'informations"].includes(r.statut)).length;
  const awaiting = all.filter(r => r.statut === "En attente d'informations").length;
  const overSLA  = requests.filter(r => r.sla > 5 && ['Soumis',"En cours d'analyse","En attente d'informations"].includes(r.statut)).length;

  const STATUSES = ['all','Soumis',"En cours d'analyse","En attente d'informations",'Résolu','Clôturé','Rejeté'];
  const BG = {Soumis:'#EFF6FF',"En cours d'analyse":'#FFF7ED',"En attente d'informations":'#FEFCE8',Résolu:'#F0FDF4',Clôturé:'#ECFDF5',Rejeté:'#FEF2F2'};
  const CO = {Soumis:'#2563EB',"En cours d'analyse":'#C2410C',"En attente d'informations":'#B45309',Résolu:'#15803D',Clôturé:'#065F46',Rejeté:'#DC2626'};
  const BO = {Soumis:'#BFDBFE',"En cours d'analyse":'#FED7AA',"En attente d'informations":'#FDE68A',Résolu:'#BBF7D0',Clôturé:'#6EE7B7',Rejeté:'#FECACA'};

  const filterBtns = STATUSES.map(s => {
    const active = statusFilter === s;
    const count  = s === 'all' ? all.length : all.filter(r => r.statut === s).length;
    let st = '';
    if(active && s !== 'all') st = `style="background:${BG[s]};color:${CO[s]};border-color:${BO[s]}"`;
    else if(active)            st = `style="background:var(--navy);color:#fff;border-color:var(--navy)"`;
    return `<button class="filter-pill" onclick="setFilter('${s}')" ${st}>${s==='all'?'Tous':s}${count>0?` <span style="opacity:.6">(${count})</span>`:''}</button>`;
  }).join('');

  const cplTh   = isCPL ? '<th>Demandeur</th><th>Département</th>' : '';
  const cols    = isCPL ? 8 : 6;

  const rows = filtered.map(req => {
    const over = isCPL && req.sla > 5 && ['En cours','En attente','Soumis'].includes(req.statut);
    const near = isCPL && req.sla >= 4 && req.sla <= 5 && ['En cours','Soumis'].includes(req.statut);
    const cplTd = isCPL ? `<td class="td-muted" style="color:#374151">${req.from}</td><td class="td-muted">${req.dept}</td>` : '';
    return `<tr class="${over?'sla-over':''}" onclick="openDetail('${req.ref}')">
      <td class="td-ref">${req.ref}${over?' <span style="color:#DC2626;font-size:10px">⚠ SLA</span>':''}${near?' <span style="color:#D97706;font-size:10px">⚡</span>':''}</td>
      <td><div class="td-objet-main">${req.objet}</div><div class="td-objet-sub">${req.type}</div></td>
      ${cplTd}
      <td>${bdg(req.prio, PC[req.prio]||'bdg-normale')}</td>
      <td>${bdg(req.statut, SC[req.statut]||'bdg-brouillon')}${req.statut==='En attente'&&!isCPL?'<div class="action-req">↩ Action requise</div>':''}</td>
      <td class="td-muted">${req.date}</td>
      <td class="td-muted">${req.updated}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="${cols}" style="padding:24px;text-align:center;color:var(--text-secondary)">Aucune demande dans cette catégorie</td></tr>`;

  const tabBtns = isCPL ? `
    <div class="nav-tabs-sub">
      <button class="nav-tab-sub ${cplTab==='demandes'?'active':''}" onclick="setCplTab('demandes')">Demandes</button>
      <button class="nav-tab-sub ${cplTab==='dashboard'?'active':''}" onclick="setCplTab('dashboard')">Dashboard KPI</button>
    </div>` : '';

  const exportBtn = isCPL && cplTab==='demandes' ? `
    <button class="btn-secondary" onclick="exportCSV()">
      ${svgIcon('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>')}
      Exporter CSV
    </button>` : '';

  const searchBox = isCPL ? `
    <input type="text" placeholder="Rechercher..." oninput="searchTable(this.value)"
      style="margin-left:auto;padding:4px 10px;border-radius:6px;border:1px solid var(--border);font-size:12px;font-family:inherit;width:150px">` : '';

  const content = (cplTab === 'dashboard' && isCPL) ? renderDashboard() : `
    <div class="cpl-filters">${filterBtns}${searchBox}</div>
    <div class="table-wrapper">
      <table class="data-table cpl-table">
        <thead><tr>
          <th>Référence</th><th>Objet</th>${cplTh}
          <th>Priorité</th><th>Statut</th><th>Soumis le</th><th>Activité</th>
        </tr></thead>
        <tbody id="req-tbody">${rows}</tbody>
      </table>
    </div>`;

  document.getElementById('view-list').innerHTML = `
    <div class="section-header">
      <div>
        <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px">
          <h2 class="section-title">${isCPL ? 'Tracker CPL' : 'Mes demandes'}</h2>
          ${tabBtns}
        </div>
        <p class="section-desc">${isCPL
          ? `${requests.length} demandes au total &nbsp;·&nbsp; ${open} ouvertes &nbsp;·&nbsp; ${overSLA} hors SLA`
          : `${all.length} demande${all.length>1?'s':''} &nbsp;·&nbsp; ${awaiting} action${awaiting>1?'s':''} requise${awaiting>1?'s':''} de votre part`
        }</p>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        ${exportBtn}
        <button class="btn-primary" onclick="goNew()">
          ${svgIcon('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>')}
          Nouvelle demande
        </button>
      </div>
    </div>
    ${content}`;
}

function searchTable(q) {
  const rows = document.querySelectorAll('#req-tbody tr');
  rows.forEach(r => {
    r.style.display = r.textContent.toLowerCase().includes(q.toLowerCase()) ? '' : 'none';
  });
}

function exportCSV() {
  const headers = ['Référence','Objet','Type','Priorité','Statut','Demandeur','Département','Soumis le','Activité'];
  const lines = [headers.join(';')].concat(
    requests.map(r => [r.ref,r.objet,r.type,r.prio,r.statut,r.from,r.dept,r.date,r.updated].join(';'))
  );
  const blob = new Blob(['\uFEFF'+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `tracker-cpl-${new Date().toISOString().slice(0,10)}.csv`; a.click();
}

function renderDashboard() {
  const VOL    = [8,12,7,15,11,6];
  const MONTHS = ['Jan','Fév','Mar','Avr','Mai','Jun'];
  const maxV   = Math.max(...VOL);

  const bars = VOL.map((v,i) => `
    <div class="bar-item">
      <div class="bar-fill" style="height:${Math.round((v/maxV)*110)}px" title="${v} demandes"></div>
      <span class="bar-lbl">${MONTHS[i]}</span>
    </div>`).join('');

  const TYPES = [
    ['Validation doc.',28,'#00143B'],['Due diligence',22,'#D18F41'],
    ['Avis réglementaire',18,'#006660'],['Revue politique',14,'#2563EB'],
    ['Formation',10,'#7C3AED'],['Autres',8,'#6B7280']
  ];

  let pie = '<svg viewBox="0 0 100 100" width="110" height="110">';
  let a = -Math.PI/2;
  TYPES.forEach(([,p,c]) => {
    const r = (p/100)*2*Math.PI;
    const x1=50+47*Math.cos(a),y1=50+47*Math.sin(a); a+=r;
    const x2=50+47*Math.cos(a),y2=50+47*Math.sin(a);
    pie += `<path d="M50,50 L${x1.toFixed(1)},${y1.toFixed(1)} A47,47 0 ${r>Math.PI?1:0},1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${c}" stroke="#fff" stroke-width="1.5"/>`;
  });
  pie += '<circle cx="50" cy="50" r="26" fill="#fff"/></svg>';

  const legend = TYPES.map(([n,p,c]) => `
    <div class="pie-row">
      <div class="pie-dot" style="background:${c}"></div>
      <span class="pie-name">${n}</span>
      <span class="pie-pct">${p}%</span>

  return `
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon" style="background:#EFF6FF">${svgIcon('<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>', 'stroke="#2563EB"')}</div>
        <div class="kpi-val">3</div><div class="kpi-lbl">Demandes ouvertes</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon" style="background:#F0FDF4">${svgIcon('<polyline points="20 6 9 17 4 12"/>', 'stroke="#15803D"')}</div>
        <div class="kpi-val">12</div><div class="kpi-lbl">Résolues (30 jours)</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon" style="background:#FEF2F2">${svgIcon('<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>', 'stroke="#DC2626"')}</div>
        <div class="kpi-val">1</div><div class="kpi-lbl">Hors SLA actifs</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon" style="background:#FFF7ED">${svgIcon('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>', 'stroke="#D18F41"')}</div>
        <div class="kpi-val">3.2j</div><div class="kpi-lbl">Délai moyen résolution</div>
      </div>
    </div>
    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-title">Volume mensuel</div>
        <div class="bar-chart">${bars}</div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Par type de demande</div>
        <div style="display:flex;align-items:center;gap:14px">${pie}<div style="flex:1">${legend}</div></div>
      </div>
    </div>
    <div class="sla-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="chart-title" style="margin:0">Performance SLA par type</div>
        <span style="font-size:11px;color:var(--text-secondary)">Objectif ≤ 5 jours ouvrés</span>
      </div>
      <table class="sla-table">
        <thead><tr><th>Type</th><th>Délai moy.</th><th>Taux SLA</th><th>Rejet</th></tr></thead>
        <tbody>
          <tr><td>Due diligence</td><td>4.2j</td><td><span style="color:#15803D;font-weight:600">78%</span></td><td>5%</td></tr>
          <tr><td>Validation documentation</td><td>2.8j</td><td><span style="color:#15803D;font-weight:600">92%</span></td><td>2%</td></tr>
          <tr><td>Avis réglementaire</td><td>6.1j</td><td><span style="color:#DC2626;font-weight:600">61%</span></td><td>8%</td></tr>

async function submitRequest() {
  const type     = document.getElementById('f-type').value;
  const objet    = document.getElementById('f-objet').value.trim();
  const desc     = document.getElementById('f-desc').value.trim();
  const deadline = document.getElementById('f-deadline').value;

  if (!type || !objet || !desc) {
    alert('Veuillez remplir tous les champs obligatoires (*)');
    return;
  }

  const btn = document.querySelector('[onclick="submitRequest()"]');
  btn.disabled = true;
  btn.textContent = 'Envoi en cours...';

  try {
    const now  = new Date();
    const year = now.getFullYear();

    // 1. Créer l'item dans la liste SharePoint
    const itemBody = {
      fields: {
        Title           : 'CPL-EN-COURS',   // temporaire, mis à jour après
        Objet           : objet,
        Sujet           : type,
        'Priorité'      : selPrio,
        Statut          : 'Soumis',
        Description     : desc,
        Demandeur       : currentUser.name,
        DemandeurEmail  : currentUser.email,
        DemandeurDept   : currentUser.dept,
        DateSoumission  : now.toISOString(),
        ...(deadline ? { Deadline: deadline } : {})
      }
    };
    const created = await graphPost(`/sites/${spSiteId}/lists/${spListId}/items`, itemBody);
    const spItemId = created.id;

    // 2. Générer la référence CPL et mettre à jour le titre
    const ref = `CPL-${year}-${String(spItemId).padStart(4, '0')}`;
    await graphPatch(`/sites/${spSiteId}/lists/${spListId}/items/${spItemId}/fields`, { Title: ref });

    // 3. Créer le dossier dans la bibliothèque CPL-Tracker
    if (spDriveId) {
      try {
        await graphPost(`/sites/${spSiteId}/drives/${spDriveId}/items/root/children`, {
          name: ref,
          folder: {},
          '@microsoft.graph.conflictBehavior': 'replace'
        });
      } catch(e) { console.warn('Dossier SP non créé:', e); }
    }

    // 4. Envoyer le mail à cpl@eiffel-ig.com
    const mailBody = `
      <div style="font-family:Arial,sans-serif;font-size:14px;color:#111">
        <p>Bonjour,</p>
        <p>Une nouvelle demande a été soumise via le <strong>Tracker CPL</strong>.</p>
        <table style="border-collapse:collapse;width:100%;margin:16px 0;border:1px solid #E5E7EB">
          <tr style="background:#F4F5F8"><td style="padding:8px 12px;font-weight:600;width:180px">Référence</td><td style="padding:8px 12px">${ref}</td></tr>
          <tr><td style="padding:8px 12px;font-weight:600">Demandeur</td><td style="padding:8px 12px">${currentUser.name} — ${currentUser.dept}</td></tr>
          <tr style="background:#F4F5F8"><td style="padding:8px 12px;font-weight:600">Type</td><td style="padding:8px 12px">${type}</td></tr>
          <tr><td style="padding:8px 12px;font-weight:600">Priorité</td><td style="padding:8px 12px">${selPrio}</td></tr>
          <tr style="background:#F4F5F8"><td style="padding:8px 12px;font-weight:600">Objet</td><td style="padding:8px 12px">${objet}</td></tr>
          <tr><td style="padding:8px 12px;font-weight:600">Description</td><td style="padding:8px 12px">${desc.replace(/\n/g,'<br>')}</td></tr>
          ${deadline ? `<tr style="background:#F4F5F8"><td style="padding:8px 12px;font-weight:600">Deadline</td><td style="padding:8px 12px">${deadline}</td></tr>` : ''}
          <tr><td style="padding:8px 12px;font-weight:600">Soumis le</td><td style="padding:8px 12px">${now.toLocaleString('fr-FR')}</td></tr>
        </table>
        <p style="color:#6B7280;font-size:12px">— Tracker CPL · Eiffel Investment Group</p>
      </div>`;

    await graphPost('/me/sendMail', {
      message: {
        subject: `[Tracker CPL] Nouvelle demande ${selPrio === 'Critique' ? '🔴' : selPrio === 'Urgente' ? '🟡' : ''} — ${objet} (${ref})`,
        body: { contentType: 'HTML', content: mailBody },
        toRecipients: [{ emailAddress: { address: CPL_MAIL } }]
      },
      saveToSentItems: true
    });

    alert(`✅ Demande ${ref} soumise.\nMail envoyé à ${CPL_MAIL}.`);
    await loadRequests();
    goList();

  } catch(e) {
    console.error('Erreur soumission:', e);
    alert(`Erreur : ${e.message}`);
    btn.disabled = false;
    btn.textContent = 'Soumettre la demande';
  }
}

function openDetail(ref) {
  selectedReq = requests.find(r => r.ref === ref);
  if (!selectedReq) return;

  const TLC = {submit:'#00143B',progress:'#EA580C',wait:'#B45309',done:'#15803D',reject:'#DC2626'};

  const tl = [
    {l:'Demande soumise',     s:`par ${selectedReq.from}`,              d:selectedReq.date+' 09:14', c:TLC.submit},
    ...((['En cours','En attente','Résolu','Clôturé','Rejeté'].includes(selectedReq.statut))?
        [{l:'Prise en charge',s:'Compliance',                           d:selectedReq.date+' 14:20',  c:TLC.progress}]:[]),
    ...(selectedReq.statut==='En attente'?
        [{l:"En attente d'informations",s:'Complément requis',           d:'04/06/2026 14:15',         c:TLC.wait}]:[]),
    ...((selectedReq.statut==='Résolu'||selectedReq.statut==='Clôturé')?
        [{l:'Demande résolue',s:'Avis fourni — voir SharePoint',         d:'30/05/2026 16:44',         c:TLC.done}]:[]),
    ...(selectedReq.statut==='Rejeté'?
        [{l:'Rejetée',        s:'Informations insuffisantes. Merci de resoumettre.',d:'22/05/2026 11:30',c:TLC.reject}]:[]),
  ];

  const tlHTML = tl.map(t => `
    <div class="tl-item">
      <div class="tl-dot" style="background:${t.c};box-shadow:0 0 0 1.5px ${t.c}"></div>
      <div class="tl-label">${t.l}</div>
      <div class="tl-sub">${t.s}</div>

  const visComments = isCPL ? selectedReq.comments : selectedReq.comments.filter(c => !c.internal);

  const commentsHTML = visComments.map(c => `

        <span class="comment-date">${c.date}</span>
        ${c.internal?'<span class="internal-lbl">Note interne</span>':''}
      </div>
      <div style="color:${c.internal?'#713F12':'#374151'};line-height:1.5">${c.text}</div>
    </div>`).join('');

  const cplActions = isCPL ? `
    <div class="cpl-actions-panel">
      <div style="font-size:11px;font-weight:700;color:var(--text-secondary);letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px">Actions Compliance</div>
      <div style="display:flex;flex-direction:column;gap:8px">
        <select class="form-input">
          <option>Changer le statut...</option>
          <option>En cours d'analyse</option>
          <option>En attente d'informations</option>
          <option>Résolu</option>
          <option>Rejeté</option>
          <option>Clôturé</option>
        </select>
        <textarea class="form-input internal-ta" rows="3"
          placeholder="Note interne (visible Compliance uniquement)..."></textarea>
        <button class="btn-primary" style="width:100%;justify-content:center"
          onclick="alert('Action enregistrée — à connecter à l\\'API Graph/SharePoint')">
          ${svgIcon('<polyline points="20 6 9 17 4 12"/>')}
          Appliquer
        </button>
      </div>
    </div>`
    : (selectedReq.statut === 'Résolu' ? `
    <button class="btn-secondary" style="width:100%;margin-top:12px;justify-content:center"
      onclick="alert('Demande rouverte — à connecter à l\\'API')">
      Rouvrir cette demande
    </button>` : '');

  document.getElementById('view-detail').innerHTML = `
    <button class="back-btn" onclick="goList()">
      ${svgIcon('<polyline points="15 18 9 12 15 6"/>')}
      ${isCPL ? 'Toutes les demandes' : 'Mes demandes'}
    </button>
    <div class="detail-grid">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="form-card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:10px">
            <div>
              <div style="font-size:10.5px;color:var(--text-secondary);font-family:monospace;margin-bottom:4px">${selectedReq.ref}</div>
              <div class="section-title" style="font-size:17px;line-height:1.3">${selectedReq.objet}</div>
              <div class="section-desc" style="margin-top:3px">${selectedReq.type}</div>
            </div>
            <div style="display:flex;gap:6px;flex-shrink:0;flex-wrap:wrap">
              ${bdg(selectedReq.statut, SC[selectedReq.statut]||'bdg-brouillon')}
              ${bdg(selectedReq.prio, PC[selectedReq.prio]||'bdg-normale')}
            </div>
          </div>
          <div style="border-top:1px solid var(--border);padding-top:12px;font-size:13px;color:#374151;line-height:1.65">${selectedReq.desc}</div>
          <div style="display:flex;gap:20px;margin-top:12px;padding-top:10px;border-top:1px solid var(--border);flex-wrap:wrap">
            <div style="font-size:11.5px;color:var(--text-secondary)"><strong style="font-weight:500;color:#374151">Demandeur :</strong> ${selectedReq.from} — ${selectedReq.dept}</div>
            <div style="font-size:11.5px;color:var(--text-secondary)"><strong style="font-weight:500;color:#374151">Soumis :</strong> ${selectedReq.date}</div>
          </div>
        </div>
        <div class="form-card">
          <div style="font-size:11px;font-weight:700;color:var(--text-secondary);letter-spacing:.07em;text-transform:uppercase;margin-bottom:12px">Commentaires</div>
          ${commentsHTML || '<p style="color:var(--text-secondary);font-size:13px">Aucun commentaire.</p>'}
          <div style="margin-top:10px">
            <textarea class="form-input form-textarea" rows="2" placeholder="Ajouter un commentaire..."></textarea>
            <div style="display:flex;justify-content:flex-end;margin-top:6px">
              <button class="btn-primary" onclick="alert('Commentaire envoyé — à connecter à l\\'API')">Envoyer</button>
            </div>
          </div>
        </div>
      </div>
      <div>
        <div class="form-card">
          <div style="font-size:11px;font-weight:700;color:var(--text-secondary);letter-spacing:.07em;text-transform:uppercase;margin-bottom:12px">Historique des statuts</div>
          <div class="timeline">${tlHTML}</div>
        </div>
        ${cplActions}
      </div>
    </div>`;

  showView('detail');
  window.scrollTo({top:0, behavior:'smooth'});
}

// ═══════════════════════════════════════════════════════════
// INIT
// ═══════════════════════════════════════════════════════════
document.addEventListener('DOMContentLoaded', initApp);
</script>
</body>
</html>
