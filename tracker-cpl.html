<script>
const msalConfig = {
  auth: {
    clientId: "56c83db2-7fc6-4826-8073-82077e91ae27",
    authority: "https://login.microsoftonline.com/eb5288b6-5ccb-4f5d-88fb-346db1317a4f",

<script>
'use strict';

// ═══════════════════════════════════════════════════════════
// CONFIGURATION
// ═══════════════════════════════════════════════════════════
const CPL_EMAILS = [
  'thomas.oliveira@eiffel-ig.com',
  'cassandre.memet@eiffel-ig.com',
  'manalle.ourrami@eiffel-ig.com',
  'jessica.manukyan@eiffel-ig.com'
];

const CPL_TEAM = [
  { name: 'Thomas Oliveira',  email: 'thomas.oliveira@eiffel-ig.com' },
  { name: 'Cassandre Memet',  email: 'cassandre.memet@eiffel-ig.com' },
  { name: 'Manalle Ourrami',  email: 'manalle.ourrami@eiffel-ig.com' },
  { name: 'Jessica Manukyan', email: 'jessica.manukyan@eiffel-ig.com' }
];

const SP = {
  hostname : 'eiffelinvestmentgroup.sharepoint.com',
  sitePath : '/sites/CPLDashboard',
  listName : 'Tracker CPL Demandes',
  libName  : 'CPL-Tracker'
};

const GRAPH_SCOPES_LOGIN = ['User.Read'];
const GRAPH_SCOPES_SP    = ['Sites.ReadWrite.All'];
const GRAPH_SCOPES_MAIL  = ['Mail.Send'];
const CPL_MAIL           = 'cpl@eiffel-ig.com';

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let currentUser  = null;
let isCPL        = false;
let currentView  = 'list';
let selectedReq  = null;
let statusFilter = 'all';
let cplTab       = 'demandes';
let msalInst     = null;
let spSiteId     = null;
let spListId     = null;
let spDriveId    = null;
let spCommListId = null;  // liste Tracker CPL Commentaires
let requests     = [];
let sortCol      = '_ts';
let sortDir      = -1;    // -1 desc, 1 asc

function sortBy(col) {
  if (sortCol === col) sortDir *= -1;
  else { sortCol = col; sortDir = 1; }
  renderList();
}

function workingDays(startTs) {
  if (!startTs) return 0;
  const start = new Date(startTs);
  const end   = new Date();
  start.setHours(0, 0, 0, 0);
  end.setHours(0, 0, 0, 0);
  let count = 0;
  const d = new Date(start);
  while (d < end) {
    const day = d.getDay();
    if (day !== 0 && day !== 6) count++;
    d.setDate(d.getDate() + 1);
  }
  return count;
}



// ═══════════════════════════════════════════════════════════
// AUTH MSAL
// ═══════════════════════════════════════════════════════════
async function initApp() {
  msalInst = new msal.PublicClientApplication(msalConfig);
  await msalInst.initialize();

  const accounts = msalInst.getAllAccounts();
  if (accounts.length > 0) {
    await loginWithAccount(accounts[0]);
  } else {
    showScreen('login');
  }

  document.getElementById('btn-login').onclick = async () => {
    try {
      const result = await msalInst.loginPopup({ scopes: GRAPH_SCOPES_LOGIN });
      await loginWithAccount(result.account);
    } catch(e) {
      console.error('Login failed:', e);
    }
  };

  document.getElementById('btn-logout').onclick = async () => {
    try { await msalInst.logoutPopup(); } catch(e) {}
    showScreen('login');
  };
}

async function loginWithAccount(account) {
  try {
    const token = await getToken(GRAPH_SCOPES_LOGIN, account);
    const p = await graphGet('/me', token);
    setUser({ name: p.displayName, email: p.userPrincipalName, dept: p.department || 'Collaborateur', account });
  } catch(e) {
    console.error('Token error:', e);
    showScreen('login');
  }
}

function setUser(u) {
  currentUser = u;
  isCPL = CPL_EMAILS.map(e => e.toLowerCase()).includes(u.email.toLowerCase());
  const ini = u.name.split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('user-avatar').textContent = ini;
  document.getElementById('user-avatar').style.background = isCPL ? '#D18F41' : '#4B5563';
  document.getElementById('user-name').textContent = u.name;
  document.getElementById('user-role').textContent  = isCPL ? 'Compliance' : 'Collaborateur';
  showScreen('app');
  initSharePointThenLoad();
}

// ═══════════════════════════════════════════════════════════
// GRAPH HELPERS
// ═══════════════════════════════════════════════════════════
async function getToken(scopes, account) {
  const acc = account || currentUser?.account || msalInst.getAllAccounts()[0];
  try {
    const res = await msalInst.acquireTokenSilent({ scopes, account: acc });
    return res.accessToken;
  } catch(e) {
    if (e.name === 'InteractionRequiredAuthError' || e instanceof msal.InteractionRequiredAuthError) {
      const res = await msalInst.acquireTokenPopup({ scopes, account: acc });
      return res.accessToken;
    }
    throw e;
  }
}

async function graphGet(path, token) {
  const t = token || await getToken(GRAPH_SCOPES_SP);
  const res = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    headers: { Authorization: `Bearer ${t}` }
  });
  if (!res.ok) throw new Error(`Graph GET ${path} → ${res.status}`);
  return res.json();
}

async function graphPost(path, body, scopes) {
  const t = await getToken(scopes || GRAPH_SCOPES_SP);
  const res = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    method: 'POST',
    headers: { Authorization: `Bearer ${t}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) { const e = await res.text(); throw new Error(`Graph POST ${path} → ${res.status}: ${e}`); }
  return (res.status === 204 || res.status === 202) ? null : res.json();
}

async function graphPatch(path, body) {
  const t = await getToken(GRAPH_SCOPES_SP);
  const res = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    method: 'PATCH',
    headers: { Authorization: `Bearer ${t}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) throw new Error(`Graph PATCH ${path} → ${res.status}`);
  return (res.status === 204 || res.status === 202) ? null : res.json();
}

async function graphPut(path, data, contentType) {
  const t = await getToken(GRAPH_SCOPES_SP);
  const res = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    method: 'PUT',
    headers: { Authorization: `Bearer ${t}`, 'Content-Type': contentType || 'application/octet-stream' },
    body: data
  });
  if (!res.ok) throw new Error(`Graph PUT ${path} → ${res.status}`);
  return res.json();
}

// ═══════════════════════════════════════════════════════════
// SHAREPOINT — initialisation + chargement
// ═══════════════════════════════════════════════════════════
async function initSharePointThenLoad() {
  setListLoading(true);
  try {
    // 1. Site ID
    const site = await graphGet(`/sites/${SP.hostname}:${SP.sitePath}`);
    spSiteId = site.id;

    // 2. List ID
    const lists = await graphGet(`/sites/${spSiteId}/lists?$filter=displayName eq '${encodeURIComponent(SP.listName)}'`);
    spListId = lists.value[0]?.id;
    if (!spListId) throw new Error(`Liste "${SP.listName}" introuvable sur SharePoint`);

    // 3. Drive ID (bibliothèque CPL-Tracker)
    const drives = await graphGet(`/sites/${spSiteId}/drives`);
    const drive  = drives.value.find(d => d.name === SP.libName);
    spDriveId    = drive?.id || null;

    // 4. Liste commentaires
    const commLists = await graphGet(`/sites/${spSiteId}/lists?$filter=displayName eq 'Tracker CPL commentaires'`);
    spCommListId = commLists.value[0]?.id || null;
    if (!spCommListId) console.warn('Liste "Tracker CPL commentaires" introuvable');

    await loadRequests();
  } catch(e) {
    console.error('SharePoint init error:', e);
    setListLoading(false);
    showListError(e.message);
  }
}

async function loadRequests() {
  setListLoading(true);
  try {
    const data = await graphGet(
      `/sites/${spSiteId}/lists/${spListId}/items?expand=fields&$top=9999`
    );
    requests = data.value.map(item => {
      const f = item.fields;
      return {
        spId   : item.id,
        ref    : f.Title        || '',
        objet  : f.Objet        || '',
        type   : f.Sujet        || '',
        prio   : f.Priorit_x00e9_ || f.Priorité || f.Priorite || '',
        statut : f.Statut       || 'Soumis',
        date   : f.DateSoumission ? new Date(f.DateSoumission).toLocaleDateString('fr-FR') : '',
        updated: item.lastModifiedDateTime ? new Date(item.lastModifiedDateTime).toLocaleDateString('fr-FR') : '',
        from   : f.Demandeur    || '',
        email  : f.DemandeurEmail || '',
        dept   : f.DemandeurDept  || '',
        desc   : f.Description  || '',
        deadline: f.Deadline    || '',
        sla           : f.DateSoumission ? workingDays(new Date(f.DateSoumission).getTime()) : 0,
        responsable   : f.ResponsableCPL || '',
        followers     : f.CCEmails || '',
        historique    : (() => { try { return f.HistoriqueStatuts ? JSON.parse(f.HistoriqueStatuts) : []; } catch(e) { return []; } })(),
        _ts           : f.DateSoumission ? new Date(f.DateSoumission).getTime() : 0,
        _lastModified : item.lastModifiedDateTime ? new Date(item.lastModifiedDateTime).getTime() : 0,
        comments: []
      };
    }).sort((a, b) => b._ts - a._ts); // tri par date décroissante côté client
    setListLoading(false);
    renderList();
  } catch(e) {
    console.error('Erreur chargement demandes:', e);
    setListLoading(false);
    showListError(e.message);
  }
}

function setListLoading(on) {
  const el = document.getElementById('list-loading');
  if (el) el.style.display = on ? 'flex' : 'none';
}

function showListError(msg) {
  const el = document.getElementById('list-error');
  if (el) { el.textContent = `Erreur : ${msg}`; el.style.display = 'block'; }
}


// ═══════════════════════════════════════════════════════════
// NAVIGATION
// ═══════════════════════════════════════════════════════════
function showScreen(id) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById('screen-' + id).classList.add('active');
}

function showView(id) {
  ['list','new','detail'].forEach(v => {
    document.getElementById('view-' + v).classList.toggle('hidden', v !== id);
  });
  currentView = id;
}

function goList() { renderList(); showView('list'); window.scrollTo(0,0); }
function setFilter(s) { statusFilter = s; renderList(); }
function setCplTab(t) { cplTab = t; renderList(); }

// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
const SC = {
  'Brouillon':'bdg-brouillon','À traiter':'bdg-soumis',
  "En cours d'analyse":'bdg-en-cours',"En attente d'informations":'bdg-en-attente',
  'Traité':'bdg-resolu','Clôturé':'bdg-cloture','Rejeté':'bdg-rejete'
};
const PC = {'Faible':'bdg-normale','Élevé':'bdg-urgente','Critique':'bdg-critique'};

function bdg(label, cls) {
  return `<span class="bdg ${cls}">${label}</span>`;
}

function svgIcon(path, extras) {
  return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ${extras||''}>${path}</svg>`;
}

// ═══════════════════════════════════════════════════════════
// VUE LISTE
// ═══════════════════════════════════════════════════════════
function renderList() {
  const all      = isCPL ? requests : requests.filter(r =>
    r.email === currentUser.email ||
    (r.followers || '').toLowerCase()
      .split(',')
      .map(e => e.trim())
      .includes(currentUser.email.toLowerCase())
  );
  const filtered = statusFilter === 'all' ? all : all.filter(r => r.statut === statusFilter);
  const open     = all.filter(r => ['À traiter',"En cours d'analyse","En attente d'informations"].includes(r.statut)).length;
  const awaiting = all.filter(r => r.statut === "En attente d'informations").length;
  const overSLA  = requests.filter(r => r.sla > 5 && ['À traiter',"En cours d'analyse","En attente d'informations"].includes(r.statut)).length;

  const STATUSES = ['all','À traiter',"En cours d'analyse","En attente d'informations",'Traité','Clôturé','Rejeté'];
  const BG = {'À traiter':'#EFF6FF',"En cours d'analyse":'#FFF7ED',"En attente d'informations":'#FEFCE8','Traité':'#F0FDF4',Clôturé:'#ECFDF5',Rejeté:'#FEF2F2'};
  const CO = {'À traiter':'#2563EB',"En cours d'analyse":'#C2410C',"En attente d'informations":'#B45309','Traité':'#15803D',Clôturé:'#065F46',Rejeté:'#DC2626'};
  const BO = {'À traiter':'#BFDBFE',"En cours d'analyse":'#FED7AA',"En attente d'informations":'#FDE68A','Traité':'#BBF7D0',Clôturé:'#6EE7B7',Rejeté:'#FECACA'};

  const filterBtns = STATUSES.map(s => {
    const active = statusFilter === s;
    const count  = s === 'all' ? all.length : all.filter(r => r.statut === s).length;
    let st = '';
    if(active && s !== 'all') st = `style="background:${BG[s]};color:${CO[s]};border-color:${BO[s]}"`;
    else if(active)            st = `style="background:var(--navy);color:#fff;border-color:var(--navy)"`;
    return `<button class="filter-pill" data-s="${s}" onclick="setFilter(this.dataset.s)" ${st}>${s==='all'?'Tous':s}${count>0?` <span style="opacity:.6">(${count})</span>`:''}</button>`;
  }).join('');

  // Tri
  const sortedFiltered = [...filtered].sort((a, b) => {
    let va = a[sortCol] ?? '';
    let vb = b[sortCol] ?? '';
    if (typeof va === 'string') va = va.toLowerCase();
    if (typeof vb === 'string') vb = vb.toLowerCase();
    return va < vb ? -sortDir : va > vb ? sortDir : 0;
  });

  const arrow = col => sortCol === col ? (sortDir === 1 ? ' ↑' : ' ↓') : ' ↕';
  const th = (label, col, w) =>
    `<th onclick="sortBy('${col}')" style="cursor:pointer;white-space:nowrap;${w?'width:'+w:''}">
      ${label}<span style="opacity:.4;font-size:10px">${arrow(col)}</span>
    </th>`;

  const cplTh  = isCPL ? `${th('Demandeur','from','120px')}${th('Département','dept','110px')}` : '';
  const cplThR = isCPL ? `${th('Responsable CPL','responsable','140px')}` : '';
  const cols   = isCPL ? 9 : 6;

  const rows = sortedFiltered.map(req => {
    const over = isCPL && req.sla > 5 && ['À traiter',"En cours d'analyse","En attente d'informations"].includes(req.statut);
    const near = isCPL && req.sla >= 4 && req.sla <= 5 && ['À traiter',"En cours d'analyse","En attente d'informations"].includes(req.statut);
    const cplTd = isCPL ? `<td class="td-muted" style="color:#374151">${req.from}</td><td class="td-muted">${req.dept}</td>` : '';
    const cplTdR = isCPL ? `<td class="td-muted" style="white-space:nowrap">${req.responsable || '—'}</td>` : '';
    return `<tr class="${over?'sla-over':''}" onclick="openDetail('${req.ref}')">
      <td class="td-ref">${req.ref}${over?' <span style="color:#DC2626;font-size:10px">⚠ SLA</span>':''}${near?' <span style="color:#D97706;font-size:10px">⚡</span>':''}</td>
      <td><div class="td-objet-main">${req.objet}</div><div class="td-objet-sub">${req.type}</div></td>
      ${cplTd}
      <td>${bdg(req.prio, PC[req.prio]||'bdg-normale')}</td>
      <td>${bdg(req.statut, SC[req.statut]||'bdg-brouillon')}${req.statut==="En attente d'informations"&&!isCPL?'<div class="action-req">↩ Action requise</div>':''}</td>
      <td class="td-muted">${req.date}</td>
      <td class="td-muted">${req.deadline ? new Date(req.deadline).toLocaleDateString('fr-FR') : '—'}</td>
      ${cplTdR}
    </tr>`;
  }).join('') || `<tr><td colspan="${cols}" style="padding:24px;text-align:center;color:var(--text-secondary)">Aucune demande dans cette catégorie</td></tr>`;

  const tabBtns = isCPL ? `
    <div class="nav-tabs-sub">
      <button class="nav-tab-sub ${cplTab==='demandes'?'active':''}" onclick="setCplTab('demandes')">Demandes</button>
      <button class="nav-tab-sub ${cplTab==='dashboard'?'active':''}" onclick="setCplTab('dashboard')">Dashboard KPI</button>
    </div>` : '';

  const exportBtn = isCPL && cplTab==='demandes' ? `
    <button class="btn-secondary" onclick="exportCSV()">
      ${svgIcon('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="7 10 12 15 17 10"/><line x1="12" y1="15" x2="12" y2="3"/>')}
      Exporter CSV
    </button>` : '';

  const searchBox = isCPL ? `
    <input type="text" placeholder="Rechercher..." oninput="searchTable(this.value)"
      style="margin-left:auto;padding:4px 10px;border-radius:6px;border:1px solid var(--border);font-size:12px;font-family:inherit;width:150px">` : '';

  const content = (cplTab === 'dashboard' && isCPL) ? renderDashboard() : `
    <div class="cpl-filters">${filterBtns}${searchBox}</div>
    <div class="table-wrapper">
      <table class="data-table cpl-table" style="width:100%;table-layout:auto">
        <thead><tr>
          ${th('Référence','ref','')}
          ${th('Objet','objet','')}
          ${cplTh}
          ${th('Priorité','prio','80px')}
          ${th('Statut','statut','120px')}
          ${th('Soumis le','date','95px')}
          ${th('Deadline','deadline','95px')}
          ${cplThR}
        </tr></thead>
        <tbody id="req-tbody">${rows}</tbody>
      </table>
    </div>`;

  document.getElementById('view-list').innerHTML = `
    <div class="section-header">
      <div>
        <div style="display:flex;align-items:center;flex-wrap:wrap;gap:8px">
          <h2 class="section-title">${isCPL ? 'Tracker CPL' : 'Mes demandes'}</h2>
          ${tabBtns}
        </div>
        <p class="section-desc">${isCPL
          ? `${requests.length} demandes au total &nbsp;·&nbsp; ${open} ouvertes &nbsp;·&nbsp; ${overSLA} hors SLA`
          : `${all.length} demande${all.length>1?'s':''} &nbsp;·&nbsp; ${awaiting} action${awaiting>1?'s':''} requise${awaiting>1?'s':''} de votre part`
        }</p>
      </div>
      <div style="display:flex;gap:8px;align-items:center">
        ${exportBtn}
        <button class="btn-primary" onclick="goNew()">
          ${svgIcon('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>')}
          Nouvelle demande
        </button>
      </div>
    </div>
    ${content}`;
}

function searchTable(q) {
  const rows = document.querySelectorAll('#req-tbody tr');
  rows.forEach(r => {
    r.style.display = r.textContent.toLowerCase().includes(q.toLowerCase()) ? '' : 'none';
  });
}

function exportCSV() {
  const headers = ['Référence','Objet','Type','Priorité','Statut','Demandeur','Département','Soumis le','Activité'];
  const lines = [headers.join(';')].concat(
    requests.map(r => [r.ref,r.objet,r.type,r.prio,r.statut,r.from,r.dept,r.date,r.updated].join(';'))
  );
  const blob = new Blob(['\uFEFF'+lines.join('\n')], {type:'text/csv;charset=utf-8;'});
  const a = document.createElement('a'); a.href = URL.createObjectURL(blob);
  a.download = `tracker-cpl-${new Date().toISOString().slice(0,10)}.csv`; a.click();
}

// ═══════════════════════════════════════════════════════════
// DASHBOARD KPI (données réelles)
// ═══════════════════════════════════════════════════════════
function renderDashboard() {
  const open    = requests.filter(r => ['À traiter',"En cours d'analyse","En attente d'informations"].includes(r.statut)).length;
  const resolved= requests.filter(r => ['Traité','Clôturé'].includes(r.statut)).length;
  const rejected= requests.filter(r => r.statut === 'Rejeté').length;
  const total   = requests.length;

  // Délai moyen de traitement (demandes résolues/clôturées)
  const resolvedReqs = requests.filter(r => r.statut === 'Traité' && r._ts && r._lastModified);
  const avgDays = resolvedReqs.length
    ? (resolvedReqs.reduce((sum,r) => sum + (r._lastModified - r._ts), 0) / resolvedReqs.length / (1000*60*60*24)).toFixed(1)
    : '—';

  // Volume par mois (6 derniers mois)
  const now = new Date();
  const months = Array.from({length:6}, (_,i) => {
    const d = new Date(now.getFullYear(), now.getMonth() - 5 + i, 1);
    return { label: d.toLocaleDateString('fr-FR',{month:'short'}), year: d.getFullYear(), month: d.getMonth(), count: 0 };
  });
  requests.forEach(r => {
    if (!r._ts) return;
    const d = new Date(r._ts);
    const m = months.find(x => x.year === d.getFullYear() && x.month === d.getMonth());
    if (m) m.count++;
  });
  const maxVol = Math.max(...months.map(m => m.count), 1);

  const bars = months.map(m => `
    <div class="bar-item">
      <div class="bar-fill" style="height:${Math.round((m.count/maxVol)*110)}px" title="${m.count} demandes"></div>
      <span class="bar-lbl">${m.label}</span>
    </div>`).join('');

  // Répartition par type
  const typeCount = {};
  requests.forEach(r => { if(r.type) typeCount[r.type] = (typeCount[r.type]||0) + 1; });
  const typeEntries = Object.entries(typeCount).sort((a,b)=>b[1]-a[1]).slice(0,6);
  const PIE_C = ['#00143B','#D18F41','#006660','#2563EB','#7C3AED','#6B7280'];

  let pie = '<svg viewBox="0 0 100 100" width="110" height="110">';
  if (typeEntries.length === 0) {
    pie += '<circle cx="50" cy="50" r="47" fill="#F3F4F6"/><circle cx="50" cy="50" r="26" fill="#fff"/>';
  } else {
    const totalT = typeEntries.reduce((s,[,v])=>s+v,0);
    let angle = -Math.PI/2;
    typeEntries.forEach(([,count],i) => {
      const r2 = (count/totalT)*2*Math.PI;
      const x1=50+47*Math.cos(angle),y1=50+47*Math.sin(angle); angle+=r2;
      const x2=50+47*Math.cos(angle),y2=50+47*Math.sin(angle);
      pie += `<path d="M50,50 L${x1.toFixed(1)},${y1.toFixed(1)} A47,47 0 ${r2>Math.PI?1:0},1 ${x2.toFixed(1)},${y2.toFixed(1)} Z" fill="${PIE_C[i%PIE_C.length]}" stroke="#fff" stroke-width="1.5"/>`;
    });
    pie += '<circle cx="50" cy="50" r="26" fill="#fff"/>';
  }
  pie += '</svg>';

  const legend = typeEntries.length ? typeEntries.map(([name,count],i) => `
    <div class="pie-row">
      <div class="pie-dot" style="background:${PIE_C[i%PIE_C.length]}"></div>
      <span class="pie-name">${name}</span>
      <span class="pie-pct">${count}</span>
    </div>`).join('') : '<p style="font-size:12px;color:var(--text-secondary)">Aucune donnée</p>';

  // Répartition par département
  const deptCount = {};
  requests.forEach(r => { if(r.dept) deptCount[r.dept] = (deptCount[r.dept]||0)+1; });
  const deptRows = Object.entries(deptCount).sort((a,b)=>b[1]-a[1]).map(([dept,count]) => `
    <tr><td style="padding:7px 8px;color:#374151">${dept}</td>
    <td style="padding:7px 8px;text-align:right;font-weight:500;color:var(--navy)">${count}</td>
    <td style="padding:7px 8px;text-align:right;color:var(--text-secondary)">${total?Math.round(count/total*100):0}%</td></tr>`).join('');

  return `
    <div class="kpi-grid">
      <div class="kpi-card">
        <div class="kpi-icon" style="background:#EFF6FF">${svgIcon('<path d="M22 12h-4l-3 9L9 3l-3 9H2"/>','stroke="#2563EB"')}</div>
        <div class="kpi-val">${open}</div><div class="kpi-lbl">Demandes ouvertes</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon" style="background:#F0FDF4">${svgIcon('<polyline points="20 6 9 17 4 12"/>','stroke="#15803D"')}</div>
        <div class="kpi-val">${resolved}</div><div class="kpi-lbl">Résolues / Clôturées</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon" style="background:#FEF2F2">${svgIcon('<path d="M10.29 3.86L1.82 18a2 2 0 0 0 1.71 3h16.94a2 2 0 0 0 1.71-3L13.71 3.86a2 2 0 0 0-3.42 0z"/><line x1="12" y1="9" x2="12" y2="13"/><line x1="12" y1="17" x2="12.01" y2="17"/>','stroke="#DC2626"')}</div>
        <div class="kpi-val">${rejected}</div><div class="kpi-lbl">Rejetées</div>
      </div>
      <div class="kpi-card">
        <div class="kpi-icon" style="background:#FFF7ED">${svgIcon('<circle cx="12" cy="12" r="10"/><polyline points="12 6 12 12 16 14"/>','stroke="#D18F41"')}</div>
        <div class="kpi-val">${avgDays}${avgDays !== '—' ? 'j' : ''}</div><div class="kpi-lbl">Délai moyen traitement</div>
      </div>
    </div>
    <div class="charts-row">
      <div class="chart-card">
        <div class="chart-title">Volume — 6 derniers mois</div>
        <div class="bar-chart">${bars}</div>
      </div>
      <div class="chart-card">
        <div class="chart-title">Par type de demande</div>
        <div style="display:flex;align-items:center;gap:14px">${pie}<div style="flex:1">${legend}</div></div>
      </div>
    </div>
    <div class="sla-card">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:12px">
        <div class="chart-title" style="margin:0">Demandes par département</div>
        <span style="font-size:11px;color:var(--text-secondary)">${total} demande${total>1?'s':''} au total</span>
      </div>
      ${deptRows ? `<table class="sla-table">
        <thead><tr><th>Département</th><th style="text-align:right">Demandes</th><th style="text-align:right">Part</th></tr></thead>
        <tbody>${deptRows}</tbody>
      </table>` : '<p style="font-size:13px;color:var(--text-secondary)">Aucune donnée disponible.</p>'}
    </div>`;
}

function setPrio(p, btn) {
  selPrio = p;
  document.querySelectorAll('.prio-btn').forEach(b => b.classList.remove('sel'));
  btn.classList.add('sel');
  const needsDeadline = ['Élevé','Critique'].includes(p);
  const msg = document.getElementById('deadline-required-msg');
  const lbl = document.getElementById('deadline-label');
  if (msg) msg.style.display = needsDeadline ? 'block' : 'none';
  if (lbl) lbl.innerHTML = needsDeadline
    ? 'Deadline * <span style="color:#C2410C;font-weight:500">(obligatoire)</span>'
    : 'Deadline souhaitée <span style="color:var(--text-secondary);font-weight:400">(optionnel)</span>';
}

function addFilesToList(newFiles) {
  for (const f of newFiles) {
    if (!allSelectedFiles.find(x => x.name === f.name && x.size === f.size))
      allSelectedFiles.push(f);
  }
  renderFileList();
}

function removeFile(index) {
  allSelectedFiles.splice(index, 1);
  renderFileList();
}

function renderFileList() {
  const list = document.getElementById('file-list');
  if (!list) return;
  if (!allSelectedFiles.length) { list.innerHTML = ''; return; }
  list.innerHTML = allSelectedFiles.map((f, i) => {
    const ext = f.name.split('.').pop().toLowerCase();
    const color = ext === 'pdf' ? '#DC2626'
      : ['xls','xlsx'].includes(ext) ? '#16A34A'
      : ['doc','docx'].includes(ext) ? '#2563EB'
      : '#6B7280';
    const size = f.size >= 1024*1024
      ? (f.size/(1024*1024)).toFixed(1)+' Mo'
      : (f.size/1024).toFixed(0)+' Ko';
    return `<div style="display:flex;align-items:center;gap:6px;font-size:12px;color:#374151;padding:3px 0">
      <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="${color}" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
      <span style="flex:1">${f.name}</span>
      <span style="color:#9CA3AF">${size}</span>
      <button onclick="removeFile(${i})" style="background:none;border:none;cursor:pointer;color:#9CA3AF;font-size:16px;line-height:1;padding:0 2px" title="Retirer">×</button>
    </div>`;
  }).join('');
}

function updateFileList() {
  const input = document.getElementById('f-files');
  if (input?.files.length) addFilesToList(input.files);
}

async function uploadFile(ref, file) {
  if (!spDriveId) return null;
  const encoded = encodeURIComponent(file.name);
  const basePath = `/sites/${spSiteId}/drives/${spDriveId}/items/root:/${ref}/${encoded}`;

  if (file.size <= 4 * 1024 * 1024) {
    const buf = await file.arrayBuffer();
    return await graphPut(`${basePath}:/content`, buf, file.type || 'application/octet-stream');
  } else {
    const session = await graphPost(`${basePath}:/createUploadSession`, {
      item: { '@microsoft.graph.conflictBehavior': 'replace' }
    });
    const chunkSize = 3 * 1024 * 1024;
    const buf = await file.arrayBuffer();
    let start = 0; let result = null;
    while (start < file.size) {
      const end = Math.min(start + chunkSize, file.size);
      const chunk = buf.slice(start, end);
      const res = await fetch(session.uploadUrl, {
        method: 'PUT',
        headers: { 'Content-Range': `bytes ${start}-${end-1}/${file.size}`, 'Content-Length': String(end - start) },
        body: chunk
      });
      if (res.ok) result = await res.json().catch(() => null);
      start = end;
    }
    return result;
  }
}

async function loadFilesForDetail(ref) {
  const container = document.getElementById('files-container');
  if (!container || !spDriveId) return;
  container.innerHTML = '<span style="font-size:12px;color:var(--text-secondary)">Chargement...</span>';
  try {
    const res   = await graphGet(`/sites/${spSiteId}/drives/${spDriveId}/items/root:/${ref}:/children`);
    const files = res.value.filter(f => f.file);
    if (!files.length) {
      container.innerHTML = '<p style="font-size:12.5px;color:var(--text-secondary)">Aucun fichier déposé.</p>';
    } else {
      container.innerHTML = files.map(f => {
        const uploader = f.createdBy?.user?.displayName || f.lastModifiedBy?.user?.displayName || '—';
        const uploadDate = f.createdDateTime ? new Date(f.createdDateTime).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '';
        return `
        <div style="display:flex;align-items:center;justify-content:space-between;padding:7px 0;border-bottom:1px solid var(--border)">
          <div style="display:flex;align-items:center;gap:8px">
            ${svgIcon('<path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/>')}
            <div>
              <div style="font-size:12.5px;font-weight:500;color:#111827">${f.name}</div>
              <div style="font-size:10.5px;color:var(--text-secondary)">${(f.size/1024).toFixed(0)} Ko · ${uploader} · ${uploadDate}</div>
            </div>
          </div>
          ${/\.(msg|eml)$/i.test(f.name)
            ? `<a href="${f.webUrl}?download=1" download class="btn-secondary" style="font-size:11px;padding:4px 10px;text-decoration:none">Télécharger</a>`
            : `<a href="${f.webUrl}" target="_blank" class="btn-secondary" style="font-size:11px;padding:4px 10px;text-decoration:none">Ouvrir</a>`
          }
        </div>`;
      }).join('');
    }
  } catch(e) {
    container.innerHTML = '<p style="font-size:12px;color:var(--text-secondary)">Dossier introuvable sur SharePoint.</p>';
  }
}

async function uploadFromDetail() {
  const input = document.getElementById('detail-file-input');
  const ref   = selectedReq?.ref;
  if (!input?.files.length || !ref) return;
  const btn = document.getElementById('detail-upload-btn');
  btn.disabled = true;
  btn.textContent = 'Upload...';
  for (const file of input.files) {
    try { await uploadFile(ref, file); }
    catch(e) { console.warn(`Erreur upload ${file.name}:`, e); }
  }
  btn.disabled = false;
  btn.textContent = 'Déposer';
  input.value = '';
  await loadFilesForDetail(ref);
}

let followersSelected  = [];
let allSelectedFiles   = [];

async function searchFollowers(query) {
  if (query.length < 2) {
    document.getElementById('followers-suggestions').style.display = 'none';
    return;
  }
  try {
    const token = await getToken(GRAPH_SCOPES_LOGIN);
    const res = await fetch(
      `https://graph.microsoft.com/v1.0/users?$search="displayName:${query}"&$select=displayName,mail,userPrincipalName&$top=8`,
      { headers: { Authorization: `Bearer ${token}`, ConsistencyLevel: 'eventual' } }
    );
    const data = await res.json();
    const box = document.getElementById('followers-suggestions');
    if (!data.value?.length) { box.style.display = 'none'; return; }
    box.innerHTML = data.value
      .filter(u => {
        const email = u.mail || u.userPrincipalName || '';
        return email.toLowerCase().endsWith('@eiffel-ig.com');
      })
      .map(u => {
        const email = u.mail || u.userPrincipalName;
        return `<div onclick="addFollower('${u.displayName.replace(/'/g,"\\'")}','${email}')"
          style="padding:8px 12px;cursor:pointer;font-size:13px;border-bottom:1px solid var(--border)"
          onmouseover="this.style.background='#F4F5F8'"
          onmouseout="this.style.background='white'">
          <div style="font-weight:500">${u.displayName}</div>
          <div style="font-size:11px;color:var(--text-secondary)">${email}</div>
        </div>`;
      }).join('');
    box.style.display = 'block';
  } catch(e) { console.warn('Recherche followers:', e); }
}

function addFollower(name, email) {
  if (followersSelected.find(f => f.email === email)) return;
  followersSelected.push({ name, email });
  renderFollowerTags();
  document.getElementById('f-followers-input').value = '';
  document.getElementById('followers-suggestions').style.display = 'none';
  document.getElementById('f-followers-value').value = followersSelected.map(f => f.email).join(',');
}

function removeFollower(email) {
  followersSelected = followersSelected.filter(f => f.email !== email);
  renderFollowerTags();
  document.getElementById('f-followers-value').value = followersSelected.map(f => f.email).join(',');
}

function renderFollowerTags() {
  document.getElementById('followers-tags').innerHTML = followersSelected.map(f => `
    <span style="display:inline-flex;align-items:center;gap:4px;background:#EFF6FF;color:#2563EB;border:1px solid #BFDBFE;border-radius:20px;padding:2px 10px;font-size:12px;font-weight:500">
      ${f.name}
      <span onclick="removeFollower('${f.email}')" style="cursor:pointer;margin-left:2px;opacity:.6;font-size:14px">×</span>
    </span>`).join('');
}

document.addEventListener('click', e => {
  if (!e.target.closest('#f-followers-input') && !e.target.closest('#followers-suggestions')) {
    const box = document.getElementById('followers-suggestions');
    if (box) box.style.display = 'none';
  }
});

async function submitRequest() {
  const dept     = document.getElementById('f-dept').value;
  const type     = document.getElementById('f-type').value;
  const objet    = document.getElementById('f-objet').value.trim();
  const desc     = document.getElementById('f-desc').value.trim();
  const deadline = document.getElementById('f-deadline').value;

  if (!dept || !type || !objet || !desc) {
    alert('Veuillez remplir tous les champs obligatoires (*)');
    return;
  }
  if (['Élevé','Critique'].includes(selPrio) && !deadline) {
    alert('Une deadline est obligatoire pour les priorités Élevé et Critique.');
    return;
  }

  const btn = document.querySelector('[onclick="submitRequest()"]');
  btn.disabled = true;
  btn.textContent = 'Envoi en cours...';

  try {
    const now  = new Date();
    const year = now.getFullYear();

    // 1. Créer l'item dans la liste SharePoint
    const itemBody = {
      fields: {
        Title                    : 'CPL-EN-COURS',
        Objet                    : objet,
        Sujet                    : type,
        'Priorit_x00e9_'         : selPrio,
        Statut                   : 'À traiter',
        Description              : desc,
        Demandeur                : currentUser.name,
        DemandeurEmail           : currentUser.email,
        DemandeurDept            : dept,
        DateSoumission           : now.toISOString(),
        HistoriqueStatuts        : JSON.stringify([{ date: now.toISOString(), statut: 'À traiter', par: currentUser.name }]),
        ...(deadline ? { Deadline: deadline } : {})
      }
    };
    const created = await graphPost(`/sites/${spSiteId}/lists/${spListId}/items`, itemBody);
    const spItemId = created.id;

    // 2. Générer la référence CPL et mettre à jour le titre
    const ref = `CPL-${year}-${String(spItemId).padStart(4, '0')}`;
    await graphPatch(`/sites/${spSiteId}/lists/${spListId}/items/${spItemId}/fields`, { Title: ref });

    // 2b. Patch séparé pour CCEmails (colonne parfois rejetée dans le POST initial)
    const followersValue = followersSelected.map(f => f.email).join(',');
    if (followersValue) {
      try {
        await graphPatch(
          `/sites/${spSiteId}/lists/${spListId}/items/${spItemId}/fields`,
          { CCEmails: followersValue }
        );
      } catch(e) {}
    }

    // 3. Créer le dossier dans la bibliothèque CPL-Tracker
    if (spDriveId) {
      try {
        await graphPost(`/sites/${spSiteId}/drives/${spDriveId}/items/root/children`, {
          name: ref,
          folder: {},
          '@microsoft.graph.conflictBehavior': 'replace'
        });
      } catch(e) { console.warn('Dossier SP non créé:', e); }
    }

    // 4. Upload des pièces jointes
    if (allSelectedFiles.length && spDriveId) {
      btn.textContent = `Upload des fichiers (0/${allSelectedFiles.length})...`;
      let i = 0;
      for (const file of allSelectedFiles) {
        try {
          await uploadFile(ref, file);
          i++;
          btn.textContent = `Upload des fichiers (${i}/${allSelectedFiles.length})...`;
        } catch(e) { console.warn(`Erreur upload ${file.name}:`, e); }
      }
    }

    // 5. Envoyer le mail à cpl@eiffel-ig.com (non bloquant)
    try {
      const mailBody = `
        <div style="font-family:Arial,sans-serif;font-size:14px;color:#111">
          <p>Bonjour,</p>
          <p>Une nouvelle demande a été soumise via le <strong>Tracker CPL</strong>.</p>
          <table style="border-collapse:collapse;width:100%;margin:16px 0;border:1px solid #E5E7EB">
            <tr style="background:#F4F5F8"><td style="padding:8px 12px;font-weight:600;width:180px">Référence</td><td style="padding:8px 12px">${ref}</td></tr>
            <tr><td style="padding:8px 12px;font-weight:600">Demandeur</td><td style="padding:8px 12px">${currentUser.name} — ${currentUser.dept}</td></tr>
            <tr style="background:#F4F5F8"><td style="padding:8px 12px;font-weight:600">Type</td><td style="padding:8px 12px">${type}</td></tr>
            <tr><td style="padding:8px 12px;font-weight:600">Priorité</td><td style="padding:8px 12px">${selPrio}</td></tr>
            <tr style="background:#F4F5F8"><td style="padding:8px 12px;font-weight:600">Objet</td><td style="padding:8px 12px">${objet}</td></tr>
            <tr><td style="padding:8px 12px;font-weight:600">Description</td><td style="padding:8px 12px">${desc.replace(/\n/g,'<br>')}</td></tr>
            ${deadline ? `<tr style="background:#F4F5F8"><td style="padding:8px 12px;font-weight:600">Deadline</td><td style="padding:8px 12px">${deadline}</td></tr>` : ''}
            <tr><td style="padding:8px 12px;font-weight:600">Soumis le</td><td style="padding:8px 12px">${now.toLocaleString('fr-FR')}</td></tr>
          </table>
          <p style="color:#6B7280;font-size:12px">— Tracker CPL · Eiffel Investment Group</p>
        </div>`;
      await graphPost('/me/sendMail', {
        message: {
          subject: `[Tracker CPL] Nouvelle demande ${selPrio === 'Critique' ? '🔴' : selPrio === 'Élevé' ? '🟡' : ''} — ${objet} (${ref})`,
          body: { contentType: 'HTML', content: mailBody },
          toRecipients: [{ emailAddress: { address: CPL_MAIL } }],
          ccRecipients: (document.getElementById('f-followers-value')?.value || '')
            .split(',')
            .map(e => e.trim())
            .filter(Boolean)
            .map(e => ({ emailAddress: { address: e } }))
        },
        saveToSentItems: true
      }, GRAPH_SCOPES_MAIL);
    } catch(mailErr) {
      console.warn('Mail non envoyé (permission Mail.Send en attente) :', mailErr.message);
    }

    followersSelected = [];
    allSelectedFiles  = [];
    alert(`✅ Demande ${ref} soumise avec succès.`);
    await loadRequests();
    goList();

  } catch(e) {
    console.error('Erreur soumission:', e);
    alert(`Erreur : ${e.message}`);
    btn.disabled = false;
    btn.textContent = 'Soumettre la demande';
  }
}

function formatDescription(text) {
  if (!text) return '';
  const lines = text.split('\n');
  let html = '';
  let inList = false;
  for (const line of lines) {
    const trimmed = line.trim();
    if (/^[•\-\*]\s*\S/.test(trimmed)) {
      if (!inList) { html += '<ul style="margin:8px 0;padding-left:20px">'; inList = true; }
      html += `<li>${trimmed.replace(/^[•\-\*]\s*/, '')}</li>`;
    } else {
      if (inList) { html += '</ul>'; inList = false; }
      html += (trimmed === '' ? '' : line) + '<br>';
    }
  }
  if (inList) html += '</ul>';
  return html.replace(/<br>$/, '');
}

              <div style="flex:1;display:flex;align-items:center;gap:6px">
                <label style="font-size:12px;color:var(--text-secondary);cursor:pointer;display:flex;align-items:center;gap:4px">
                  ${svgIcon('<path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/><polyline points="17 8 12 3 7 8"/><line x1="12" y1="3" x2="12" y2="15"/>')}
                  Joindre
                  <input type="file" id="comment-file-input" style="display:none" accept=".pdf,.doc,.docx,.xls,.xlsx,.ppt,.pptx,.png,.jpg,.jpeg,.eml,.msg" onchange="showCommentFile()">
                </label>
                <span id="comment-file-name" style="font-size:11.5px;color:#374151"></span>
              </div>
              ${isCPL ? `<label style="display:flex;align-items:center;gap:6px;font-size:12px;color:#B45309;cursor:pointer">
                <input type="checkbox" id="comment-interne" style="width:14px;height:14px">
                Note interne (Compliance uniquement)
              </label>` : ''}
              <button class="btn-primary" id="send-comment-btn" onclick="sendComment()">Envoyer</button>
            </div>
          </div>
        </div>
      </div>
      <div>
        <div class="form-card">
          <div style="font-size:11px;font-weight:700;color:var(--text-secondary);letter-spacing:.07em;text-transform:uppercase;margin-bottom:12px">Historique des statuts</div>
          <div class="timeline">${tlHTML}</div>
        </div>
        ${cplActions}
      </div>
    </div>`;

  showView('detail');
  window.scrollTo({top:0, behavior:'smooth'});
  loadFilesForDetail(selectedReq.ref);
  loadComments(selectedReq.ref);
}

// ═══════════════════════════════════════════════════════════
// COMMENTAIRES
// ═══════════════════════════════════════════════════════════
async function loadComments(ref) {
  const container = document.getElementById('comments-container');
  if (!container) return;
  if (!spCommListId) {
    container.innerHTML = '<p style="font-size:12px;color:var(--text-secondary)">Liste commentaires non configurée.</p>';
    return;
  }
  container.innerHTML = '<span style="font-size:12px;color:var(--text-secondary)">Chargement...</span>';
  try {
    const data = await graphGet(
      `/sites/${spSiteId}/lists/${spCommListId}/items?expand=fields,createdBy&$top=500`
    );
    const all = data.value
      .filter(item => item.fields.Title === ref)
      .map(item => {
        const f = item.fields;
        return {
          auteur  : f.NomAuteur || (item.createdBy?.user?.displayName) || '',
          texte   : (f.Texte || '').replace(/^\[INTERNE\]/, ''),
          interne : (f.Texte || '').startsWith('[INTERNE]'),
          date    : item.createdDateTime ? new Date(item.createdDateTime).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : '',
          _ts     : item.createdDateTime ? new Date(item.createdDateTime).getTime() : 0
        };
      })
      .filter(c => isCPL || !c.interne)
      .sort((a,b) => a._ts - b._ts);

    if (!all.length) {
      container.innerHTML = '<p style="font-size:12.5px;color:var(--text-secondary)">Aucun commentaire.</p>';
      return;
    }
    container.innerHTML = all.map(c => {
      // Transformer le lien markdown 📎 [nom](url) en bouton Ouvrir/Télécharger
      const texteRendu = c.texte.replace(
        /📎 \[([^\]]+)\]\(([^)]+)\)/g,
        (_, nom, url) => {
          const isEmailFile = /\.(msg|eml)$/i.test(nom);
          const href = isEmailFile ? url + '?download=1' : url;
          const linkAttrs = isEmailFile
            ? `href="${href}" download style="color:var(--navy);font-weight:600;text-decoration:none;margin-left:4px"`
            : `href="${href}" target="_blank" style="color:var(--navy);font-weight:600;text-decoration:none;margin-left:4px"`;
          const label = isEmailFile ? 'Télécharger →' : 'Ouvrir →';
          return `<span style="display:inline-flex;align-items:center;gap:6px;margin-top:4px;padding:4px 10px;background:#F4F5F8;border:1px solid var(--border);border-radius:6px;font-size:11.5px">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><polyline points="14 2 14 8 20 8"/></svg>
          <span style="color:#374151;font-weight:500">${nom}</span>
          <a ${linkAttrs}>${label}</a>
        </span>`;
        }
      );
      return `
      <div class="comment ${c.interne ? 'comment-internal' : 'comment-normal'}" style="margin-bottom:8px">
        <div style="display:flex;align-items:center;gap:6px;margin-bottom:4px;flex-wrap:wrap">
          ${c.interne ? '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="#B45309" stroke-width="2"><rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/></svg>' : ''}
          <span style="font-weight:600;color:${c.interne ? '#713F12' : '#111827'};font-size:12.5px">${c.auteur}</span>
          <span style="color:#9CA3AF;font-size:11px">${c.date}</span>
          ${c.interne ? '<span class="internal-lbl">Note interne</span>' : ''}
        </div>
        <div style="color:${c.interne ? '#713F12' : '#374151'};line-height:1.5;font-size:13px">${texteRendu}</div>
      </div>`;
    }).join('');
  } catch(e) {
    console.error('Erreur chargement commentaires:', e);
    container.innerHTML = '<p style="font-size:12px;color:#DC2626">Erreur de chargement des commentaires.</p>';
  }
}

function showCommentFile() {
  const input = document.getElementById('comment-file-input');
  const label = document.getElementById('comment-file-name');
  if (label) label.textContent = input?.files[0]?.name || '';
}

async function sendComment() {
  const texte   = document.getElementById('comment-input')?.value.trim();
  const interne = document.getElementById('comment-interne')?.checked || false;
  if (!texte) { alert('Veuillez saisir un commentaire.'); return; }
  if (!spCommListId) { alert('Liste commentaires non configurée.'); return; }

  const btn = document.getElementById('send-comment-btn');
  btn.disabled = true;
  btn.textContent = 'Envoi...';

  try {
    // Étape 1 : créer le commentaire sans EstInterne
    // Upload fichier joint au commentaire
    const commentFile = document.getElementById('comment-file-input')?.files[0];
    let fileLink = '';
    if (commentFile && spDriveId) {
      try {
        const uploaded = await uploadFile(selectedReq.ref, commentFile);
        fileLink = uploaded?.webUrl ? ` 📎 [${commentFile.name}](${uploaded.webUrl})` : ` 📎 ${commentFile.name}`;
      } catch(e) { console.warn('Upload fichier commentaire échoué:', e); }
    }

    const texteStored = interne ? '[INTERNE]' + texte + fileLink : texte + fileLink;
    const fields = {
      Title : selectedReq.ref,
      Texte : texteStored
    };
    const created = await graphPost(`/sites/${spSiteId}/lists/${spCommListId}/items`, { fields });

    // Note interne stockée via préfixe [INTERNE] dans le champ Texte

    // Notification email
    const followerEmails = (selectedReq.followers || '').split(',').map(e => e.trim()).filter(Boolean);
    if (!isCPL) {
      // Demandeur a commenté → notifier CPL
      try {
        await graphPost('/me/sendMail', {
          message: {
            subject: `[Tracker CPL] Nouveau commentaire sur ${selectedReq.ref} — ${selectedReq.objet}`,
            body: {
              contentType: 'HTML',
              content: `<div style="font-family:Arial,sans-serif;font-size:14px;color:#111;line-height:1.6">
                <p>Bonjour,</p>
                <p><strong>${currentUser.name}</strong> a ajouté un commentaire sur la demande <strong>${selectedReq.ref}</strong> — <em>${selectedReq.objet}</em> :</p>
                <blockquote style="border-left:3px solid #D18F41;margin:12px 0;padding:8px 16px;background:#FFF7ED;color:#374151">${texte}</blockquote>
                <p><a href="https://complianceportal.eiffel-ig.com/tracker-cpl.html" style="color:#00143B;font-weight:600">Accéder au Tracker CPL →</a></p>
                <hr style="border:none;border-top:1px solid #E5E7EB;margin:16px 0">
                <p style="color:#6B7280;font-size:12px">— Tracker CPL · Eiffel Investment Group</p>
              </div>`
            },
            toRecipients: [{ emailAddress: { address: CPL_MAIL } }],
            ...(followerEmails.length ? { ccRecipients: followerEmails.map(e => ({ emailAddress: { address: e } })) } : {})
          },
          saveToSentItems: true
        }, GRAPH_SCOPES_MAIL);
      } catch(mailErr) { console.warn('Notification CPL non envoyée:', mailErr.message); }
    } else if (!interne && selectedReq.email) {
      // CPL a commenté publiquement → notifier le demandeur
      try {
        await graphPost('/me/sendMail', {
          message: {
            subject: `[Tracker CPL] Nouveau message Compliance sur votre demande ${selectedReq.ref}`,
            body: {
              contentType: 'HTML',
              content: `<div style="font-family:Arial,sans-serif;font-size:14px;color:#111;line-height:1.6">
                <p>Bonjour ${selectedReq.from},</p>
                <p>L'équipe Compliance a répondu à votre demande <strong>${selectedReq.ref}</strong> — <em>${selectedReq.objet}</em> :</p>
                <blockquote style="border-left:3px solid #00143B;margin:12px 0;padding:8px 16px;background:#F4F5F8;color:#374151">${texte}</blockquote>
                <p><a href="https://complianceportal.eiffel-ig.com/tracker-cpl.html" style="color:#00143B;font-weight:600">Consulter ma demande →</a></p>
                <hr style="border:none;border-top:1px solid #E5E7EB;margin:16px 0">
                <p style="color:#6B7280;font-size:12px">— Tracker CPL · Eiffel Investment Group</p>
              </div>`
            },
            toRecipients: [{ emailAddress: { address: selectedReq.email } }],
            ...(followerEmails.length ? { ccRecipients: followerEmails.map(e => ({ emailAddress: { address: e } })) } : {})
          },
          saveToSentItems: true
        }, GRAPH_SCOPES_MAIL);
      } catch(mailErr) { console.warn('Notification demandeur non envoyée:', mailErr.message); }
    }

    document.getElementById('comment-input').value = '';
    const cb = document.getElementById('comment-interne');
    if (cb) cb.checked = false;
    const fi = document.getElementById('comment-file-input');
    if (fi) fi.value = '';
    const fn = document.getElementById('comment-file-name');
    if (fn) fn.textContent = '';
    await loadComments(selectedReq.ref);
    // Recharger les pièces jointes si un fichier a été joint
    if (commentFile) await loadFilesForDetail(selectedReq.ref);
  } catch(e) {
    console.error('Erreur envoi commentaire:', e);
    alert(`Erreur : ${e.message}`);
  } finally {
    btn.disabled = false;
    btn.textContent = 'Envoyer';
  }
}

// ═══════════════════════════════════════════════════════════
// CHANGEMENT DE STATUT (CPL)
// ═══════════════════════════════════════════════════════════

// Mapping valeurs select → texte exact SharePoint
const STATUS_MAP = {
  "En cours d_analyse"       : "En cours d'analyse",
  "En attente d_informations": "En attente d'informations",
  "Traité"                    : "Traité",
  "Rejeté"                   : "Rejeté",
  "Clôturé"                  : "Clôturé"
};

function toggleMotifField() {
  const sel   = document.getElementById('cpl-status-select');
  const motif = document.getElementById('motif-field');
  if (motif) motif.style.display = sel?.value === 'Rejeté' ? 'block' : 'none';
}

async function changeStatus() {
  const rawVal    = document.getElementById('cpl-status-select')?.value;
  const newStatus = STATUS_MAP[rawVal] || rawVal;
  const motif     = document.getElementById('cpl-motif')?.value.trim();

  if (!newStatus) { alert('Veuillez sélectionner un statut.'); return; }
  if (newStatus === 'Rejeté' && !motif) { alert('Le motif de rejet est obligatoire.'); return; }

  const btn = document.getElementById('cpl-apply-btn');
  btn.disabled = true;
  btn.textContent = 'Enregistrement...';

  try {
    const history = [...(selectedReq.historique || []), { date: new Date().toISOString(), statut: newStatus, par: currentUser.name }];
    const fields = { Statut: newStatus, ResponsableCPL: currentUser.name, HistoriqueStatuts: JSON.stringify(history) };
    if (newStatus === 'Rejeté' && motif) fields.MotifRejet = motif;

    await graphPatch(
      `/sites/${spSiteId}/lists/${spListId}/items/${selectedReq.spId}/fields`,
      fields
    );

    // Notification email au demandeur
    const subjects = {
      "En cours d'analyse"        : `[Tracker CPL] Votre demande ${selectedReq.ref} est en cours de traitement`,
      "En attente d'informations" : `[Tracker CPL] Action requise : complément d'information — ${selectedReq.ref}`,
      "Traité"                    : `[Tracker CPL] Votre demande ${selectedReq.ref} a été résolue`,
      "Rejeté"                    : `[Tracker CPL] Votre demande ${selectedReq.ref} a été rejetée`,
      "Clôturé"                   : null   // pas de notification pour clôture
    };

    const subject = subjects[newStatus];
    if (subject && selectedReq.email) {
      const bodyContent = {
        "En cours d'analyse": `
          <p>Bonjour ${selectedReq.from},</p>
          <p>Votre demande <strong>${selectedReq.ref}</strong> — <em>${selectedReq.objet}</em> — a été prise en charge par l'équipe Compliance et est actuellement en cours de traitement.</p>
          <p>Vous serez notifié(e) dès qu'une réponse sera disponible.</p>`,
        "En attente d'informations": `
          <p>Bonjour ${selectedReq.from},</p>
          <p>⚠️ L'équipe Compliance a besoin d'un complément d'information pour traiter votre demande <strong>${selectedReq.ref}</strong> — <em>${selectedReq.objet}</em>.</p>
          <p>Merci de revenir sur le <a href="https://complianceportal.eiffel-ig.com/tracker-cpl.html">Tracker CPL</a> pour apporter les informations complémentaires.</p>`,
        "Traité": `
          <p>Bonjour ${selectedReq.from},</p>
          <p>✅ Votre demande <strong>${selectedReq.ref}</strong> — <em>${selectedReq.objet}</em> — a été résolue par l'équipe Compliance.</p>
          <p>Connectez-vous au <a href="https://complianceportal.eiffel-ig.com/tracker-cpl.html">Tracker CPL</a> pour consulter la réponse.</p>`,
        "Rejeté": `
          <p>Bonjour ${selectedReq.from},</p>
          <p>Votre demande <strong>${selectedReq.ref}</strong> — <em>${selectedReq.objet}</em> — a été rejetée par l'équipe Compliance.</p>
          ${motif ? `<p><strong>Motif :</strong> ${motif}</p>` : ''}
          <p>Vous pouvez soumettre une nouvelle demande en tenant compte de ce retour.</p>`
      };

      const body = bodyContent[newStatus] || '';

      try {
        const followerEmails = (selectedReq.followers || '').split(',').map(e => e.trim()).filter(Boolean);
        await graphPost('/me/sendMail', {
          message: {
            subject,
            body: {
              contentType: 'HTML',
              content: `<div style="font-family:Arial,sans-serif;font-size:14px;color:#111;line-height:1.6">
                ${body}
                <br><hr style="border:none;border-top:1px solid #E5E7EB;margin:16px 0">
                <p style="color:#6B7280;font-size:12px">— Tracker CPL · Eiffel Investment Group</p>
              </div>`
            },
            toRecipients: [{ emailAddress: { address: selectedReq.email } }],
            ...(followerEmails.length ? { ccRecipients: followerEmails.map(e => ({ emailAddress: { address: e } })) } : {})
          },
          saveToSentItems: true
        }, GRAPH_SCOPES_MAIL);
        console.log(`Mail envoyé à ${selectedReq.email}`);
      } catch(mailErr) {
        console.warn('Notification non envoyée :', mailErr.message);
      }
    }

    alert(`✅ Statut mis à jour : ${newStatus}`);
    await loadRequests();
    openDetail(selectedReq.ref);

  } catch(e) {
    console.error('Erreur changement statut:', e);
    alert(`Erreur : ${e.message}`);
    btn.disabled = false;
    btn.textContent = 'Appliquer';
  }
}

async function reopenRequest() {
  if (!confirm('Rouvrir cette demande ?')) return;
  try {
    const history = [...(selectedReq.historique || []), { date: new Date().toISOString(), statut: 'À traiter', par: currentUser.name }];
    await graphPatch(
      `/sites/${spSiteId}/lists/${spListId}/items/${selectedReq.spId}/fields`,
      { Statut: 'À traiter', HistoriqueStatuts: JSON.stringify(history) }
    );
    alert('✅ Demande rouverte — statut repassé à Soumis.');
    await loadRequests();
    openDetail(selectedReq.ref);
  } catch(e) {
    alert(`Erreur : ${e.message}`);
  }
}

async function assignRequest() {
  const name = document.getElementById('cpl-assign-select')?.value;
  if (!name) { alert('Veuillez sélectionner un membre CPL.'); return; }
  try {
    await graphPatch(
      `/sites/${spSiteId}/lists/${spListId}/items/${selectedReq.spId}/fields`,
      { ResponsableCPL: name }
    );

    try {
      const email = CPL_TEAM.find(m => m.name === name)?.email;
      if (email) {
        const mailBody = `
          <div style="font-family:Arial,sans-serif;font-size:14px;color:#111;line-height:1.6">
            <p>Bonjour ${name},</p>
            <p>La demande <strong>${selectedReq.ref}</strong> — <em>${selectedReq.objet}</em> vous a été attribuée.</p>
            <table style="border-collapse:collapse;width:100%;margin:16px 0;border:1px solid #E5E7EB">
              <tr style="background:#F4F5F8"><td style="padding:8px 12px;font-weight:600;width:160px">Demandeur</td><td style="padding:8px 12px">${selectedReq.from} — ${selectedReq.dept}</td></tr>
              <tr><td style="padding:8px 12px;font-weight:600">Priorité</td><td style="padding:8px 12px">${selectedReq.prio}</td></tr>
              <tr style="background:#F4F5F8"><td style="padding:8px 12px;font-weight:600">Statut</td><td style="padding:8px 12px">${selectedReq.statut}</td></tr>
            </table>
            <p><a href="https://complianceportal.eiffel-ig.com/tracker-cpl.html">Ouvrir dans le Tracker CPL</a></p>
            <br><hr style="border:none;border-top:1px solid #E5E7EB;margin:16px 0">
            <p style="color:#6B7280;font-size:12px">— Tracker CPL · Eiffel Investment Group</p>
          </div>`;
        await graphPost('/me/sendMail', {
          message: {
            subject: `[Tracker CPL] Demande ${selectedReq.ref} vous a été attribuée`,
            body: { contentType: 'HTML', content: mailBody },
            toRecipients: [{ emailAddress: { address: email } }]
          },
          saveToSentItems: true
        }, GRAPH_SCOPES_MAIL);
      }
    } catch(mailErr) {
      console.warn('Notification attribution non envoyée :', mailErr.message);
    }

    alert(`✅ Demande attribuée à ${name}.`);
    await loadRequests();
    openDetail(selectedReq.ref);
  } catch(e) {
    alert(`Erreur : ${e.message}`);
  }
}
