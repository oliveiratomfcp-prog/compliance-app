// ═══════════════════════════════════════════════════════════
// HELPERS
// ═══════════════════════════════════════════════════════════
function bdg(label, cls) { return `<span class="bdg ${cls}">${label}</span>`; }
function svgIcon(path, extras) {
  return `<svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" ${extras||''}>${path}</svg>`;
}
function formatDate(d) {
  if (!d) return '—';
  try { return new Date(d).toLocaleDateString('fr-FR'); } catch { return '—'; }
}
function esc(s) {
  return String(s ?? '').replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// Statuts calculés, jamais stockés, toujours recalculés à l'affichage.
function hasPendingProposal(b) {
  return !!(b.dateExpirationPending || b.kycPending || (b.piecesDossierPending || []).length || b.niveauRisquePending);
}

// Contrepartie créée mais jamais validée par la compliance. Nouveau circuit : la
// proposition est en *_Pending et le dossier officiel est vide. Ancien circuit : la
// création était écrite directement dans le dossier officiel, sans validation ni
// dernier KYC enregistrés.
function estJamaisValidee(b) {
  if (!STATUTS_DEMANDE_OUVERTE.includes(b.statutValidationKYC)) return false;
  const officielVide = !b.kycLink && !b._expTs && !(b.piecesDossier || []).length;
  return officielVide || (!b.dernierKYCPar && !b.dateValidation && !hasPendingProposal(b));
}

// Actions de l'historique qui valent validation du dossier officiel par la compliance
const ACTIONS_VALIDATION = ['Création validée', 'Mise à jour du KYC validée', 'Dossier existant validé', 'Statut changé manuellement : Validé'];

// Vrai si le dossier OFFICIEL a été validé par la compliance : statut "Validé", ou une
// validation tracée dans l'historique (le statut peut ensuite changer avec une nouvelle
// demande sans que le dossier officiel perde sa validation). Les contreparties entrées
// avant le circuit de validation, ou directement dans SharePoint, ne le sont pas.
function dossierOfficielValide(b) {
  if (estJamaisValidee(b)) return false;
  if (b.statutValidationKYC === 'Validé') return true;
  return (b.historique || []).some(h => ACTIONS_VALIDATION.includes(h.action));
}

// Échéance du dossier OFFICIEL, uniquement à partir de la date d'expiration. Sert aux
// relances et au clignotement, qu'il soit validé ou non : un KYC expiré doit être
// renouvelé dans tous les cas. Sans date d'expiration : "expiré".
function computeEcheance(broker, today) {
  today = today || new Date();
  if (!broker._expTs) return 'expiré';
  const days = Math.ceil((broker._expTs - today.getTime()) / (1000*60*60*24));
  if (days < 0) return 'expiré';
  if (days <= SEUIL_BIENTOT_JOURS) return 'bientôt expiré';
  return 'à jour';
}

// Validité affichée : "à jour", "bientôt expiré" ou "expiré" seulement pour un dossier
// officiel validé par la compliance ; sinon "non validé", quelle que soit la date.
function computeValidite(broker, today) {
  return dossierOfficielValide(broker) ? computeEcheance(broker, today) : 'non validé';
}

// Échéance à signaler à côté d'un dossier non validé (créations jamais validées exclues :
// leur dossier officiel est vide)
function echeanceSecondaire(b) {
  if (dossierOfficielValide(b) || estJamaisValidee(b)) return '';
  const e = computeEcheance(b);
  return e === 'à jour' ? '' : bdg(e, STATUS_CLASS[e]);
}

// État de la dernière demande (création ou mise à jour du KYC)
function computeDemande(broker) {
  switch (broker.statutValidationKYC) {
    case 'En attente de validation': return 'en attente';
    case STATUT_COMPLEMENT: return 'complément demandé';
    case 'Rejeté': return 'rejetée';
    default: return 'aucune';
  }
}
function daysToExpiration(broker, today) {
  today = today || new Date();
  if (!broker._expTs) return null;
  return Math.ceil((broker._expTs - today.getTime()) / (1000*60*60*24));
}
const STATUS_CLASS = { 'à jour':'bdg-a-jour', 'bientôt expiré':'bdg-bientot', 'expiré':'bdg-expire', 'non validé':'bdg-attente-validation' };
const DEMANDE_CLASS = { 'en attente':'bdg-attente-validation', 'complément demandé':'bdg-complement', 'rejetée':'bdg-rejete' };
const DEMANDE_LABEL = { 'en attente':'Demande en attente', 'complément demandé':'Complément demandé', 'rejetée':'Demande rejetée' };
function demandeBadge(b) {
  const d = computeDemande(b);
  return d === 'aucune' ? '' : bdg(DEMANDE_LABEL[d], DEMANDE_CLASS[d]);
}
const RISQUE_CLASS = { 'Faible':'bdg-risque-faible', 'Moyen':'bdg-risque-moyen', 'Élevé':'bdg-risque-eleve' };

// Nombre de pièces du référentiel présentes dans le dossier de la contrepartie,
// parmi celles attendues pour SON niveau de risque (13 ou 14 selon le cas, jamais
// un total fixe). Seuls les libellés exacts du référentiel comptent : une valeur
// inconnue dans SharePoint n'augmente pas le compteur.
// Dossier à afficher : la proposition pour une contrepartie jamais validée (le dossier
// officiel est vide), sinon le dossier officiel.
function dossierAffiche(b) {
  if (estJamaisValidee(b) && hasPendingProposal(b)) {
    return { proposition: true, niveauRisque: b.niveauRisquePending || b.niveauRisque, piecesDossier: b.piecesDossierPending,
             dateExpiration: b.dateExpirationPending, kycLink: b.kycPending };
  }
  return { proposition: false, niveauRisque: b.niveauRisque, piecesDossier: b.piecesDossier, dateExpiration: b.dateExpiration, kycLink: b.kycLink };
}

function countPiecesDossier(broker) {
  const set = new Set(broker.piecesDossier || []);
  return getPiecesRequisesPourRisque(broker.niveauRisque).filter(p => set.has(p)).length;
}

// Le nom d'une contrepartie clignote (tableau ET fiche détail) dès que l'une de
// ces deux conditions est vraie : KYC expiré OU dernière mise à jour rejetée par
// compliance. Le nombre de pièces cochées n'a plus aucune influence ici — il reste
// affiché à titre informatif via dossierBadge(), sans effet sur le clignotement.
function needsBlinking(broker) {
  return !broker.archive && ((!estJamaisValidee(broker) && computeEcheance(broker) === 'expiré') || broker.statutValidationKYC === 'Rejeté');
}

// Le badge dossier (ex. "10/13") reste purement informatif : nombre de pièces
// cochées sur le total attendu pour le niveau de risque de la contrepartie.
function dossierBadge(broker) {
  const d = dossierAffiche(broker);
  const n = countPiecesDossier(d);
  const total = getPiecesRequisesPourRisque(d.niveauRisque).length;
  const cls = n === total ? 'bdg-a-jour' : n >= 6 ? 'bdg-bientot' : 'bdg-expire';
  return bdg(`${n}/${total}`, cls);
}

function classesActifLabel(b) {
  const list = b.classesActif.map(c => c === 'Autres' && b.classeActifAutre ? `Autres (${b.classeActifAutre})` : c);
  return list.length ? list.join(', ') : '—';
}

// ═══════════════════════════════════════════════════════════
// HISTORIQUE (journal en ajout seul, colonne HistoriqueKYC)
// ═══════════════════════════════════════════════════════════
// Chaque action (création, demande, décision, statut manuel, commentaire, archivage)
// ajoute une entrée { date, action, par, email, detail }. Les entrées précédentes ne
// sont jamais modifiées. `fresh` est la contrepartie relue juste avant l'écriture.
function addHistorique(fields, fresh, action, detail) {
  if (!hasColumn('HistoriqueKYC')) return;
  const histo = [...(fresh.historique || [])];
  // Dossier validé avant la mise en place de l'historique : la validation est d'abord
  // reportée dans l'historique, sinon elle serait perdue dès que le statut change.
  if (fresh.statutValidationKYC === 'Validé' && !histo.some(h => ACTIONS_VALIDATION.includes(h.action))) {
    histo.push({ date: fresh.dateValidation || new Date().toISOString(), action: 'Dossier existant validé',
                 par: fresh.valideParEmail || '', email: fresh.valideParEmail || '', detail: "Validation antérieure à l'historique" });
  }
  const entry = { date: new Date().toISOString(), action, par: currentUser.name, email: currentUser.email };
  if (detail) entry.detail = String(detail).slice(0, 1500);
  histo.push(entry);
  fields.HistoriqueKYC = JSON.stringify(histo);
}

function resumeDossier(risque, lien, dateExp, pieces) {
  const parts = [];
  if (risque) parts.push(`risque ${risque}`);
  if (dateExp) parts.push(`expiration ${formatDate(dateExp)}`);
  parts.push(`${(pieces || []).length} pièce(s)`);
  if (lien) parts.push(`lien ${lien}`);
  return parts.join(', ');
}

// ═══════════════════════════════════════════════════════════
// NOTIFICATIONS EMAIL (non bloquantes)
// ═══════════════════════════════════════════════════════════
function ficheLink(b) { return `${window.location.origin}/counterflow.html#${b.spId}`; }

async function envoyerNotification(to, subject, paragraphs, b) {
  if (!to) return;
  const html = `<div style="font-family:Arial,sans-serif;font-size:14px;color:#111;line-height:1.6">
    <p>Bonjour,</p>
    ${paragraphs.map(p => `<p>${p}</p>`).join('')}
    <p><a href="${ficheLink(b)}" style="color:#00143B;font-weight:600">Ouvrir la fiche dans CounterFlow →</a></p>
    <p style="color:#6B7280;font-size:12px">CounterFlow · Eiffel Investment Group</p>
  </div>`;
  try {
    await graphPost('/me/sendMail', {
      message: { subject, body: { contentType: 'HTML', content: html }, toRecipients: [{ emailAddress: { address: to } }] },
      saveToSentItems: true
    }, GRAPH_SCOPES_MAIL);
  } catch (e) { console.warn('Notification non envoyée :', e.message); }
}

// Demandeur à prévenir d'une décision (jamais l'auteur de la décision lui-même)
function demandeurANotifier(b) {
  const e = (b.demandeParEmail || '').toLowerCase();
  return e && e !== (currentUser.email || '').toLowerCase() ? b.demandeParEmail : '';
}

function estAuteurDeLaDemande(b) {
  return !!b.demandeParEmail && b.demandeParEmail.toLowerCase() === (currentUser.email || '').toLowerCase();
}

// ═══════════════════════════════════════════════════════════
// VUE LISTE
// ═══════════════════════════════════════════════════════════
// Filtre "Validité KYC" : "Expiré" et "Bientôt expiré" portent sur l'échéance du
// dossier officiel, validé ou non (comme les relances) ; "À jour" exige un dossier
// validé ; "Non validé" regroupe les dossiers jamais validés par la compliance.
function matchValidite(b, f) {
  if (f === 'non validé') return !dossierOfficielValide(b);
  if (f === 'à jour') return computeValidite(b) === 'à jour';
  return !estJamaisValidee(b) && computeEcheance(b) === f;
}

function renderListe() {
  const visibles = brokers.filter(b => showArchived || !b.archive);
  const filtered = visibles.filter(b => {
    if (statusFilter !== 'all' && !matchValidite(b, statusFilter)) return false;
    if (demandeFilter !== 'all' && computeDemande(b) !== demandeFilter) return false;
    if (equipeFilter !== 'all' && !b.equipes.includes(equipeFilter)) return false;
    if (risqueFilter !== 'all' && dossierAffiche(b).niveauRisque !== risqueFilter) return false;
    return true;
  });

  const pill = (label, value, current, setter, count) => {
    const active = current === value;
    const st = active ? 'style="background:var(--navy);color:#fff;border-color:var(--navy)"' : '';
    return `<button class="filter-pill" ${st} onclick="${setter}('${value.replace(/'/g,"\\'")}')">${label}${count!=null?` <span style="opacity:.6">(${count})</span>`:''}</button>`;
  };

  const nbValidite = s => visibles.filter(b => matchValidite(b, s)).length;
  const nbDemande  = s => visibles.filter(b => computeDemande(b) === s).length;
  const validitePills = [
    pill('Tous','all',statusFilter,'setStatusFilter',visibles.length),
    pill('À jour','à jour',statusFilter,'setStatusFilter',nbValidite('à jour')),
    pill('Bientôt expiré','bientôt expiré',statusFilter,'setStatusFilter',nbValidite('bientôt expiré')),
    pill('Expiré','expiré',statusFilter,'setStatusFilter',nbValidite('expiré')),
    pill('Non validé','non validé',statusFilter,'setStatusFilter',nbValidite('non validé'))
  ].join('');
  const demandePills = [
    pill('Toutes','all',demandeFilter,'setDemandeFilter'),
    pill('En attente','en attente',demandeFilter,'setDemandeFilter',nbDemande('en attente')),
    pill('Complément demandé','complément demandé',demandeFilter,'setDemandeFilter',nbDemande('complément demandé')),
    pill('Rejetée','rejetée',demandeFilter,'setDemandeFilter',nbDemande('rejetée'))
  ].join('');
  const equipePills = [pill('Tous','all',equipeFilter,'setEquipeFilter')]
    .concat(EQUIPES.map(e => pill(e, e, equipeFilter, 'setEquipeFilter'))).join('');
  const risquePills = [pill('Tous','all',risqueFilter,'setRisqueFilter')]
    .concat(NIVEAUX_RISQUE.map(r => pill(r, r, risqueFilter, 'setRisqueFilter'))).join('');
  const nbArchivees = brokers.filter(b => b.archive).length;
  const archivePill = nbArchivees ? `<button class="filter-pill" onclick="toggleShowArchived()" ${showArchived ? 'style="background:var(--navy);color:#fff;border-color:var(--navy)"' : ''}>Afficher les archivées <span style="opacity:.6">(${nbArchivees})</span></button>` : '';

  const rows = filtered.map(b => {
    const st = computeValidite(b);
    const d = dossierAffiche(b);
    const nameCls = needsBlinking(b) ? 'name-blink-expired' : '';
    return `<tr onclick="openDetail('${b.spId}')" class="${b.archive ? 'cf-archived' : ''}">
      <td><span class="${nameCls}" style="font-size:13px;${nameCls?'':'font-weight:600;color:#111827'}">${esc(b.nom)}</span>${b.archive ? ' ' + bdg('Archivée','bdg-archive') : ''}</td>
      <td>${b.equipes.length ? b.equipes.map(e => bdg(e,'bdg-equipe')).join(' ') : '<span class="td-muted">—</span>'}</td>
      <td>${d.niveauRisque ? bdg(d.niveauRisque, RISQUE_CLASS[d.niveauRisque]||'bdg-risque-moyen') : '<span class="td-muted">—</span>'}</td>
      <td class="td-muted">${esc(classesActifLabel(b))}</td>
      <td class="td-muted">${formatDate(d.dateExpiration)}${d.proposition && d.dateExpiration ? ' <span style="opacity:.7">(proposée)</span>' : ''}</td>
      <td>${dossierBadge(b)}</td>
      <td>${bdg(st, STATUS_CLASS[st])} ${echeanceSecondaire(b)}</td>
      <td>${demandeBadge(b) || '<span class="td-muted">—</span>'}</td>
    </tr>`;
  }).join('') || `<tr><td colspan="8" style="padding:24px;text-align:center;color:var(--text-secondary)">Aucune contrepartie dans cette catégorie</td></tr>`;

  const lienSigne = counterflowConfig?.lienListeSignee || '';
  const signedBtnLabel = `${svgIcon('<rect x="3" y="11" width="18" height="11" rx="2"/><path d="M7 11V7a5 5 0 0 1 10 0v4"/>')}
        Contreparties autorisées (document signé)`;
  const signedBtn = lienSigne
    ? renderLienCliquable(lienSigne, signedBtnLabel, '', 'class="btn-secondary" id="btn-liste-signee" style="text-decoration:none"')
    : `<button class="btn-secondary" id="btn-liste-signee" disabled style="opacity:.5;cursor:not-allowed" title="Lien non configuré">
        ${signedBtnLabel}
      </button>`;
  const editSignedBtn = isCPL ? `
    <button class="btn-secondary" onclick="openEditLienSigne()" title="Modifier le lien du document signé" style="padding:10px 12px">
      ${svgIcon('<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>')}
    </button>` : '';

  const relanceBtn = isCPL ? `
    <button class="btn-secondary" onclick="goRelances()">
      ${svgIcon('<path d="M4 4h16c1.1 0 2 .9 2 2v12c0 1.1-.9 2-2 2H4c-1.1 0-2-.9-2-2V6c0-1.1.9-2 2-2z"/><polyline points="22,6 12,13 2,6"/>')}
      Envoyer les relances KYC
    </button>` : '';

  const nbExpirees = visibles.filter(b => !estJamaisValidee(b) && computeEcheance(b) === 'expiré').length;
  const nbNonValides = visibles.filter(b => !dossierOfficielValide(b)).length;
  const nbAValider = nbDemande('en attente');
  const aValider = isCPL && nbAValider
    ? `&nbsp;·&nbsp; <a href="#" onclick="event.preventDefault();setDemandeFilter('en attente')" style="color:#475569;font-weight:600">${nbAValider} demande${nbAValider>1?'s':''} à valider</a>`
    : '';

  document.getElementById('view-liste').innerHTML = `
    <div class="section-header">
      <div>
        <div class="eyebrow" style="margin-bottom:9px">Contreparties autorisées · KYC</div>
        <h1 class="page-title" style="margin:0 0 7px">CounterFlow</h1>
        <p class="section-desc">${visibles.length} contrepartie${visibles.length>1?'s':''} suivie${visibles.length>1?'s':''}
          &nbsp;·&nbsp; ${nbExpirees} expirée${nbExpirees>1?'s':''}
          ${nbNonValides ? `&nbsp;·&nbsp; <a href="#" onclick="event.preventDefault();setStatusFilter('non validé')" style="color:#475569;font-weight:600">${nbNonValides} non validée${nbNonValides>1?'s':''}</a>` : ''} ${aValider}
          &nbsp;·&nbsp;
          <button class="list-refresh" id="list-refresh-btn" onclick="manualRefresh()" title="Rafraîchir depuis SharePoint">
            ${svgIcon('<polyline points="23 4 23 10 17 10"/><polyline points="1 20 1 14 7 14"/><path d="M3.51 9a9 9 0 0 1 14.85-3.36L23 10"/><path d="M20.49 15a9 9 0 0 1-14.85 3.36L1 14"/>')}
            Actualisé à ${lastLoadedAt ? lastLoadedAt.toLocaleTimeString('fr-FR',{hour:'2-digit',minute:'2-digit'}) : '—'}
          </button>
        </p>
      </div>
      <div style="display:flex;gap:8px;align-items:center;flex-wrap:wrap">
        ${relanceBtn}
        ${signedBtn}${editSignedBtn}
        <button class="btn-primary" onclick="goNouvelle()">
          ${svgIcon('<line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/>')}
          Nouvelle contrepartie
        </button>
      </div>
    </div>
    <div class="cpl-filters">
      <span class="filter-group-label">Validité KYC</span>${validitePills}
      <span class="filter-group-label" style="margin-left:10px">Demande</span>${demandePills}
    </div>
    <div class="cpl-filters">
      <span class="filter-group-label">Équipe</span>${equipePills}
      <span class="filter-group-label" style="margin-left:10px">Risque</span>${risquePills}
      ${archivePill}
      <input type="text" placeholder="Rechercher..." oninput="searchTable(this.value)"
        style="margin-left:auto;padding:4px 10px;border-radius:6px;border:1px solid var(--border);font-size:12px;font-family:inherit;width:170px">
    </div>
    <div class="table-wrapper">
      <table class="data-table cf-table">
        <thead><tr>
          <th style="width:220px">Nom</th>
          <th style="width:150px">Équipe(s)</th>
          <th style="width:100px">Risque</th>
          <th style="min-width:140px">Classe(s) d'actif</th>
          <th style="width:120px">Expiration KYC</th>
          <th style="width:75px">Dossier</th>
          <th style="width:115px">Validité KYC</th>
          <th style="width:160px">Demande</th>
        </tr></thead>
        <tbody id="cf-tbody">${rows}</tbody>
      </table>
    </div>`;
}

function searchTable(q) {
  document.querySelectorAll('#cf-tbody tr').forEach(r => {
    r.style.display = r.textContent.toLowerCase().includes(q.toLowerCase()) ? '' : 'none';
  });
}

// ═══════════════════════════════════════════════════════════
// FICHE DÉTAIL
// ═══════════════════════════════════════════════════════════
function openDetail(spId) {
  selectedBroker = brokers.find(b => b.spId === spId);
  if (!selectedBroker) return;
  const b = selectedBroker;
  const st = computeValidite(b);
  const demande = computeDemande(b);
  const nameCls = needsBlinking(b) ? 'name-blink-expired' : '';
  const jamaisValidee = estJamaisValidee(b);
  const affiche = dossierAffiche(b);

  // Raisons du clignotement, affichées sous le nom
  const days = daysToExpiration(b);
  const echeance = computeEcheance(b);
  const officielValide = dossierOfficielValide(b);
  const blinkReasons = [];
  if (!jamaisValidee && echeance === 'expiré') {
    blinkReasons.push(days === null ? "Aucune date d'expiration renseignée" : `KYC expiré depuis ${Math.abs(days)} jour(s)`);
  }
  if (demande === 'rejetée') {
    blinkReasons.push(`Dernière demande rejetée par la compliance${b.motifRejet ? ' : ' + b.motifRejet : ''}`);
  }
  const blinkReasonsHtml = blinkReasons.length && !b.archive
    ? `<div style="margin-top:4px;font-size:12px;font-weight:600;color:#DC2626">${blinkReasons.map(esc).join(' · ')}</div>`
    : '';
  const piecesRequises = getPiecesRequisesPourRisque(affiche.niveauRisque);
  const nbPieces = countPiecesDossier(affiche);

  const piecesChecklist = piecesRequises.map(p => {
    const ok = (affiche.piecesDossier || []).includes(p);
    return `<div style="display:flex;align-items:flex-start;gap:8px;padding:5px 0;font-size:12.5px;border-bottom:1px solid var(--row-sep)">
      <span style="flex-shrink:0;font-size:14px;line-height:1.3;${ok?'color:#15803D':'color:#9CA3AF'}">${ok?'☑':'☐'}</span>
      <span style="${ok?'color:#374151':'color:var(--text-muted)'}">${esc(p)}</span>
    </div>`;
  }).join('');

  // Bloc "Validation compliance" (compliance uniquement, demande en attente)
  const hasPending = hasPendingProposal(b);
  const dossierPanel = (titre, titreColor, risque, dateExpVal, kycVal, piecesVal) => `
    <div>
      <div style="font-size:11px;font-weight:700;color:${titreColor};text-transform:uppercase;margin-bottom:6px">${titre}</div>
      <div style="font-size:12.5px;color:#374151;margin-bottom:6px"><strong style="color:var(--navy)">Niveau de risque :</strong> ${esc(risque || '—')}</div>
      <div style="font-size:12.5px;color:#374151;margin-bottom:6px"><strong style="color:var(--navy)">Expiration :</strong> ${formatDate(dateExpVal)}</div>
      <div style="font-size:12.5px;color:#374151;margin-bottom:6px"><strong style="color:var(--navy)">Dossier KYC :</strong> ${renderLienCliquable(kycVal, 'Ouvrir →', 'Aucun lien')}</div>
      <div style="font-size:12.5px;color:#374151;margin-bottom:4px"><strong style="color:var(--navy)">Pièces (${(piecesVal||[]).length}/${getPiecesRequisesPourRisque(risque).length}) :</strong></div>
      <ul style="margin:0 0 0 18px;padding:0;font-size:12px;color:var(--text-secondary)">
        ${(piecesVal||[]).map(p => `<li>${esc(p)}</li>`).join('') || '<li>Aucune</li>'}
      </ul>
    </div>`;
  const proposePanel = hasPending
    ? dossierPanel(jamaisValidee ? 'Dossier proposé (nouvelle contrepartie)' : 'Nouveau dossier proposé', '#2563EB',
        b.niveauRisquePending || b.niveauRisque, b.dateExpirationPending, b.kycPending, b.piecesDossierPending)
    : dossierPanel('Dossier proposé (nouvelle contrepartie)', '#2563EB', b.niveauRisque, b.dateExpiration, b.kycLink, b.piecesDossier);
  const auteur = estAuteurDeLaDemande(b);
  const validationBlockHtml = (isCPL && demande === 'en attente') ? `
    <div class="form-card validation-card" style="margin-bottom:14px">
      <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:4px">
        <div style="font-size:11px;font-weight:700;color:var(--text-secondary);letter-spacing:.07em;text-transform:uppercase">Validation compliance</div>
        ${bdg('Demande en attente','bdg-attente-validation')}
      </div>
      <p style="font-size:12px;color:var(--text-secondary);margin-bottom:14px">
        ${jamaisValidee ? 'Nouvelle contrepartie proposée' : 'Mise à jour du KYC demandée'} par ${esc(b.demandeParEmail || '—')} le ${formatDate(b.dateDemande)}.
      </p>
      ${jamaisValidee
        ? `<div class="validation-compare" style="grid-template-columns:1fr">${proposePanel}</div>`
        : `<div class="validation-compare">
             ${dossierPanel('Dossier actuel (validé)', 'var(--text-muted)', b.niveauRisque, b.dateExpiration, b.kycLink, b.piecesDossier)}
             ${proposePanel}
           </div>`}
      ${auteur ? `<p style="font-size:12px;color:#92400E;background:#FFFBEB;border:1px solid #FDE68A;border-radius:6px;padding:8px 12px;margin-top:14px">
          Vous êtes l'auteur de cette demande : elle doit être validée par un autre membre de la compliance. Vous pouvez la renvoyer ou la rejeter.</p>` : ''}
      <div style="display:flex;gap:8px;margin-top:16px;flex-wrap:wrap">
        <button class="btn-primary" style="flex:1;justify-content:center;background:#15803D;border-color:#15803D${auteur ? ';opacity:.45;cursor:not-allowed' : ''}" ${auteur ? 'disabled' : ''} onclick="validerKYCPending()">
          ${svgIcon('<polyline points="20 6 9 17 4 12"/>')}Valider
        </button>
        <button class="btn-secondary" style="flex:1;justify-content:center;color:#A16207;border-color:#FDE68A" onclick="openDecisionModal('complement')">
          ${svgIcon('<path d="M21 15a2 2 0 0 1-2 2H7l-4 4V5a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2z"/>')}Demander un complément
        </button>
        <button class="btn-secondary" style="flex:1;justify-content:center;color:#DC2626;border-color:#FECACA" onclick="openDecisionModal('rejet')">
          ${svgIcon('<line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/>')}Rejeter
        </button>
      </div>
    </div>` : '';

  // Retour de la compliance (visible de tous) : complément demandé ou rejet
  const retourHtml = ((demande === 'rejetée' || demande === 'complément demandé') && b.motifRejet) ? `
    <div class="form-card" style="border-color:${demande === 'rejetée' ? '#FBCFE8;background:#FDF2F8' : '#FDE68A;background:#FEFCE8'};margin-bottom:14px">
      <div style="display:flex;align-items:center;gap:8px;margin-bottom:6px;flex-wrap:wrap">
        ${demandeBadge(b)}
        <span style="font-size:12px;color:var(--text-secondary)">par ${esc(b.valideParEmail||'—')} le ${formatDate(b.dateValidation)}</span>
      </div>
      <div style="font-size:12.5px;color:#374151"><strong>${demande === 'rejetée' ? 'Motif' : 'Complément attendu'} :</strong> ${esc(b.motifRejet)}</div>
      ${hasPending ? `<div style="font-size:12px;color:var(--text-secondary);margin-top:6px">La proposition est conservée : utilisez « Corriger et resoumettre » pour la reprendre.</div>` : ''}
    </div>` : '';

  // Action principale : bloquée tant qu'une demande attend la validation
  const majBtn = demande === 'en attente'
    ? `<button class="btn-primary" style="width:100%;justify-content:center;opacity:.5;cursor:not-allowed" disabled>
        ${svgIcon('<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>')}
        Mettre à jour le KYC
      </button>
      <p style="font-size:11.5px;color:var(--text-secondary);margin-top:8px">Une demande est déjà en attente de validation par la compliance.</p>`
    : `<button class="btn-primary" style="width:100%;justify-content:center" onclick="goMajKYC()">
        ${svgIcon('<polyline points="23 4 23 10 17 10"/><path d="M20.49 15a9 9 0 1 1-2.12-9.36L23 10"/>')}
        ${(demande === 'rejetée' || demande === 'complément demandé') && hasPending ? 'Corriger et resoumettre' : 'Mettre à jour le KYC'}
      </button>`;
  // Validation d'un dossier officiel existant jamais validé (aucune demande en cours)
  const validerExistantBtn = (isCPL && !officielValide && !jamaisValidee && demande === 'aucune' && !b.archive) ? `
    <button class="btn-primary" style="width:100%;justify-content:center;margin-top:8px;background:#15803D;border-color:#15803D" onclick="validerDossierExistant()">
      ${svgIcon('<polyline points="20 6 9 17 4 12"/>')}
      Valider le dossier actuel
    </button>` : '';
  const archiveBtn = isCPL ? `
    <button class="btn-secondary" style="width:100%;justify-content:center;margin-top:8px" onclick="toggleArchive()">
      ${svgIcon('<polyline points="21 8 21 21 3 21 3 8"/><rect x="1" y="3" width="22" height="5"/><line x1="10" y1="12" x2="14" y2="12"/>')}
      ${b.archive ? 'Réactiver la contrepartie' : 'Archiver la contrepartie'}
    </button>` : '';

  // Historique (plus récent en premier)
  const histo = [...(b.historique || [])].reverse();
  const histoHtml = histo.length ? histo.map(h => `
    <div class="histo-item">
      <div style="font-size:12.5px;font-weight:600;color:#111827">${esc(h.action)}</div>
      ${h.detail ? `<div style="font-size:12px;color:#374151;white-space:pre-wrap;margin-top:1px">${esc(h.detail)}</div>` : ''}
      <div style="font-size:11px;color:var(--text-muted);margin-top:2px">${esc(h.par || h.email || '')} · ${h.date ? new Date(h.date).toLocaleString('fr-FR',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}) : ''}</div>
    </div>`).join('')
    : `<p style="font-size:12.5px;color:var(--text-muted);font-style:italic">${hasColumn('HistoriqueKYC') ? 'Aucune action enregistrée depuis la mise en place de l\'historique.' : 'Historique indisponible : colonne HistoriqueKYC absente de la liste Brokers.'}</p>`;

  document.getElementById('view-detail').innerHTML = `
    <button class="back-btn" onclick="goListe()">${svgIcon('<polyline points="15 18 9 12 15 6"/>')}Retour aux contreparties</button>
    ${validationBlockHtml}
    ${retourHtml}
    <div class="detail-grid">
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="form-card">
          <div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;margin-bottom:12px">
            <div>
              <div class="section-title ${nameCls}" style="font-size:19px">${esc(b.nom)}</div>
              ${blinkReasonsHtml}
              <div style="margin-top:8px;display:flex;gap:6px;flex-wrap:wrap">
                ${bdg(st, STATUS_CLASS[st])}
                ${echeanceSecondaire(b)}
                ${demandeBadge(b)}
                ${b.archive ? bdg('Archivée','bdg-archive') : ''}
                ${affiche.niveauRisque ? bdg(`Risque ${affiche.niveauRisque.toLowerCase()}`, RISQUE_CLASS[affiche.niveauRisque]) : ''}
                ${b.equipes.map(e => bdg(e,'bdg-equipe')).join(' ')}
              </div>
              ${isCPL ? statutManuelHtml(b) : ''}
            </div>
          </div>
          <div style="display:flex;flex-direction:column;gap:8px;border-top:1px solid var(--border);padding-top:12px;font-size:13px;color:#374151">
            ${jamaisValidee ? `<div style="font-size:12px;color:#475569;background:#F1F5F9;border-radius:6px;padding:8px 12px">Contrepartie pas encore validée par la compliance : les informations ci-dessous sont celles proposées, pas un dossier officiel.</div>`
              : !officielValide ? `<div style="font-size:12px;color:#475569;background:#F1F5F9;border-radius:6px;padding:8px 12px">Dossier jamais validé par la compliance (contrepartie antérieure au circuit de validation ou saisie directement dans SharePoint).${isCPL && demande === 'aucune' ? ' Vérifiez-le puis utilisez « Valider le dossier actuel ».' : ''}</div>` : ''}
            <div><strong style="font-weight:600;color:var(--navy)">Classe(s) d'actif :</strong> ${esc(classesActifLabel(b))}</div>
            <div><strong style="font-weight:600;color:var(--navy)">Expiration du KYC :</strong> ${formatDate(affiche.dateExpiration)} ${jamaisValidee ? '' : bdg(echeance, STATUS_CLASS[echeance])}</div>
            <div><strong style="font-weight:600;color:var(--navy)">Dossier KYC :</strong>
              ${renderLienCliquable(affiche.kycLink, 'Ouvrir le dossier SharePoint →', 'Aucun lien renseigné')}
            </div>
            <div class="td-muted" style="font-size:12px;margin-top:4px">
              ${b.dernierKYCPar
                ? `Dernier KYC validé : demandé par ${esc(b.dernierKYCPar)}, le ${formatDate(b.dateDernierKYC)}`
                : 'Aucune mise à jour du KYC validée via CounterFlow.'}
            </div>
          </div>
        </div>

        <!-- PIÈCES DU DOSSIER (lecture seule, la saisie se fait dans les formulaires) -->
        <div class="form-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <div style="font-size:11px;font-weight:700;color:var(--text-secondary);letter-spacing:.07em;text-transform:uppercase">Pièces du dossier${affiche.proposition ? ' (proposé)' : ''}</div>
            ${dossierBadge(b)}
          </div>
          <p style="font-size:12px;color:var(--text-secondary);margin-bottom:8px">${nbPieces}/${piecesRequises.length} pièces réunies</p>
          ${piecesChecklist}
        </div>

        <!-- COMMENTAIRE (édition inline, ouverte à tous ; chaque modification est historisée) -->
        <div class="form-card">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:10px">
            <div style="font-size:11px;font-weight:700;color:var(--text-secondary);letter-spacing:.07em;text-transform:uppercase">Commentaire</div>
            <button class="btn-secondary" onclick="startEditCommentaire()" title="Modifier le commentaire" style="padding:6px 10px">
              ${svgIcon('<path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5z"/>')}
            </button>
          </div>
          <div id="commentaire-read" style="font-size:13px;line-height:1.6"></div>
          <div id="commentaire-edit" class="hidden">
            <textarea id="commentaire-textarea" class="form-input form-textarea" style="width:100%;min-height:110px"
              placeholder="Dérogation temporaire, contexte d'un retard KYC, particularité juridique..."></textarea>
            <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:8px">
              <button class="btn-secondary" onclick="cancelEditCommentaire()">Annuler</button>
              <button class="btn-primary" id="btn-save-commentaire" onclick="submitCommentaire()">Enregistrer</button>
            </div>
          </div>
        </div>
      </div>
      <div style="display:flex;flex-direction:column;gap:12px">
        <div class="form-card">
          <div style="font-size:11px;font-weight:700;color:var(--text-secondary);letter-spacing:.07em;text-transform:uppercase;margin-bottom:10px">Actions</div>
          ${b.archive ? '<p style="font-size:12px;color:var(--text-secondary);margin-bottom:8px">Contrepartie archivée : elle n\'est plus suivie ni relancée.</p>' : majBtn}
          ${validerExistantBtn}
          ${archiveBtn}
        </div>
        <div class="form-card">
          <div style="font-size:11px;font-weight:700;color:var(--text-secondary);letter-spacing:.07em;text-transform:uppercase;margin-bottom:12px">Historique</div>
          ${histoHtml}
        </div>
      </div>
    </div>`;

  renderCommentaireRead();
  showView('detail');
  window.scrollTo({top:0, behavior:'smooth'});
}

// ═══════════════════════════════════════════════════════════
// COMMENTAIRE (fiche détail — édition inline, sans condition isCPL)
// ═══════════════════════════════════════════════════════════
function renderCommentaireRead() {
  const el = document.getElementById('commentaire-read');
  if (!el) return;
  const txt = selectedBroker?.commentaire || '';
  if (txt) {
    el.textContent = txt; // textContent + pre-wrap : retours à la ligne préservés, aucune injection HTML
    el.style.cssText = 'font-size:13px;line-height:1.6;color:#374151;white-space:pre-wrap';
  } else {
    el.textContent = 'Aucun commentaire pour l\'instant';
    el.style.cssText = 'font-size:12.5px;line-height:1.6;color:var(--text-muted);font-style:italic';
  }
}

function startEditCommentaire() {
  document.getElementById('commentaire-textarea').value = selectedBroker?.commentaire || '';
  document.getElementById('commentaire-read').classList.add('hidden');
  document.getElementById('commentaire-edit').classList.remove('hidden');
  document.getElementById('commentaire-textarea').focus();
}

function cancelEditCommentaire() {
  document.getElementById('commentaire-edit').classList.add('hidden');
  document.getElementById('commentaire-read').classList.remove('hidden');
}

async function submitCommentaire() {
  const txt = document.getElementById('commentaire-textarea').value.trim();
  const btn = document.getElementById('btn-save-commentaire');
  btn.disabled = true;
  btn.textContent = 'Enregistrement...';

  try {
    const fresh = await fetchBroker(selectedBroker.spId);
    const fields = { commentaire: txt }; // nom interne SharePoint en minuscules (sensible à la casse)
    addHistorique(fields, fresh, 'Commentaire modifié', txt || '(commentaire effacé)');
    await graphPatch(`/sites/${spSiteId}/lists/${spListBrokersId}/items/${selectedBroker.spId}/fields`, fields);
    showToast('Commentaire mis à jour.', 'success');
    await loadBrokers();
    openDetail(selectedBroker.spId);
  } catch(e) {
    console.error(e);
    showToast(`Erreur : ${e.message}`, 'error');
    btn.disabled = false;
    btn.textContent = 'Enregistrer';
  }
}

// ═══════════════════════════════════════════════════════════
// MISE À JOUR DU KYC
// ═══════════════════════════════════════════════════════════
// Section "Pièces du dossier" partagée entre les deux formulaires (MAJ KYC et
// création). La checklist elle-même vit dans un conteneur identifié (containerId)
// afin d'être recalculée à la volée par refreshPiecesChecklist() dès que
// l'utilisateur change le niveau de risque, sans rechargement de page. viewId
// permet à chaque case de savoir quel formulaire mettre à jour (commentaire
// obligatoire) au moment où elle est (dé)cochée.
// checkedList : libellés déjà enregistrés, pour pré-cocher en édition.
function piecesDossierFormSection(viewId, containerId, niveauRisque, checkedList) {
  return `
    <div class="form-group full-width">
      <label class="form-label">Pièces du dossier</label>
      <div id="${containerId}">${piecesChecklistInnerHtml(viewId, niveauRisque, checkedList)}</div>
    </div>`;
}

// Contenu de la checklist pour un niveau de risque donné. Si aucun niveau de
// risque n'est encore choisi, aucune checklist n'est affichée : on invite
// l'utilisateur à choisir le niveau de risque d'abord.
function piecesChecklistInnerHtml(viewId, niveauRisque, checkedList) {
  if (!niveauRisque) {
    return `<p style="font-size:12.5px;color:var(--text-muted);font-style:italic;padding:4px 0">Choisissez d'abord le niveau de risque pour afficher les pièces attendues.</p>`;
  }
  const checked = new Set(checkedList || []);
  return `<div style="display:flex;flex-direction:column;gap:2px">
    ${getPiecesRequisesPourRisque(niveauRisque).map(p => `
      <label style="display:flex;align-items:flex-start;gap:8px;font-size:12.5px;color:var(--text-secondary);cursor:pointer;padding:4px 0;font-weight:500">
        <input type="checkbox" class="cf-piece" value="${esc(p)}" ${checked.has(p)?'checked':''} onchange="updateCommentaireRequirement('${viewId}')" style="width:15px;height:15px;flex-shrink:0;margin-top:1px">
        <span>${esc(p)}</span>
      </label>`).join('')}
  </div>`;
}

// Recalcule la checklist affichée dans containerId pour le nouveau niveau de
// risque, en pré-cochant les libellés de checkedList qui existent encore dans le
// référentiel du nouveau niveau (les cases déjà cochées par l'utilisateur ne sont
// donc pas perdues lors du changement de niveau de risque). Le changement de
// niveau de risque modifie aussi le total de pièces attendues : on recalcule donc
// systématiquement le caractère obligatoire du commentaire dans la foulée.
function refreshPiecesChecklist(viewId, containerId, niveauRisque, checkedList) {
  const el = document.getElementById(containerId);
  if (el) el.innerHTML = piecesChecklistInnerHtml(viewId, niveauRisque, checkedList);
  updateCommentaireRequirement(viewId);
}

// viewId : conteneur du formulaire actif — les vues gardant leur HTML après
// navigation, un sélecteur global ramasserait les cases de l'autre formulaire.
function selectedPiecesDossier(viewId) {
  return Array.from(document.querySelectorAll(`#${viewId} .cf-piece:checked`)).map(c => c.value);
}

// ── Commentaire obligatoire si dossier incomplet ────────────────────────────
// Champ "Commentaire" partagé entre "Nouvelle contrepartie" et "Mettre à jour le
// KYC" (futur formulaire du workflow de validation compliance inclus, puisqu'il
// s'agit du même formulaire). initialValue : valeur existante à pré-remplir
// (ex. commentaire déjà enregistré sur la contrepartie), vide pour une création.
function commentaireFormSection(viewId, fieldId, initialValue) {
  return `
    <div class="form-group full-width">
      <label class="form-label" id="${fieldId}-label">Commentaire</label>
      <textarea id="${fieldId}" class="form-input form-textarea" style="width:100%;min-height:90px"
        placeholder="Contexte, pièces manquantes, dérogation temporaire...">${esc(initialValue || '')}</textarea>
      <p id="${fieldId}-help" class="hidden" style="font-size:11.5px;color:#DC2626;margin-top:5px;font-weight:500">
        Dossier incomplet : merci de préciser les pièces manquantes ou le contexte.
      </p>
    </div>`;
}

// Un seul champ commentaire par formulaire, identifié par le viewId. Pas de
// variable dédiée : le niveau de risque en cours est lu directement dans
// nouvelleRisqueSel / majKycRisqueSel selon la vue.
function commentaireFieldIdFor(viewId) {
  return viewId === 'view-nouvelle' ? 'cf-commentaire' : 'kyc-commentaire';
}

// Vrai si le nombre de pièces cochées est inférieur au total attendu pour le
// niveau de risque actuellement choisi dans ce formulaire. Faux tant qu'aucun
// niveau de risque n'est choisi (aucune checklist affichée à ce stade).
function commentaireRequisPour(viewId) {
  const niveauRisque = viewId === 'view-nouvelle' ? nouvelleRisqueSel : majKycRisqueSel;
  if (!niveauRisque) return false;
  return selectedPiecesDossier(viewId).length < getPiecesRequisesPourRisque(niveauRisque).length;
}

// Met à jour l'indicateur visuel (astérisque rouge + texte d'aide) dès que le
// dossier passe incomplet/complet — appelé au premier affichage du formulaire, à
// chaque case (dé)cochée et à chaque changement de niveau de risque, pour que
// l'obligation ne soit jamais une surprise découverte seulement à la soumission.
function updateCommentaireRequirement(viewId) {
  const fieldId = commentaireFieldIdFor(viewId);
  const requis = commentaireRequisPour(viewId);
  const label = document.getElementById(`${fieldId}-label`);
  const help = document.getElementById(`${fieldId}-help`);
  if (label) label.innerHTML = requis ? 'Commentaire <span style="color:#DC2626">*</span>' : 'Commentaire';
  if (help) help.classList.toggle('hidden', !requis);
}

// Niveau de risque sélectionné dans le formulaire "Mettre à jour le KYC". Distinct
// de nouvelleRisqueSel (formulaire "Nouvelle contrepartie") : les deux vues gardent
// leur HTML après navigation, il faut donc une variable par formulaire.
let majKycRisqueSel = null;

function goMajKYC() {
  const b = selectedBroker;
  if (computeDemande(b) === 'en attente') { showToast('Une demande est déjà en attente de validation par la compliance.', 'error'); return; }
  // Après un rejet ou une demande de complément, la proposition conservée est reprise
  // pour être corrigée ; sinon le formulaire part du dossier officiel.
  const reprise = hasPendingProposal(b) && ['complément demandé', 'rejetée'].includes(computeDemande(b));
  majKycRisqueSel = (reprise && b.niveauRisquePending) || b.niveauRisque || b.niveauRisquePending || null;
  const lienInitial = reprise ? (b.kycPending || b.kycLink) : b.kycLink;
  const dateInitiale = reprise && b.dateExpirationPending ? String(b.dateExpirationPending).slice(0, 10) : '';
  const piecesInitiales = reprise ? b.piecesDossierPending : b.piecesDossier;
  document.getElementById('view-maj-kyc').innerHTML = `
    <button class="back-btn" onclick="openDetail(selectedBroker.spId)">${svgIcon('<polyline points="15 18 9 12 15 6"/>')}Retour à la fiche</button>
    <div style="max-width:600px">
      <div class="form-card">
        <div style="margin-bottom:18px">
          <h2 class="section-title" style="font-size:18px">${reprise ? 'Corriger et resoumettre la demande' : 'Mettre à jour le KYC'}</h2>
          <p class="section-desc">Contrepartie : ${esc(b.nom)}</p>
        </div>
        ${reprise && b.motifRejet ? `<p style="font-size:12.5px;color:#92400E;background:#FFFBEB;border:1px solid #FDE68A;border-radius:8px;padding:10px 12px;margin-bottom:10px">
          <strong>Retour de la compliance :</strong> ${esc(b.motifRejet)}</p>` : ''}
        <p style="font-size:12.5px;color:var(--text-secondary);background:#F1F5F9;border-radius:8px;padding:10px 12px;margin-bottom:4px">
          Cette demande (niveau de risque, lien, date d'expiration et pièces) sera soumise à la validation de la compliance avant d'être appliquée au dossier officiel.
        </p>
        <div class="form-grid">
          <div class="form-group full-width">
            <label class="form-label">Niveau de risque *</label>
            <div class="prio-row">
              ${NIVEAUX_RISQUE.map(r => `<button type="button" class="prio-btn ${majKycRisqueSel===r?'sel':''}" onclick="setMajKycRisque('${r}')">${r}</button>`).join('')}
            </div>
          </div>
          <div class="form-group full-width">
            <label class="form-label">Lien du dossier KYC (SharePoint) *</label>
            <input type="url" id="kyc-lien" class="form-input" autocomplete="off" placeholder="https://eiffelinvestmentgroup.sharepoint.com/..." value="${esc(lienInitial || '')}">
          </div>
          <div class="form-group full-width">
            <label class="form-label">Nouvelle date d'expiration *</label>
            <input type="date" id="kyc-date-exp" class="form-input" value="${esc(dateInitiale)}">
          </div>
          ${piecesDossierFormSection('view-maj-kyc', 'majkyc-pieces-checklist', majKycRisqueSel, piecesInitiales)}
          ${commentaireFormSection('view-maj-kyc', 'kyc-commentaire', b.commentaire)}
        </div>
        <div class="form-actions">
          <button class="btn-primary" onclick="submitMajKYC()" style="width:100%;justify-content:center">
            ${svgIcon('<polyline points="20 6 9 17 4 12"/>')}
            Soumettre à la validation compliance
          </button>
        </div>
      </div>
    </div>`;
  showView('maj-kyc');
  window.scrollTo(0,0);
  updateCommentaireRequirement('view-maj-kyc');
}

function setMajKycRisque(r) {
  const dejaCochees = selectedPiecesDossier('view-maj-kyc');
  majKycRisqueSel = r;
  document.querySelectorAll('#view-maj-kyc .prio-row .prio-btn').forEach(btn => btn.classList.toggle('sel', btn.textContent.trim() === r));
  refreshPiecesChecklist('view-maj-kyc', 'majkyc-pieces-checklist', majKycRisqueSel, dejaCochees);
}

async function submitMajKYC() {
  // Lectures scopées à la vue du formulaire : aucune valeur ne peut venir d'un
  // autre écran resté dans le DOM.
  const lien = document.querySelector('#view-maj-kyc #kyc-lien').value.trim();
  const dateExp = document.querySelector('#view-maj-kyc #kyc-date-exp').value;
  const commentaireVal = document.querySelector('#view-maj-kyc #kyc-commentaire').value.trim();
  const piecesCochees = selectedPiecesDossier('view-maj-kyc');
  if (!majKycRisqueSel) { showToast('Le niveau de risque est obligatoire.', 'error'); return; }
  if (!lien || !dateExp) { showToast('Le lien KYC et la date d\'expiration sont obligatoires.', 'error'); return; }
  if (!validateExternalLink(lien, 'Lien KYC')) return;
  if (piecesCochees.length < getPiecesRequisesPourRisque(majKycRisqueSel).length && !commentaireVal) {
    showToast('Dossier incomplet : un commentaire expliquant les pièces manquantes est obligatoire.', 'error');
    return;
  }

  const btn = document.querySelector('#view-maj-kyc [onclick="submitMajKYC()"]');
  btn.disabled = true;
  btn.textContent = 'Envoi...';

  try {
    // Relecture : une autre personne a pu soumettre une demande entre-temps
    const fresh = await fetchBroker(selectedBroker.spId);
    if (computeDemande(fresh) === 'en attente') {
      throw new Error('une demande est déjà en attente de validation pour cette contrepartie (soumise par ' + (fresh.demandeParEmail || 'un autre collaborateur') + ')');
    }

    // Les colonnes officielles (KYC, DateExpirationKYC, PiecesDossier, NiveauRisque) ne
    // sont PAS touchées : la demande est déposée dans les colonnes "*_Pending" et n'est
    // reprise dans le dossier officiel qu'après validation (voir validerKYCPending()).
    const fields = {};
    if (hasColumn('NiveauRisque_Pending')) fields.NiveauRisque_Pending = majKycRisqueSel;
    else if (hasColumn('NiveauRisque')) {
      // Ancien fonctionnement tant que la colonne n'existe pas : application immédiate
      console.warn('Colonne NiveauRisque_Pending absente : niveau de risque appliqué sans validation.');
      fields.NiveauRisque = majKycRisqueSel;
    }
    if (hasColumn('KYC_Pending')) fields.KYC_Pending = lien;
    if (hasColumn('DateExpirationKYC_Pending')) fields.DateExpirationKYC_Pending = new Date(dateExp).toISOString();
    if (hasColumn('PiecesDossier_Pending')) {
      fields['PiecesDossier_Pending@odata.type'] = 'Collection(Edm.String)';
      fields.PiecesDossier_Pending = piecesCochees;
    }
    if (hasColumn('StatutValidationKYC')) fields.StatutValidationKYC = 'En attente de validation';
    if (hasColumn('DemandeParEmail')) fields.DemandeParEmail = currentUser.email;
    if (hasColumn('DateDemande')) fields.DateDemande = new Date().toISOString();
    if (hasColumn('MotifRejet')) fields.MotifRejet = '';
    // Le commentaire n'est pas soumis à validation : il s'applique immédiatement.
    fields.commentaire = commentaireVal; // nom interne SharePoint en minuscules
    const resoumission = ['complément demandé', 'rejetée'].includes(computeDemande(fresh));
    addHistorique(fields, fresh, resoumission ? 'Demande corrigée et resoumise' : 'Demande de mise à jour du KYC',
      resumeDossier(majKycRisqueSel, lien, dateExp, piecesCochees)
      + (commentaireVal && commentaireVal !== fresh.commentaire ? `\nCommentaire : ${commentaireVal}` : ''));

    await graphPatch(`/sites/${spSiteId}/lists/${spListBrokersId}/items/${selectedBroker.spId}/fields`, fields);
    envoyerNotification(CPL_MAIL, `[CounterFlow] KYC à valider : ${fresh.nom}`, [
      `<strong>${esc(currentUser.name)}</strong> a ${resoumission ? 'corrigé et resoumis' : 'soumis'} une mise à jour du KYC de <strong>${esc(fresh.nom)}</strong>.`,
      esc(resumeDossier(majKycRisqueSel, '', dateExp, piecesCochees)) + '.'
    ], fresh);
    showToast(`Demande de mise à jour du KYC de ${esc(selectedBroker.nom)} envoyée à la validation compliance.`, 'success');
    await loadBrokers();
    openDetail(selectedBroker.spId);
  } catch(e) {
    console.error(e);
    showToast(`Erreur : ${esc(e.message)}`, 'error');
    btn.disabled = false;
    btn.textContent = 'Soumettre à la validation compliance';
  }
}

// ═══════════════════════════════════════════════════════════
// VALIDATION COMPLIANCE KYC — bloc affiché sur la fiche détail (isCPL uniquement)
// ═══════════════════════════════════════════════════════════
// Reprend le dossier proposé (*_Pending) d'un broker dans les champs principaux.
// Partagé entre le bouton "Valider" du workflow (qui n'apparaît que si une
// demande est en attente, donc les *_Pending sont toujours renseignés) et le
// contrôle de statut manuel (qui peut viser "Validé" même sans demande en
// attente — voir ecrireStatutManuel()), d'où le nom générique.
function appliquerDossierPendingAuxChampsPrincipaux(fields, b) {
  if (hasColumn('KYC')) fields.KYC = b.kycPending || '';
  if (hasColumn('DateExpirationKYC')) fields.DateExpirationKYC = b.dateExpirationPending || null;
  if (hasColumn('PiecesDossier')) {
    fields['PiecesDossier@odata.type'] = 'Collection(Edm.String)';
    fields.PiecesDossier = b.piecesDossierPending || [];
  }
  if (b.niveauRisquePending && hasColumn('NiveauRisque')) fields.NiveauRisque = b.niveauRisquePending;
  if (hasColumn('DernierKYCPar')) fields.DernierKYCPar = b.demandeParEmail || currentUser.name;
  if (hasColumn('DateDernierKYC')) fields.DateDernierKYC = new Date().toISOString();
}

// Vide les colonnes "*_Pending" : la proposition est refermée après validation ou
// réinitialisation manuelle. Un rejet ou une demande de complément la conserve.
function viderChampsPending(fields) {
  if (hasColumn('DateExpirationKYC_Pending')) fields.DateExpirationKYC_Pending = null;
  if (hasColumn('PiecesDossier_Pending')) {
    fields['PiecesDossier_Pending@odata.type'] = 'Collection(Edm.String)';
    fields.PiecesDossier_Pending = [];
  }
  if (hasColumn('KYC_Pending')) fields.KYC_Pending = '';
  if (hasColumn('NiveauRisque_Pending')) fields.NiveauRisque_Pending = '';
}

// Valider : reprend le dossier proposé (*_Pending) dans les colonnes principales,
// puis vide les champs *_Pending et MotifRejet. Refusé à l'auteur de la demande
// (deux personnes distinctes pour proposer et valider). Chaque colonne reste gardée
// par hasColumn() : une colonne absente ferait échouer toute la requête en 400.
async function validerKYCPending() {
  const b = selectedBroker;
  if (!b || !isCPL) return;

  try {
    const fresh = await fetchBroker(b.spId);
    if (computeDemande(fresh) !== 'en attente') throw new Error('cette demande n\'est plus en attente de validation, rechargez la fiche');
    if (estAuteurDeLaDemande(fresh)) throw new Error('vous êtes l\'auteur de cette demande, elle doit être validée par un autre membre de la compliance');

    const fields = {};
    // Ancien circuit de création : le dossier officiel contient déjà la proposition et les
    // *_Pending sont vides, rien à copier.
    if (hasPendingProposal(fresh)) appliquerDossierPendingAuxChampsPrincipaux(fields, fresh);
    else {
      if (hasColumn('DernierKYCPar')) fields.DernierKYCPar = fresh.demandeParEmail || currentUser.name;
      if (hasColumn('DateDernierKYC')) fields.DateDernierKYC = new Date().toISOString();
    }
    if (hasColumn('StatutValidationKYC')) fields.StatutValidationKYC = 'Validé';
    if (hasColumn('ValideParEmail')) fields.ValideParEmail = currentUser.email;
    if (hasColumn('DateValidation')) fields.DateValidation = new Date().toISOString();
    if (hasColumn('MotifRejet')) fields.MotifRejet = '';
    viderChampsPending(fields);
    const jamaisValidee = estJamaisValidee(fresh);
    addHistorique(fields, fresh, jamaisValidee ? 'Création validée' : 'Mise à jour du KYC validée',
      hasPendingProposal(fresh) ? resumeDossier(fresh.niveauRisquePending || fresh.niveauRisque, fresh.kycPending, fresh.dateExpirationPending, fresh.piecesDossierPending) : '');

    await graphPatch(`/sites/${spSiteId}/lists/${spListBrokersId}/items/${b.spId}/fields`, fields);
    envoyerNotification(demandeurANotifier(fresh), `[CounterFlow] KYC validé : ${fresh.nom}`, [
      `Votre ${jamaisValidee ? 'demande de création' : 'mise à jour du KYC'} pour <strong>${esc(fresh.nom)}</strong> a été validée par ${esc(currentUser.name)}.`
    ], fresh);
    showToast(`KYC de ${esc(b.nom)} validé.`, 'success');
    await loadBrokers();
    openDetail(b.spId);
  } catch(e) {
    console.error(e);
    showToast(`Validation impossible : ${esc(e.message)}`, 'error');
  }
}

// Rejeter ou demander un complément : ne touche PAS au dossier officiel et conserve la
// proposition (*_Pending) pour qu'elle soit corrigée puis resoumise. Message obligatoire.
// kind : 'rejet' ou 'complement'. Un message est obligatoire dans les deux cas.
const DECISIONS = {
  rejet: {
    titre: 'Rejeter la demande',
    texte: 'Le dossier proposé ne sera pas repris dans le dossier officiel. Il reste consultable et le demandeur pourra le corriger puis le resoumettre. Précisez le motif du rejet.',
    placeholder: 'Motif du rejet...', bouton: 'Confirmer le rejet', couleur: '#DC2626',
    statut: 'Rejeté', histo: 'Demande rejetée', mail: 'rejetée', toast: 'rejetée'
  },
  complement: {
    titre: 'Demander un complément',
    texte: 'La demande est renvoyée au demandeur, qui pourra la compléter sans tout ressaisir. Précisez ce qui manque.',
    placeholder: 'Pièces ou informations attendues...', bouton: 'Envoyer la demande de complément', couleur: '#A16207',
    statut: STATUT_COMPLEMENT, histo: 'Complément demandé', mail: 'renvoyée pour complément', toast: 'renvoyée pour complément'
  }
};

function openDecisionModal(kind) {
  if (!selectedBroker || !isCPL || !DECISIONS[kind]) return;
  const d = DECISIONS[kind];
  document.getElementById('modal-slot').innerHTML = `
    <div class="cf-modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="cf-modal">
        <h3 style="font-size:16px;font-weight:700;color:var(--navy);margin-bottom:6px">${d.titre} : ${esc(selectedBroker.nom)}</h3>
        <p style="font-size:12.5px;color:var(--text-secondary);margin-bottom:14px">${d.texte}</p>
        <textarea id="decision-textarea" class="form-input form-textarea" style="width:100%;min-height:100px" placeholder="${d.placeholder}"></textarea>
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
          <button class="btn-secondary" onclick="closeModal()">Annuler</button>
          <button class="btn-primary" style="background:${d.couleur};border-color:${d.couleur}" onclick="confirmDecision('${kind}')">${d.bouton}</button>
        </div>
      </div>
    </div>`;
  document.getElementById('decision-textarea').focus();
}

function openRejectModal() { openDecisionModal('rejet'); }

async function confirmDecision(kind) {
  const b = selectedBroker;
  const d = DECISIONS[kind];
  if (!b || !isCPL || !d) return;
  const message = document.getElementById('decision-textarea').value.trim();
  if (!message) { showToast('Le message est obligatoire.', 'error'); return; }

  try {
    const fresh = await fetchBroker(b.spId);
    const fields = {};
    if (hasColumn('StatutValidationKYC')) fields.StatutValidationKYC = d.statut;
    if (hasColumn('MotifRejet')) fields.MotifRejet = message;
    if (hasColumn('ValideParEmail')) fields.ValideParEmail = currentUser.email;
    if (hasColumn('DateValidation')) fields.DateValidation = new Date().toISOString();
    // La proposition (*_Pending) est conservée pour être corrigée. Ancien circuit de
    // création (proposition écrite dans le dossier officiel) : elle est déplacée dans les
    // *_Pending et le dossier officiel est vidé, pour qu'aucune donnée non validée ne
    // puisse passer pour un dossier officiel.
    if (estJamaisValidee(fresh) && !hasPendingProposal(fresh) && hasColumn('KYC_Pending')) {
      fields.KYC_Pending = fresh.kycLink || '';
      if (hasColumn('DateExpirationKYC_Pending')) fields.DateExpirationKYC_Pending = fresh.dateExpiration || null;
      if (hasColumn('PiecesDossier_Pending')) {
        fields['PiecesDossier_Pending@odata.type'] = 'Collection(Edm.String)';
        fields.PiecesDossier_Pending = fresh.piecesDossier || [];
      }
      if (hasColumn('NiveauRisque_Pending')) fields.NiveauRisque_Pending = fresh.niveauRisque || '';
      if (hasColumn('KYC')) fields.KYC = '';
      if (hasColumn('DateExpirationKYC')) fields.DateExpirationKYC = null;
      if (hasColumn('PiecesDossier')) {
        fields['PiecesDossier@odata.type'] = 'Collection(Edm.String)';
        fields.PiecesDossier = [];
      }
    }
    addHistorique(fields, fresh, d.histo, message);

    await graphPatch(`/sites/${spSiteId}/lists/${spListBrokersId}/items/${b.spId}/fields`, fields);
    closeModal();
    envoyerNotification(demandeurANotifier(fresh), `[CounterFlow] Demande ${d.mail} : ${fresh.nom}`, [
      `Votre demande concernant <strong>${esc(fresh.nom)}</strong> a été ${d.mail} par ${esc(currentUser.name)}.`,
      `<strong>${kind === 'rejet' ? 'Motif' : 'Complément attendu'} :</strong> ${esc(message)}`,
      'Votre proposition est conservée : ouvrez la fiche et utilisez « Corriger et resoumettre ».'
    ], fresh);
    showToast(`Demande ${d.toast} : ${esc(b.nom)}.`, 'success');
    await loadBrokers();
    openDetail(b.spId);
  } catch(e) {
    console.error(e);
    showToast(`Erreur : ${esc(e.message)}`, 'error');
  }
}

// ═══════════════════════════════════════════════════════════
// STATUT DE VALIDATION KYC — contrôle manuel (compliance uniquement)
// ═══════════════════════════════════════════════════════════
// Permet à la compliance de fixer StatutValidationKYC indépendamment de
// l'existence d'une demande en attente (ex. réinitialiser un rejet traité,
// rouvrir une demande close par erreur, valider un dossier sans être passé par
// le workflow "Mettre à jour le KYC"). Double vérification isCPL : le bloc n'est
// jamais rendu dans le DOM si isCPL est faux (voir statutManuelHtml(), appelée
// uniquement depuis openDetail() sous condition), ET chacune des fonctions
// d'écriture ci-dessous revérifie isCPL avant tout appel Graph — un appel direct
// depuis la console (ex. ecrireStatutManuel('Validé')) ne peut donc rien écrire
// si l'utilisateur n'est pas compliance.
function statutManuelHtml(b) {
  const current = b.statutValidationKYC || 'Aucune demande';
  return `
    <div style="margin-top:10px;padding-top:10px;border-top:1px dashed var(--border);display:flex;align-items:center;gap:8px;flex-wrap:wrap">
      <span style="font-size:10px;font-weight:700;color:var(--text-muted);letter-spacing:.06em;text-transform:uppercase">Statut (compliance)</span>
      <select id="statut-manuel-select" class="form-input" style="width:auto;flex:0 0 auto;padding:5px 8px;font-size:12.5px">
        ${STATUTS_VALIDATION_KYC.map(s => `<option value="${esc(s)}" ${s===current?'selected':''}>${esc(s)}</option>`).join('')}
      </select>
      <button class="btn-secondary" style="padding:5px 12px;font-size:12.5px" onclick="applyStatutManuel()">Appliquer</button>
    </div>`;
}

// Lit la valeur choisie dans le menu, demande confirmation (recap de l'action)
// avant tout écriture Graph, puis délègue à ecrireStatutManuel(). "Rejeté" passe
// par une modal dédiée pour la saisie du motif obligatoire plutôt que par
// confirm() : la saisie + le clic "Confirmer" y tiennent déjà lieu de confirmation.
function applyStatutManuel() {
  if (!isCPL) { showToast('Action réservée à la compliance.', 'error'); return; }
  const b = selectedBroker;
  const select = document.getElementById('statut-manuel-select');
  if (!b || !select) return;
  const nouveauStatut = select.value;

  if (nouveauStatut === 'Rejeté') { openDecisionModal('rejet'); return; }
  if (nouveauStatut === STATUT_COMPLEMENT) { openDecisionModal('complement'); return; }
  if (nouveauStatut === 'Validé' && estAuteurDeLaDemande(b) && b.statutValidationKYC === 'En attente de validation') {
    showToast('Vous êtes l\'auteur de cette demande : elle doit être validée par un autre membre de la compliance.', 'error');
    return;
  }

  const hasPending = hasPendingProposal(b);
  const messages = {
    'Aucune demande': `Réinitialiser le statut de ${b.nom} à "Aucune demande" ?\n\nLe motif de rejet et le dossier proposé (le cas échéant) seront effacés. Le dossier officiel (KYC, date d'expiration, pièces) n'est pas modifié.`,
    'En attente de validation': `Repasser ${b.nom} en "En attente de validation" ?\n\nAucune autre donnée n'est modifiée.`,
    'Validé': hasPending
      ? `Valider le statut de ${b.nom} ?\n\nLe dossier proposé en attente (KYC, date d'expiration, pièces) sera repris dans le dossier officiel.`
      : `Marquer ${b.nom} comme "Validé" ?\n\nAucun dossier proposé n'est en attente : seul le statut sera modifié.`
  };
  if (!confirm(messages[nouveauStatut])) return;

  ecrireStatutManuel(nouveauStatut);
}

// Écriture Graph effective. isCPL est revérifié ici, mais ce contrôle reste côté
// navigateur : il évite les erreurs de manipulation, pas un contournement volontaire.
async function ecrireStatutManuel(nouveauStatut) {
  if (!isCPL) { showToast('Action réservée à la compliance.', 'error'); return; }
  const b = selectedBroker;
  if (!b || !['Aucune demande', 'En attente de validation', 'Validé'].includes(nouveauStatut)) return;

  try {
    const fresh = await fetchBroker(b.spId);
    if (nouveauStatut === 'Validé' && estAuteurDeLaDemande(fresh) && fresh.statutValidationKYC === 'En attente de validation') {
      throw new Error('vous êtes l\'auteur de cette demande, elle doit être validée par un autre membre de la compliance');
    }
    const fields = {};
    if (hasColumn('StatutValidationKYC')) fields.StatutValidationKYC = nouveauStatut;

    if (nouveauStatut === 'Validé') {
      if (hasPendingProposal(fresh)) appliquerDossierPendingAuxChampsPrincipaux(fields, fresh);
      if (hasColumn('ValideParEmail')) fields.ValideParEmail = currentUser.email;
      if (hasColumn('DateValidation')) fields.DateValidation = new Date().toISOString();
      if (hasColumn('MotifRejet')) fields.MotifRejet = '';
      viderChampsPending(fields);
    } else if (nouveauStatut === 'Aucune demande') {
      if (hasColumn('MotifRejet')) fields.MotifRejet = '';
      viderChampsPending(fields);
    }
    // 'En attente de validation' : uniquement le statut, aucun autre champ touché.
    addHistorique(fields, fresh, `Statut changé manuellement : ${nouveauStatut}`,
      fresh.statutValidationKYC ? `Statut précédent : ${fresh.statutValidationKYC}` : '');

    await graphPatch(`/sites/${spSiteId}/lists/${spListBrokersId}/items/${b.spId}/fields`, fields);
    closeModal();
    showToast(`Statut de ${esc(b.nom)} changé manuellement en "${nouveauStatut}".`, 'success');
    await loadBrokers();
    openDetail(b.spId);
  } catch(e) {
    console.error(e);
    showToast(`Erreur : ${esc(e.message)}`, 'error');
  }
}

// Validation par la compliance d'un dossier officiel existant qui ne l'a jamais été
// (contrepartie antérieure au circuit de validation ou saisie dans SharePoint). Le
// dossier n'est pas modifié : seule sa validation est enregistrée et historisée.
async function validerDossierExistant() {
  if (!isCPL || !selectedBroker) return;
  const b = selectedBroker;
  if (!confirm(`Valider le dossier actuel de ${b.nom} ?\n\nRisque ${b.niveauRisque || 'non renseigné'}, expiration ${formatDate(b.dateExpiration)}, ${countPiecesDossier(b)}/${getPiecesRequisesPourRisque(b.niveauRisque).length} pièces.\nLe dossier n'est pas modifié : seule sa validation est enregistrée.`)) return;
  try {
    const fresh = await fetchBroker(b.spId);
    if (dossierOfficielValide(fresh)) throw new Error('ce dossier est déjà validé, rechargez la fiche');
    if (computeDemande(fresh) !== 'aucune') throw new Error('une demande est en cours sur cette contrepartie : traitez-la d\'abord');
    const fields = {};
    if (hasColumn('StatutValidationKYC')) fields.StatutValidationKYC = 'Validé';
    if (hasColumn('ValideParEmail')) fields.ValideParEmail = currentUser.email;
    if (hasColumn('DateValidation')) fields.DateValidation = new Date().toISOString();
    if (hasColumn('MotifRejet')) fields.MotifRejet = '';
    addHistorique(fields, fresh, 'Dossier existant validé',
      resumeDossier(fresh.niveauRisque, fresh.kycLink, fresh.dateExpiration, fresh.piecesDossier));
    await graphPatch(`/sites/${spSiteId}/lists/${spListBrokersId}/items/${b.spId}/fields`, fields);
    showToast(`Dossier de ${esc(b.nom)} validé.`, 'success');
    await loadBrokers();
    openDetail(b.spId);
  } catch(e) {
    console.error(e);
    showToast(`Validation impossible : ${esc(e.message)}`, 'error');
  }
}

// Archivage (compliance) : la contrepartie n'est plus suivie, relancée ni comptée,
// mais reste consultable avec son historique. Réversible.
async function toggleArchive() {
  if (!isCPL || !selectedBroker) return;
  if (!hasColumn('Archive')) { showToast('Archivage indisponible : colonne Archive absente de la liste Brokers.', 'error'); return; }
  const b = selectedBroker;
  const archiver = !b.archive;
  if (!confirm(archiver
    ? `Archiver ${b.nom} ?\n\nElle sera masquée de la liste, exclue des relances et des compteurs. Son historique est conservé et l'archivage est réversible.`
    : `Réactiver ${b.nom} ?`)) return;
  try {
    const fresh = await fetchBroker(b.spId);
    const fields = { Archive: archiver };
    addHistorique(fields, fresh, archiver ? 'Contrepartie archivée' : 'Contrepartie réactivée');
    await graphPatch(`/sites/${spSiteId}/lists/${spListBrokersId}/items/${b.spId}/fields`, fields);
    showToast(`${esc(b.nom)} ${archiver ? 'archivée' : 'réactivée'}.`, 'success');
    await loadBrokers();
    openDetail(b.spId);
  } catch(e) {
    console.error(e);
    showToast(`Erreur : ${esc(e.message)}`, 'error');
  }
}

async function submitNouvelle() {
  const nom = document.querySelector('#view-nouvelle #cf-nom').value.trim();
  const equipes = Array.from(document.querySelectorAll('#view-nouvelle .cf-equipe:checked')).map(c => c.value);
  const classes = Array.from(document.querySelectorAll('#view-nouvelle .cf-classe:checked')).map(c => c.value);
  const classeAutre = document.querySelector('#view-nouvelle #cf-classe-autre').value.trim();
  const kycLien = document.querySelector('#view-nouvelle #cf-kyc-lien').value.trim();
  const dateExp = document.querySelector('#view-nouvelle #cf-date-exp').value;
  const commentaireVal = document.querySelector('#view-nouvelle #cf-commentaire').value.trim();
  const piecesCochees = selectedPiecesDossier('view-nouvelle');

  if (!nom || !equipes.length || !classes.length) {
    showToast('Le nom, au moins une équipe et au moins une classe d\'actif sont obligatoires.', 'error');
    return;
  }
  if (!nouvelleRisqueSel) {
    showToast('Le niveau de risque est obligatoire.', 'error');
    return;
  }
  // Dossier incomplet pour le niveau de risque choisi : le commentaire devient
  // obligatoire (contexte des pièces manquantes).
  if (piecesCochees.length < getPiecesRequisesPourRisque(nouvelleRisqueSel).length && !commentaireVal) {
    showToast('Dossier incomplet : un commentaire expliquant les pièces manquantes est obligatoire.', 'error');
    return;
  }
  // Le Title "__CONFIG__" est réservé à l'élément de configuration interne :
  // refuser toute création qui entrerait en collision avec lui.
  if (nom === CONFIG_TITLE) {
    showToast(`Le nom "${CONFIG_TITLE}" est réservé au fonctionnement interne de CounterFlow et ne peut pas être utilisé.`, 'error');
    return;
  }
  if (kycLien && !validateExternalLink(kycLien, 'Lien KYC')) return;
  const doublon = brokers.find(b => b.nom.trim().toLowerCase() === nom.toLowerCase());
  if (doublon) {
    showToast(`Une contrepartie nommée "${esc(doublon.nom)}" existe déjà${doublon.archive ? ' (archivée)' : ''}. Ouvrez sa fiche pour la mettre à jour.`, 'error');
    return;
  }

  const btn = document.querySelector('#view-nouvelle [onclick="submitNouvelle()"]');
  btn.disabled = true;
  btn.textContent = 'Enregistrement...';

  try {
    const fields = {
      Title: nom,
      'Equipe@odata.type': 'Collection(Edm.String)',
      Equipe: equipes,
      'ClasseActif@odata.type': 'Collection(Edm.String)',
      ClasseActif: classes,
      ClasseActifAutre: classes.includes('Autres') ? classeAutre : ''
    };
    // Toute nouvelle contrepartie part "En attente de validation". Le dossier saisi est
    // une PROPOSITION : il est déposé dans les colonnes *_Pending, comme une mise à jour,
    // et le dossier officiel reste vide jusqu'à la validation. Si les colonnes *_Pending
    // n'existent pas, ancien fonctionnement (écriture directe dans le dossier officiel).
    const circuitPending = hasColumn('KYC_Pending') && hasColumn('DateExpirationKYC_Pending') && hasColumn('PiecesDossier_Pending');
    if (circuitPending) {
      if (hasColumn('NiveauRisque_Pending')) fields.NiveauRisque_Pending = nouvelleRisqueSel;
      else fields.NiveauRisque = nouvelleRisqueSel;
      fields.KYC_Pending = kycLien;
      fields.DateExpirationKYC_Pending = dateExp ? new Date(dateExp).toISOString() : null;
      fields['PiecesDossier_Pending@odata.type'] = 'Collection(Edm.String)';
      fields.PiecesDossier_Pending = piecesCochees;
    } else {
      console.warn('Colonnes *_Pending absentes : la création est écrite dans le dossier officiel.');
      fields.NiveauRisque = nouvelleRisqueSel;
      if (hasColumn('PiecesDossier')) {
        fields['PiecesDossier@odata.type'] = 'Collection(Edm.String)';
        fields.PiecesDossier = piecesCochees;
      }
      if (kycLien) fields.KYC = kycLien;
      if (dateExp) fields.DateExpirationKYC = new Date(dateExp).toISOString();
    }
    if (commentaireVal) fields.commentaire = commentaireVal; // nom interne SharePoint en minuscules
    if (hasColumn('StatutValidationKYC')) fields.StatutValidationKYC = 'En attente de validation';
    else console.warn('Colonne StatutValidationKYC absente de la liste Brokers : statut non enregistré.');
    if (hasColumn('DemandeParEmail')) fields.DemandeParEmail = currentUser.email;
    if (hasColumn('DateDemande')) fields.DateDemande = new Date().toISOString();
    addHistorique(fields, { historique: [] }, 'Création proposée',
      `Équipe(s) : ${equipes.join(', ')} ; ` + resumeDossier(nouvelleRisqueSel, kycLien, dateExp, piecesCochees)
      + (commentaireVal ? `\nCommentaire : ${commentaireVal}` : ''));

    const created = await graphPost(`/sites/${spSiteId}/lists/${spListBrokersId}/items`, { fields });
    if (created && created.id) {
      envoyerNotification(CPL_MAIL, `[CounterFlow] Nouvelle contrepartie à valider : ${nom}`, [
        `<strong>${esc(currentUser.name)}</strong> a proposé une nouvelle contrepartie : <strong>${esc(nom)}</strong> (${esc(equipes.join(', '))}).`,
        esc(resumeDossier(nouvelleRisqueSel, '', dateExp, piecesCochees)) + '.'
      ], { spId: created.id });
    }
    showToast(`${esc(nom)} ajoutée aux contreparties, en attente de validation compliance.`, 'success');
    await loadBrokers();
    goListe();
  } catch(e) {
    console.error(e);
    showToast(`Erreur : ${e.message}`, 'error');
    btn.disabled = false;
    btn.textContent = 'Enregistrer la contrepartie';
  }
}

function brokersToRelance() {
  // Contreparties dont le dossier OFFICIEL est bientôt expiré ou expiré, groupées par
  // équipe, y compris celles qui ont une demande en cours (signalée dans le mail).
  // Exclues : contreparties archivées et créations jamais validées.
  const parEquipe = {};
  EQUIPES.forEach(e => parEquipe[e] = []);
  brokers.forEach(b => {
    if (b.archive || estJamaisValidee(b)) return;
    const st = computeEcheance(b);
    if (st !== 'expiré' && st !== 'bientôt expiré') return;
    b.equipes.forEach(e => { if (parEquipe[e]) parEquipe[e].push(b); });
  });
  return parEquipe;
}

function goRelances() {
  if (!isCPL) return;
  const parEquipe = brokersToRelance();
  const totalCount = EQUIPES.reduce((s,e) => s + parEquipe[e].length, 0);

    showToast('Aucune contrepartie à relancer actuellement.', 'info');

      <p>Les contreparties suivantes de l'équipe <strong>${equipe}</strong> nécessitent une action sur leur dossier KYC :</p>
      ${expires.length ? `<p style="color:#DC2626;font-weight:700;margin-bottom:2px">⚠ KYC expirés (${expires.length})</p>${table(expires.map(row).join(''), '#DC2626')}` : ''}
      ${bientots.length ? `<p style="color:#C2410C;font-weight:700;margin-bottom:2px">KYC bientôt expirés (${bientots.length})</p>${table(bientots.map(row).join(''), '#C2410C')}` : ''}
      <p>Merci de mettre à jour les dossiers concernés directement dans CounterFlow.</p>
      <p style="color:#6B7280;font-size:12px">— CounterFlow · Eiffel Investment Group</p>
    </div>`;
}

async function sendRelances() {
  const parEquipe = brokersToRelance();
  const equipesAvecRelances = EQUIPES.filter(e => parEquipe[e].length > 0);
  if (!equipesAvecRelances.length) {
    showToast('Aucune contrepartie à relancer actuellement.', 'info');
    return;
  }

  const btn = document.querySelector('#view-relances [onclick="sendRelances()"]');
  btn.disabled = true;
  btn.textContent = 'Envoi en cours...';

  const sent = [];
  const failed = [];
  for (const equipe of equipesAvecRelances) {
    try {
      await graphPost('/me/sendMail', {
        message: {
          subject: '[CounterFlow] Relance KYC — contreparties à traiter',
          body: { contentType: 'HTML', content: relanceEmailBody(equipe, parEquipe[equipe]) },
          toRecipients: [{ emailAddress: { address: TEAM_EMAILS[equipe] } }]
        },
        saveToSentItems: true
      }, GRAPH_SCOPES_MAIL);
      sent.push(equipe);
    } catch(e) {
      console.error(`Relance ${equipe}:`, e);
      failed.push(equipe);
    }
  }

  if (sent.length) showToast(`${sent.length} email${sent.length>1?'s':''} de relance envoyé${sent.length>1?'s':''} : ${sent.join(', ')}.`, 'success');
  if (failed.length) showToast(`Échec de l'envoi pour : ${failed.join(', ')}.`, 'error');
  if (sent.length) goListe();
  else { btn.disabled = false; btn.textContent = 'Confirmer et envoyer les relances'; }
}

// ═══════════════════════════════════════════════════════════
// LIEN VERS LE DOCUMENT SIGNÉ (élément __CONFIG__)
// ═══════════════════════════════════════════════════════════
function closeModal() {
  document.getElementById('modal-slot').innerHTML = '';
}

function openEditLienSigne() {
  if (!isCPL) return;
  const current = counterflowConfig?.lienListeSignee || '';
  document.getElementById('modal-slot').innerHTML = `
    <div class="cf-modal-overlay" onclick="if(event.target===this)closeModal()">
      <div class="cf-modal">
        <h3 style="font-size:16px;font-weight:700;color:var(--navy);margin-bottom:6px">Lien du document signé</h3>
        <p style="font-size:12.5px;color:var(--text-secondary);margin-bottom:14px">Lien vers la liste des contreparties autorisées signée par la direction. Il est stocké dans la liste Brokers (élément de configuration), jamais dans le code.</p>
        <input type="url" id="lien-signe-input" class="form-input" autocomplete="off" style="width:100%" placeholder="https://eiffelinvestmentgroup.sharepoint.com/..." value="${esc(current)}">
        <div style="display:flex;gap:8px;justify-content:flex-end;margin-top:14px">
          <button class="btn-secondary" onclick="closeModal()">Annuler</button>
          <button class="btn-primary" onclick="submitLienSigne()">Enregistrer</button>
        </div>
      </div>
    </div>`;
  document.getElementById('lien-signe-input').focus();
}

async function submitLienSigne() {
  const lien = document.getElementById('lien-signe-input').value.trim();
  if (!lien) { showToast('Veuillez saisir un lien.', 'error'); return; }
  if (!validateExternalLink(lien, 'Lien du document signé')) return;

  try {
    // LienListeSignee est une colonne texte : la valeur s'envoie en chaîne.
    if (counterflowConfig?.spId) {
      await graphPatch(`/sites/${spSiteId}/lists/${spListBrokersId}/items/${counterflowConfig.spId}/fields`, {
        LienListeSignee: lien
      });
      counterflowConfig.lienListeSignee = lien;
    } else {
      const created = await graphPost(`/sites/${spSiteId}/lists/${spListBrokersId}/items`, {
        fields: { Title: CONFIG_TITLE, LienListeSignee: lien }
      });
      counterflowConfig = { spId: created.id, lienListeSignee: lien };
    }
    closeModal();
    showToast('Lien du document signé mis à jour.', 'success');
    renderListe(); // le bouton principal reflète immédiatement le nouveau lien
  } catch(e) {
    console.error(e);
    showToast(`Erreur : ${e.message}`, 'error');
  }
}
