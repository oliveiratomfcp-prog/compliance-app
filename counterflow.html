<script>
const msalConfig = {
  auth: {
    clientId: "56c83db2-7fc6-4826-8073-82077e91ae27",
    authority: "https://login.microsoftonline.com/eb5288b6-5ccb-4f5d-88fb-346db1317a4f",

<script>
'use strict';

// Tampon de version, affiché au chargement : permet de vérifier en console que
// le navigateur exécute bien le dernier build déployé (et pas une version en
// cache). Incrémenter à chaque correctif notable.
const CF_BUILD = '2026-08-06.3 — champ commentaire en minuscules';
console.info(`CounterFlow — build ${CF_BUILD}`);

// ═══════════════════════════════════════════════════════════
// CONFIGURATION
// ═══════════════════════════════════════════════════════════
// CounterFlow est ouvert à tous les collaborateurs authentifiés (lecture + écriture
// sur les contreparties). CPL_EMAILS conditionne l'affichage des actions compliance
// (validation, statut manuel, archivage, relances, lien signé). Ce contrôle est fait
// dans le navigateur : la vraie protection repose sur les permissions SharePoint.
// Liste CPL_EMAILS et isCPLUser() : voir cpl-config.js.

const SP = {
  hostname : 'eiffelinvestmentgroup.sharepoint.com',
  sitePath : '/sites/CPLDashboard',
  listName : 'Brokers'
};

const GRAPH_SCOPES_LOGIN = ['User.Read'];
const GRAPH_SCOPES_SP    = ['Sites.ReadWrite.All'];
const GRAPH_SCOPES_MAIL  = ['Mail.Send'];

// Title réservé à l'élément de configuration (lien vers la liste signée) : il ne
// représente pas une contrepartie et doit être exclu de tout affichage/calcul.
const CONFIG_TITLE = '__CONFIG__';

const EQUIPES = ['Trade Credit', 'Equity'];
const TEAM_EMAILS = { 'Trade Credit': 'cdt@eiffel-ig.com', 'Equity': 'eqty_pew@eiffel-ig.com' };
const NIVEAUX_RISQUE = ['Faible', 'Moyen', 'Élevé'];
const CLASSES_ACTIF = ['Actions', 'Obligations', 'Autres'];
const SEUIL_BIENTOT_JOURS = 60;

// Valeurs exactes de la colonne SharePoint "StatutValidationKYC" (choix). Utilisées
// par le contrôle de statut manuel (compliance) — voir applyStatutManuel().
const STATUTS_VALIDATION_KYC = ['Aucune demande', 'En attente de validation', 'Complément demandé', 'Validé', 'Rejeté'];
const STATUT_COMPLEMENT = 'Complément demandé';
// Statuts d'une demande ouverte ou close sans validation (la proposition reste en *_Pending)
const STATUTS_DEMANDE_OUVERTE = ['En attente de validation', STATUT_COMPLEMENT, 'Rejeté'];
const CPL_MAIL = 'cpl@eiffel-ig.com';   // destinataire des notifications de nouvelles demandes

// Pièces attendues dans le dossier de chaque contrepartie. Ces libellés doivent
// correspondre EXACTEMENT aux 15 valeurs de la colonne SharePoint "PiecesDossier"
// (et "PiecesDossier_Pending") de la liste Brokers. Le socle commun s'applique à
// tous les niveaux de risque ; la pièce "bénéficiaire effectif" varie selon que le
// niveau de risque de la contrepartie est Élevé (pièce d'identité exigée) ou non.
const PIECES_SOCLE_COMMUN = [
  "Convention (ou Terms of Business)",
  "Agrément de l'intermédiaire (cf. REGAFI)",
  "Politique de Best Execution",
  "Liste des lieux d'exécution",
  "Statuts",
  "Liste des signataires autorisés",
  "Politique en matière de prévention et de gestion des conflits d'intérêt",
  "Lettre de catégorisation en tant que « Client Professionnel »",
  "Questionnaire « intermédiaire » Eiffel complété et signé",
  "Un formulaire de consentement à traiter les ordres en dehors d'un marché réglementé ou d'un système multilatéral de négociation",
  "Rapport annuel",
  "Certificat de recherche ComplyAdvantage",
  "Contrat ISDA/CSA (ou équivalent français convention FBF)"
];
const PIECE_BENEFICIAIRE_SANS_PIECE_ID = "Identification du bénéficiaire effectif (sans pièce d'identité)";
const PIECE_BENEFICIAIRE_AVEC_PIECE_ID = "Identification du bénéficiaire effectif (avec pièce d'identité)";

// Référentiel des pièces requises, variable selon le niveau de risque de la
// contrepartie. Utilisé partout où le dossier est compté/affiché (liste, fiche
// détail, formulaires) — jamais de total fixe codé en dur ailleurs dans le fichier.
function getPiecesRequisesPourRisque(niveauRisque) {
  if (niveauRisque === 'Élevé') return [...PIECES_SOCLE_COMMUN, PIECE_BENEFICIAIRE_AVEC_PIECE_ID];
  return [...PIECES_SOCLE_COMMUN, PIECE_BENEFICIAIRE_SANS_PIECE_ID]; // Faible et Moyen
}

// ═══════════════════════════════════════════════════════════
// STATE
// ═══════════════════════════════════════════════════════════
let currentUser      = null;
let isCPL            = false;
let msalInst         = null;
let spSiteId         = null;
let spListBrokersId  = null;
let brokers          = [];    // contreparties réelles — l'item __CONFIG__ n'y entre jamais
let counterflowConfig = null; // { spId, lienListeSignee } — l'item __CONFIG__, isolé au chargement
let currentView      = 'liste';
let statusFilter     = 'all';
let equipeFilter     = 'all';
let risqueFilter     = 'all';
let demandeFilter    = 'all';
let showArchived     = false; // contreparties archivées masquées par défaut
let selectedBroker   = null;
let lastLoadedAt     = null;

// ═══════════════════════════════════════════════════════════
// AUTH MSAL
// ═══════════════════════════════════════════════════════════
async function initApp() {
  msalInst = new msal.PublicClientApplication(msalConfig);
  await msalInst.initialize();

  const accounts = msalInst.getAllAccounts();
  if (accounts.length > 0) {
    await loginWithAccount(accounts[0]);
  } else {
    showScreen('login');
  }

  document.getElementById('btn-login').onclick = async () => {
    try {
      const result = await msalInst.loginPopup({ scopes: GRAPH_SCOPES_LOGIN });
      await loginWithAccount(result.account);
    } catch(e) { console.error('Login failed:', e); }
  };

  document.getElementById('btn-logout').onclick = async () => {
    try { await msalInst.logoutPopup(); } catch(e) {}
    showScreen('login');
  };
}

async function loginWithAccount(account) {
  try {
    const token = await getToken(GRAPH_SCOPES_LOGIN, account);
    const p = await graphGet('/me', token);
    setUser({ name: p.displayName, email: p.userPrincipalName, account });
  } catch(e) {
    console.error('Token error:', e);
    showScreen('login');
  }
}

function setUser(u) {
  currentUser = u;
  isCPL = isCPLUser(u.email);
  const ini = u.name.split(' ').map(n => n[0]).join('').slice(0,2).toUpperCase();
  document.getElementById('user-avatar').textContent = ini;
  document.getElementById('user-avatar').style.background = isCPL ? '#D18F41' : '#4B5563';
  document.getElementById('user-name').textContent = u.name;
  document.getElementById('user-role').textContent = isCPL ? 'Compliance' : 'Collaborateur';
  showScreen('app');
  initSharePointThenLoad();
}

// ═══════════════════════════════════════════════════════════
// GRAPH HELPERS
// ═══════════════════════════════════════════════════════════
async function getToken(scopes, account) {
  const acc = account || currentUser?.account || msalInst.getAllAccounts()[0];
  try {
    const res = await msalInst.acquireTokenSilent({ scopes, account: acc });
    return res.accessToken;
  } catch(e) {
    if (e.name === 'InteractionRequiredAuthError' || e instanceof msal.InteractionRequiredAuthError) {
      const res = await msalInst.acquireTokenPopup({ scopes, account: acc });
      return res.accessToken;
    }
    throw e;
  }
}

async function graphGet(path, token) {
  const t = token || await getToken(GRAPH_SCOPES_SP);
  const res = await fetch(`https://graph.microsoft.com/v1.0${path}`, { headers: { Authorization: `Bearer ${t}` } });
  if (!res.ok) throw new Error(`Graph GET ${path} → ${res.status}`);
  return res.json();
}

// Lecture de toutes les pages d'une liste Graph (suivi de @odata.nextLink)
async function graphGetAll(path) {
  const base = 'https://graph.microsoft.com/v1.0';
  let data = await graphGet(path);
  const items = [...(data.value || [])];
  for (let page = 0; data['@odata.nextLink'] && page < 200; page++) {
    const next = data['@odata.nextLink'];
    data = await graphGet(next.startsWith(base) ? next.slice(base.length) : next);
    items.push(...(data.value || []));
  }
  return items;
}

async function graphPost(path, body, scopes) {
  const t = await getToken(scopes || GRAPH_SCOPES_SP);
  const res = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    method: 'POST',
    headers: { Authorization: `Bearer ${t}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) { const e = await res.text(); throw new Error(`Graph POST ${path} → ${res.status}: ${e}`); }
  return (res.status === 204 || res.status === 202) ? null : res.json();
}

async function graphPatch(path, body) {
  const t = await getToken(GRAPH_SCOPES_SP);
  const res = await fetch(`https://graph.microsoft.com/v1.0${path}`, {
    method: 'PATCH',
    headers: { Authorization: `Bearer ${t}`, 'Content-Type': 'application/json' },
    body: JSON.stringify(body)
  });
  if (!res.ok) { const e = await res.text(); throw new Error(`Graph PATCH ${path} → ${res.status}: ${e}`); }
  return (res.status === 204 || res.status === 202) ? null : res.json();
}

// ═══════════════════════════════════════════════════════════
// SHAREPOINT — initialisation + chargement
// ═══════════════════════════════════════════════════════════
async function initSharePointThenLoad() {
  setListLoading(true);
  try {
    const site = await graphGet(`/sites/${SP.hostname}:${SP.sitePath}`);
    spSiteId = site.id;

    const lists = await graphGet(`/sites/${spSiteId}/lists?$filter=displayName eq '${encodeURIComponent(SP.listName)}'`);
    spListBrokersId = lists.value[0]?.id;
    if (!spListBrokersId) throw new Error(`Liste "${SP.listName}" introuvable sur SharePoint`);

    await detectListColumns();
    await loadBrokers();
  } catch(e) {
    console.error('SharePoint init error:', e);
    setListLoading(false);
    showListError(e.message);
  }
}

// ── Colonnes existantes de la liste Brokers ─────────────────────────────────
// Sert uniquement à ne pas inclure une colonne optionnelle dans un payload si
// elle n'existe pas (un PATCH Graph échoue en 400 sur toute colonne inconnue).
// NOTE : KYC et LienListeSignee sont des colonnes "Plusieurs lignes de texte"
// (texte brut) : elles se lisent et s'écrivent comme de simples chaînes. Le
// type "Lien hypertexte" a été abandonné car l'API Graph v1.0 en refusait
// l'écriture — l'app rend les liens cliquables elle-même (renderLienCliquable).
let existingColumns = null; // Set des noms internes, null si la détection a échoué

async function detectListColumns() {
  try {
    const cols = await graphGet(`/sites/${spSiteId}/lists/${spListBrokersId}/columns`);
    existingColumns = new Set(cols.value.map(c => c.name));
    console.info('CounterFlow — colonnes de la liste Brokers :', [...existingColumns].join(', '));
  } catch(e) {
    // Détection impossible (droits, etc.) : on n'exclut rien, sans bloquer la page.
    console.warn('Détection des colonnes impossible :', e.message);
  }
}

function hasColumn(name) {
  return existingColumns === null || existingColumns.has(name); // au bénéfice du doute si détection KO
}

// Rend une valeur de lien (simple chaîne) cliquable dans le HTML.
// fallback : texte discret affiché en gris si la valeur est vide.
// attrs : attributs HTML de l'ancre (classe, style...) ; défaut lien inline navy.
function renderLienCliquable(valeur, libelle, fallback, attrs) {
  if (!valeur) return `<span class="td-muted">${fallback || 'Aucun lien'}</span>`;
  return `<a href="${esc(valeur)}" target="_blank" rel="noopener" ${attrs || 'style="color:var(--navy);font-weight:600"'}>${libelle}</a>`;
}

// Garde-fou contre les liens erronés : l'autofill du navigateur (ou un collage
// accidentel) peut remplir un input type="url" avec l'URL de CounterFlow
// elle-même. Un lien KYC / document signé doit pointer vers SharePoint, jamais
// vers cette application.
function validateExternalLink(url, champ) {
  if (!url) return false;
  try {
    const parsed = new URL(url);
    if (parsed.origin === window.location.origin) {
      showToast(`${champ} : le lien saisi pointe vers CounterFlow lui-même, pas vers le dossier SharePoint. Vérifiez le lien collé.`, 'error');
      return false;
    }
    return true;
  } catch {
    showToast(`${champ} : le lien saisi n'est pas une URL valide (elle doit commencer par https://).`, 'error');
    return false;
  }
}

const asArray = v => Array.isArray(v) ? v : (v ? [v] : []);

// Élément SharePoint → objet contrepartie (partagé par le chargement de la liste et la
// relecture d'un élément juste avant une écriture)
function parseBroker(item) {
  const f = item.fields;
  let historique = [];
  try { historique = f.HistoriqueKYC ? JSON.parse(f.HistoriqueKYC) : []; } catch (e) { historique = []; }
  return {
    spId          : item.id,
    nom           : f.Title || '',
    kycLink       : f.KYC || '',
    dateExpiration: f.DateExpirationKYC || '',
    equipes       : asArray(f.Equipe),
    niveauRisque  : f.NiveauRisque || '',
    classesActif  : asArray(f.ClasseActif),
    classeActifAutre : f.ClasseActifAutre || '',
    piecesDossier : asArray(f.PiecesDossier),
    commentaire   : f.commentaire || '', // nom interne SharePoint en minuscules (sensible à la casse)
    dernierKYCPar : f.DernierKYCPar || '',
    dateDernierKYC: f.DateDernierKYC || '',
    // Workflow de validation compliance : le dossier "proposé" (*_Pending) reste distinct
    // du dossier officiel tant que la compliance ne l'a pas validé. Il est conservé après
    // un rejet ou une demande de complément pour être corrigé sans tout ressaisir.
    statutValidationKYC  : f.StatutValidationKYC || '',
    dateExpirationPending: f.DateExpirationKYC_Pending || '',
    piecesDossierPending : asArray(f.PiecesDossier_Pending),
    kycPending    : f.KYC_Pending || '',
    niveauRisquePending: f.NiveauRisque_Pending || '',
    demandeParEmail: f.DemandeParEmail || '',
    dateDemande   : f.DateDemande || '',
    valideParEmail: f.ValideParEmail || '',
    dateValidation: f.DateValidation || '',
    motifRejet    : f.MotifRejet || '',   // motif du rejet ou message de demande de complément
    archive       : f.Archive === true,
    historique,
    _expTs        : f.DateExpirationKYC ? new Date(f.DateExpirationKYC).getTime() : 0
  };
}

// Relecture d'une contrepartie juste avant une écriture : l'historique et le statut
// utilisés sont ceux de SharePoint à cet instant, pas ceux chargés à l'ouverture de la page.
async function fetchBroker(spId) {
  return parseBroker(await graphGet(`/sites/${spSiteId}/lists/${spListBrokersId}/items/${spId}?expand=fields`));
}

async function loadBrokers() {
  setListLoading(true);
  try {
    const items = await graphGetAll(`/sites/${spSiteId}/lists/${spListBrokersId}/items?expand=fields&$top=999`);

    // Séparation stricte dès le chargement : l'item __CONFIG__ (lien vers le
    // document signé) part dans counterflowConfig, tout le reste dans brokers.
    counterflowConfig = null;
    brokers = [];
    items.forEach(item => {
      const f = item.fields;
      if ((f.Title || '').trim() === CONFIG_TITLE) {
        counterflowConfig = { spId: item.id, lienListeSignee: f.LienListeSignee || '' };
        return;
      }
      brokers.push(parseBroker(item));
    });
    brokers.sort((a,b) => a.nom.localeCompare(b.nom, 'fr'));

    lastLoadedAt = new Date();
    setListLoading(false);
    renderListe();

    // Lien profond depuis les emails : counterflow.html#<spId>
    const hash = window.location.hash.replace('#','');
    if (hash && brokers.find(b => b.spId === hash)) {
      openDetail(hash);
      history.replaceState(null, '', window.location.pathname);
    }
    return true;
  } catch(e) {
    console.error('Erreur chargement contreparties:', e);
    setListLoading(false);
    showListError(e.message);
    return false;
  }
}

async function manualRefresh() {
  const btn = document.getElementById('list-refresh-btn');
  if (btn) btn.classList.add('spinning');
  const ok = await loadBrokers();
  if (ok) showToast('Liste actualisée.', 'success');
}

function setListLoading(on) {
  const el = document.getElementById('list-loading');
  if (el) el.style.display = on ? 'flex' : 'none';
}

function showListError(msg) {
  const el = document.getElementById('list-error');
  if (el) { el.textContent = `Erreur : ${msg}`; el.style.display = 'block'; }
}

function showToast(message, type) {
  type = type || 'info';
  const icons = { success: '✓', error: '✕', info: 'i' };
  const container = document.getElementById('toast-container');
  if (!container) return;
  const toast = document.createElement('div');
  toast.className = `toast toast-${type}`;
  toast.innerHTML = `
    <span class="toast-icon">${icons[type] || icons.info}</span>
    <span>${message}</span>
    <button class="toast-close" aria-label="Fermer">&times;</button>`;
  const dismiss = () => { toast.classList.add('hide'); setTimeout(() => toast.remove(), 180); };
  toast.querySelector('.toast-close').onclick = dismiss;
  container.appendChild(toast);
  setTimeout(dismiss, 4500);
}

document.addEventListener('keydown', e => {

function goListe() { renderListe(); showView('liste'); window.scrollTo(0,0); }
